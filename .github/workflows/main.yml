name: Rustee Execution Dry-Run v3.3 (validation only)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: rustee-execution-dryrun-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build atomic Robinhood NVDA snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import json
          import pathlib
          import time
          import urllib.request
          import datetime

          OUT = pathlib.Path("data")
          ASSETS_URL = "https://api.robinhood.com/rhj/assets"
          PRICE_URL = "https://api.robinhood.com/rhj/prices/NVDA"
          CHAIN_ID = 4663
          EXPECTED_NVDA = "0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"

          def get_json(url):
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "Rustee-Broker-ReadOnly-Verifier/3.3"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          if resp.status != 200:
                              raise RuntimeError(f"HTTP {resp.status}")
                          return json.loads(resp.read().decode("utf-8"))
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"{url} failed after retries: {last}")

          assets_json = get_json(ASSETS_URL)
          prices_json = get_json(PRICE_URL)

          assets = assets_json.get(
              "assets",
              assets_json if isinstance(assets_json, list) else []
          )
          quotes = prices_json.get(
              "quotes",
              prices_json if isinstance(prices_json, list) else []
          )

          asset = next(
              (x for x in assets
               if str(x.get("tokenSymbol", "")).upper() == "NVDA"),
              None
          )
          quote = next(
              (x for x in quotes
               if str(x.get("tokenSymbol", "")).upper() == "NVDA"),
              None
          )

          if not asset:
              raise RuntimeError("NVDA missing from /rhj/assets")
          if not quote:
              raise RuntimeError("NVDA missing from /rhj/prices/NVDA")

          deployment = next(
              (d for d in asset.get("deployments", [])
               if int(d.get("chainId", -1)) == CHAIN_ID),
              None
          )
          if not deployment:
              raise RuntimeError("NVDA has no Robinhood Chain 4663 deployment")

          actual = str(deployment.get("contractAddress", ""))
          if actual.lower() != EXPECTED_NVDA.lower():
              raise RuntimeError(f"Canonical NVDA mismatch: {actual}")
          if asset.get("status") != "ASSET_STATUS_ACTIVE":
              raise RuntimeError(f"NVDA is not active: {asset.get('status')}")
          if quote.get("isTradingHalt") is True:
              raise RuntimeError("NVDA is currently halted")

          bid = float(quote["bid"])
          ask = float(quote["ask"])
          if bid <= 0 or ask <= 0 or ask < bid:
              raise RuntimeError(f"Invalid bid/ask: {bid}/{ask}")

          now = datetime.datetime.now(datetime.timezone.utc)

          snapshot = {
              "ok": True,
              "generatedAt": now.isoformat().replace("+00:00", "Z"),
              "source": {
                  "assets": ASSETS_URL,
                  "price": PRICE_URL
              },
              "workflow": "Rustee Execution Dry-Run v3.3 (validation only)",
              "network": "Robinhood Chain Mainnet",
              "chainId": CHAIN_ID,
              "expectedNvdaContract": EXPECTED_NVDA,
              "asset": asset,
              "quote": quote
          }

          (OUT / "nvda-snapshot.json").write_text(
              json.dumps(snapshot, indent=2)
          )

          print("PASS: NVDA canonical deployment")
          print("PASS: NVDA active")
          print("PASS: NVDA not halted")
          print(f"PASS: bid/ask {bid} / {ask}")
          PY

      - name: Validate snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s data/nvda-snapshot.json

          python3 <<'PY'
          import json

          p = json.load(open("data/nvda-snapshot.json"))

          assert p["ok"] is True
          assert p["chainId"] == 4663
          assert p["asset"]["tokenSymbol"] == "NVDA"
          assert p["quote"]["tokenSymbol"] == "NVDA"

          print("PASS: atomic snapshot validates")
          PY
