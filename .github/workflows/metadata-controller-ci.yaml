name: metadata-controller-ci
on:
  push:
    paths:
      - "src/RusteeMetadataController.sol"
      - "test/RusteeMetadataController.t.sol"
      - "script/DeployRusteeMetadataController.s.sol"
      - "foundry.toml"
      - ".github/workflows/metadata-controller-ci.yaml"
  pull_request:
    paths:
      - "src/RusteeMetadataController.sol"
      - "test/RusteeMetadataController.t.sol"
      - "script/DeployRusteeMetadataController.s.sol"
      - "foundry.toml"
      - ".github/workflows/metadata-controller-ci.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Ensure forge-std
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
      - name: Format check
        run: |
          forge fmt --check             src/RusteeMetadataController.sol             test/RusteeMetadataController.t.sol             script/DeployRusteeMetadataController.s.sol
      - name: Build
        run: forge build --sizes
      - name: Full tests
        run: forge test -vvv
      - name: 5,000-run metadata authority fuzz
        run: forge test --match-contract RusteeMetadataControllerTest --fuzz-runs 5000 -vv
