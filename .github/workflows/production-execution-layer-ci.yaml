name: production-execution-layer-ci

on:
  push:
    paths:
      - "src/RusteeProductionRunner.sol"
      - "src/RobinhoodRestrictedTradeAdapter.sol"
      - "src/RusteeTradingEngine.sol"
      - "src/EngineAuthorizedTradingAccount.sol"
      - "src/RusteeCapabilityRegistryV2.sol"
      - "src/vendor/ERC6551RegistryReference.sol"
      - "test/RusteeProductionExecutionLayer.t.sol"
      - "script/DeployProductionExecutionLayer.s.sol"
      - "foundry.toml"
      - ".github/workflows/production-execution-layer-ci.yaml"
  pull_request:
    paths:
      - "src/RusteeProductionRunner.sol"
      - "src/RobinhoodRestrictedTradeAdapter.sol"
      - "test/RusteeProductionExecutionLayer.t.sol"
      - "script/DeployProductionExecutionLayer.s.sol"
      - ".github/workflows/production-execution-layer-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Production Runner + restricted adapter qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Ensure forge-std
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
      - name: Format check — v3.7.4 files
        run: |
          forge fmt --check             src/RusteeProductionRunner.sol             src/RobinhoodRestrictedTradeAdapter.sol             test/RusteeProductionExecutionLayer.t.sol             script/DeployProductionExecutionLayer.s.sol
      - name: Build full Rustee contracts
        run: forge build --sizes
      - name: Full Rustee test suite
        run: forge test -vv
      - name: Production execution layer 5,000-run fuzz gate
        run: forge test --match-contract RusteeProductionExecutionLayerTest --fuzz-runs 5000 -vv
