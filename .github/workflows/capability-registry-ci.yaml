name: capability-registry-ci

on:
  push:
    paths:
      - "src/RusteeCapabilityRegistry.sol"
      - "src/RusteeCapabilityRegistryV2.sol"
      - "src/RusteeTradingEngine.sol"
      - "test/RusteeCapabilityRegistry.t.sol"
      - "test/RusteeTradingEngine.t.sol"
      - "script/DeployCapabilityRegistry.s.sol"
      - "foundry.toml"
      - ".github/workflows/capability-registry-ci.yaml"
  pull_request:
    paths:
      - "src/RusteeCapabilityRegistry.sol"
      - "src/RusteeCapabilityRegistryV2.sol"
      - "src/RusteeTradingEngine.sol"
      - "test/RusteeCapabilityRegistry.t.sol"
      - "test/RusteeTradingEngine.t.sol"
      - "script/DeployCapabilityRegistry.s.sol"
      - "foundry.toml"
      - ".github/workflows/capability-registry-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Capability registry qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Ensure forge-std
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit
          fi

      - name: Format check — capability files only
        run: |
          files=()
          for f in             src/RusteeCapabilityRegistry.sol             src/RusteeCapabilityRegistryV2.sol             src/RusteeTradingEngine.sol             test/RusteeCapabilityRegistry.t.sol             test/RusteeTradingEngine.t.sol             script/DeployCapabilityRegistry.s.sol
          do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          forge fmt --check "${files[@]}"

      - name: Build full Rustee contracts
        run: forge build --sizes

      - name: Run full Rustee test suite
        run: forge test -vvv

      - name: Capability Registry high-fuzz gate
        run: forge test --match-contract RusteeCapabilityRegistryTest --fuzz-runs 5000 -vv
