name: capability-registry-ci
on:
  push:
    paths: ["src/RusteeCapabilityRegistry.sol","test/RusteeCapabilityRegistry.t.sol","script/DeployCapabilityRegistry.s.sol","foundry.toml",".github/workflows/capability-registry-ci.yaml"]
  pull_request:
permissions: {contents: read}
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - run: test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge test --match-contract RusteeCapabilityRegistryTest --fuzz-runs 5000 -vv
