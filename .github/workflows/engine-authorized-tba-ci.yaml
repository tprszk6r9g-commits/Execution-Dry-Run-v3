name: engine-authorized-tba-ci

on:
  push:
    paths:
      - "src/EngineAuthorizedTradingAccount.sol"
      - "src/RusteeCapabilityRegistryV2.sol"
      - "src/RusteeTradingEngine.sol"
      - "test/EngineAuthorizedTradingAccount.t.sol"
      - "script/DeployEngineAuthorizedTradingGeneration.s.sol"
      - "foundry.toml"
      - ".github/workflows/engine-authorized-tba-ci.yaml"
  pull_request:
    paths:
      - "src/EngineAuthorizedTradingAccount.sol"
      - "src/RusteeCapabilityRegistryV2.sol"
      - "src/RusteeTradingEngine.sol"
      - "test/EngineAuthorizedTradingAccount.t.sol"
      - "script/DeployEngineAuthorizedTradingGeneration.s.sol"
      - "foundry.toml"
      - ".github/workflows/engine-authorized-tba-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Engine-authorized ERC-6551 qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Ensure forge-std
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
      - name: Format check — v3.7.1 files
        run: |
          forge fmt --check \
            src/EngineAuthorizedTradingAccount.sol \
            test/EngineAuthorizedTradingAccount.t.sol \
            script/DeployEngineAuthorizedTradingGeneration.s.sol
      - name: Build full Rustee contracts
        run: forge build --sizes
      - name: Full Rustee test suite
        run: forge test -vvv
      - name: Engine-authorized TBA 5,000-run fuzz gate
        run: |
          forge test \
            --match-contract EngineAuthorizedTradingAccountTest \
            --fuzz-runs 5000 \
            -vv
