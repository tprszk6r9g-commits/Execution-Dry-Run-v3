name: Rustee Authoritative Feed Gate v3.16

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v316-pages
  cancel-in-progress: true

jobs:
  authoritative-feed-gate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify authoritative Robinhood Chain feeds
        shell: bash
        env:
          NVDA_USD_FEED_ADDRESS: ${{ vars.NVDA_USD_FEED_ADDRESS }}
          ETH_USD_FEED_ADDRESS: ${{ vars.ETH_USD_FEED_ADDRESS }}
          NVDA_FEED_SOURCE_URL: ${{ vars.NVDA_FEED_SOURCE_URL }}
          ETH_FEED_SOURCE_URL: ${{ vars.ETH_FEED_SOURCE_URL }}
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import json, os, re, urllib.request, subprocess, datetime
          from pathlib import Path

          RPC="https://rpc.mainnet.chain.robinhood.com"
          ASSETS="https://api.robinhood.com/rhj/assets"
          PRICES="https://api.robinhood.com/rhj/prices/NVDA"

          def val(n):
              return os.getenv(n,"").strip()

          def address_ok(x):
              return bool(re.fullmatch(r"0x[0-9a-fA-F]{40}", x or ""))

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({
                      "jsonrpc":"2.0",
                      "id":1,
                      "method":method,
                      "params":params
                  }).encode(),
                  headers={
                      "content-type":"application/json",
                      "user-agent":"Rustee-v3.16"
                  }
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          def get_json(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Accept":"application/json",
                      "User-Agent":"Rustee-v3.16"
                  }
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          def sig(signature):
              return subprocess.check_output(
                  ["cast","sig",signature],
                  text=True
              ).strip()

          def eth_call(to,data):
              return rpc(
                  "eth_call",
                  [{"to":to,"data":data},"latest"]
              )

          def read_uint(to,signature):
              return int(eth_call(to,sig(signature)),16)

          def read_round(to):
              raw=eth_call(to,sig("latestRoundData()"))
              h=raw[2:]
              words=[h[i:i+64] for i in range(0,len(h),64)]
              if len(words)<5:
                  raise RuntimeError("latestRoundData returned <5 words")

              def sint(w):
                  n=int(w,16)
                  return n-(1<<256) if n >= (1<<255) else n

              return {
                  "roundId":int(words[0],16),
                  "answer":sint(words[1]),
                  "startedAt":int(words[2],16),
                  "updatedAt":int(words[3],16),
                  "answeredInRound":int(words[4],16)
              }

          assets=get_json(ASSETS)["assets"]
          prices=get_json(PRICES)["quotes"]
          asset=next(a for a in assets if a.get("tokenSymbol")=="NVDA")
          quote=next(q for q in prices if q.get("tokenSymbol")=="NVDA")

          multiplier=float(asset.get("currentMultiplier","1"))
          rest_mid=(float(quote["bid"])+float(quote["ask"]))/2
          expected=rest_mid*multiplier

          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())

          feed_inputs={
              "nvdaUsd":{
                  "address":val("NVDA_USD_FEED_ADDRESS"),
                  "sourceUrl":val("NVDA_FEED_SOURCE_URL")
              },
              "ethUsd":{
                  "address":val("ETH_USD_FEED_ADDRESS"),
                  "sourceUrl":val("ETH_FEED_SOURCE_URL")
              }
          }

          feeds={}
          for name,inp in feed_inputs.items():
              addr=inp["address"]
              x={
                  "address":addr or None,
                  "sourceUrl":inp["sourceUrl"] or None,
                  "present":bool(addr),
                  "validAddress":address_ok(addr)
              }

              if address_ok(addr):
                  code=rpc("eth_getCode",[addr,"latest"])
                  x["hasCode"]=code!="0x"

                  if x["hasCode"]:
                      try:
                          dec=read_uint(addr,"decimals()")
                          rd=read_round(addr)
                          x.update({
                              "aggregatorV3Readable":True,
                              "decimals":dec,
                              "round":rd,
                              "normalizedAnswer":rd["answer"]/(10**dec),
                              "ageSeconds":(
                                  now-rd["updatedAt"]
                                  if rd["updatedAt"] <= now else None
                              ),
                              "answerPositive":rd["answer"]>0,
                              "answeredInRoundGteRoundId":
                                  rd["answeredInRound"]>=rd["roundId"]
                          })
                      except Exception as e:
                          x["aggregatorV3Readable"]=False
                          x["readError"]=str(e)

              feeds[name]=x

          comparison=None
          nv=feeds["nvdaUsd"]
          if nv.get("aggregatorV3Readable"):
              observed=nv["normalizedAnswer"]
              denom=max(abs(expected),1e-12)
              diff=abs(observed-expected)/denom*100
              comparison={
                  "restBidRawUnderlyingUsd":float(quote["bid"]),
                  "restAskRawUnderlyingUsd":float(quote["ask"]),
                  "restMidRawUnderlyingUsd":rest_mid,
                  "currentMultiplier":multiplier,
                  "expectedMultiplierAdjustedUsd":expected,
                  "onchainNvdaFeedUsd":observed,
                  "absolutePercentDifference":diff,
                  "withinTwoPercent":diff<=2.0
              }

          all_readable=(
              feeds["nvdaUsd"].get("aggregatorV3Readable") is True
              and feeds["ethUsd"].get("aggregatorV3Readable") is True
          )
          semantics_ok=(
              comparison is not None
              and comparison["withinTwoPercent"]
          )
          provenance_present=(
              bool(feed_inputs["nvdaUsd"]["sourceUrl"])
              and bool(feed_inputs["ethUsd"]["sourceUrl"])
          )

          blockers=[]
          if not address_ok(feed_inputs["nvdaUsd"]["address"]):
              blockers.append("Authoritative NVDA/USD feed address not supplied")
          if not address_ok(feed_inputs["ethUsd"]["address"]):
              blockers.append("Authoritative ETH/USD feed address not supplied")
          if not provenance_present:
              blockers.append("Feed provenance URLs not supplied")
          if address_ok(feed_inputs["nvdaUsd"]["address"]) and not feeds["nvdaUsd"].get("aggregatorV3Readable"):
              blockers.append("NVDA/USD feed is not AggregatorV3-readable")
          if address_ok(feed_inputs["ethUsd"]["address"]) and not feeds["ethUsd"].get("aggregatorV3Readable"):
              blockers.append("ETH/USD feed is not AggregatorV3-readable")
          if comparison is not None and not comparison["withinTwoPercent"]:
              blockers.append("NVDA onchain feed semantics do not match multiplier-adjusted Robinhood price within 2%")

          blockers += [
              "Set production heartbeat/staleness thresholds after observing feed cadence",
              "Resolve sequencer-uptime compatibility with existing Registry design",
              "Independent security review before any mainnet Registry write"
          ]

          direct_path_candidate=(
              all_readable and semantics_ok and provenance_present
          )

          p={
              "project":"Rustee Broker Authoritative Feed Gate v3.16",
              "network":"Robinhood Chain Mainnet",
              "chainId":4663,
              "generatedAt":datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mode":"READ_ONLY",
              "officialAvailabilityEvidence":{
                  "chainlinkDataFeedsOnRobinhoodChainMainnet":True,
                  "nvdaUsdListedByChainlinkForRobinhoodChain":True,
                  "ethUsdListedByChainlinkForRobinhoodChain":True
              },
              "feeds":feeds,
              "nvdaSemanticComparison":comparison,
              "readiness":{
                  "bothFeedsAggregatorV3Readable":all_readable,
                  "nvdaMultiplierSemanticsMatch":semantics_ok,
                  "provenanceUrlsPresent":provenance_present,
                  "directDataFeedPathCandidate":direct_path_candidate
              },
              "remainingBlockers":blockers,
              "executionGate":{
                  "mainnetRegistryWritesAllowed":False,
                  "mainnetOracleDeploymentAllowed":False,
                  "mainnetFundingAllowed":False,
                  "mainnetApprovalAllowed":False,
                  "mainnetUnpauseAllowed":False,
                  "mainnetBroadcastAllowed":False,
                  "verdict":(
                      "DIRECT DATA FEED PATH PASSES READ-ONLY GATE; POLICY/SECURITY REVIEW STILL REQUIRED"
                      if direct_path_candidate
                      else
                      "WAITING FOR AUTHORITATIVE FEED ADDRESSES + PROVENANCE"
                  )
              }
          }

          Path("data/authoritative-feed-gate-v316.json").write_text(
              json.dumps(p,indent=2)
          )
          Path("authoritative-feed-gate-v316.json").write_text(
              json.dumps(p,indent=2)
          )
          print(p["executionGate"]["verdict"])
          PY

      - name: Embed v3.16 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          p=json.load(open("data/authoritative-feed-gate-v316.json"))
          h=Path("index.html").read_text()
          e=json.dumps(p,separators=(",",":")).replace("</","<\\/")
          s='<script id="v316-report" type="application/json">'+e+'</script>'
          s+='''<script>(()=>{const n=document.getElementById("v316-report");const o=document.getElementById("report");if(n&&o)o.textContent=JSON.stringify(JSON.parse(n.textContent),null,2);})();</script>'''
          Path("index.html").write_text(h.replace("</body>",s+"</body>"))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
