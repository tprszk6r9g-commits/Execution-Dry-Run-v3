name: Deploy Rustee Portfolio Terminal v2.7 Phase 7

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-portfolio-terminal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Phase 7 terminal
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Portfolio Terminal v2.7" index.html
          grep -q "Rustee Command Center" index.html
          grep -q "refreshCommandCenter" index.html
          grep -q "RECEIPT_KEY" index.html
          grep -q "Policy &amp; Security Console" index.html
          grep -q "runSecurityPreflight" index.html
          grep -q "getTradingPolicy()" index.html
          grep -q "Production Readiness Gate" index.html
          grep -q "runProductionGate" index.html
          grep -q "READ_ONLY_NO_MAINNET_WRITES" index.html
          grep -q "Rustee Multi-Asset Trading Terminal" index.html
          grep -q "Rustee Operations Center" index.html
          grep -q "USDG" index.html
          echo "PASS: Rustee Portfolio Terminal v2.7 Phase 7"

      - name: Build same-origin public snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY'
          import json, urllib.request, urllib.parse, pathlib, datetime, concurrent.futures, time
          ASSETS_URL="https://api.robinhood.com/rhj/assets"
          PRICE_BASE="https://api.robinhood.com/rhj/prices/"
          BS="https://robinhoodchain.blockscout.com/api/v2/addresses/{}/token-transfers?type=ERC-20"
          ADDRS=[
            "0x8fC320c8582f812695b6f62b2b5d13B14475B955",
            "0x8ad8bd35d33dd7b4d0de81f809f5b7f92623956d",
            "0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654",
            "0xfd0d881d73ec1476f5da0ab78283149ea21c3b32",
            "0x496d7d47ae69d65d714413f0dc78c712ed92158d"]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          def get(url,timeout=20):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Rustee-Portfolio-Terminal-v2.7"})
              last=None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=timeout) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e
                      if i<2: time.sleep(i+1)
              raise last
          assets=get(ASSETS_URL)
          pathlib.Path("data/robinhood-assets.json").write_text(json.dumps({"generatedAt":now,"assets":assets.get("assets",[])},indent=2))
          syms=[]
          for a in assets.get("assets",[]):
              if a.get("status")!="ASSET_STATUS_ACTIVE":continue
              if any(int(d.get("chainId",0))==4663 for d in a.get("deployments",[])) and a.get("tokenSymbol"):syms.append(a["tokenSymbol"])
          def price(sym):
              try:
                  d=get(PRICE_BASE+urllib.parse.quote(sym),12)
                  return sym,next((x for x in d.get("quotes",[]) if x.get("tokenSymbol")==sym),None)
              except:return sym,None
          quotes={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for sym,q in ex.map(price,syms):
                  if q:quotes[sym]=q
          pathlib.Path("data/robinhood-prices.json").write_text(json.dumps({"generatedAt":now,"quotesBySymbol":quotes},indent=2))
          by={}
          for a in ADDRS:
              try:by[a.lower()]=get(BS.format(a),15).get("items",[])
              except:by[a.lower()]=[]
          pathlib.Path("data/rustee-history.json").write_text(json.dumps({"generatedAt":now,"byAddress":by},indent=2))
          print("assets",len(assets.get("assets",[])),"quotes",len(quotes),"addresses",len(by))
          PY

      - name: Validate snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          a=json.load(open("data/robinhood-assets.json"))
          p=json.load(open("data/robinhood-prices.json"))
          h=json.load(open("data/rustee-history.json"))
          assert len(a["assets"])>0
          assert len(p["quotesBySymbol"])>0
          assert len(h["byAddress"])==5
          print("PASS snapshots")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
