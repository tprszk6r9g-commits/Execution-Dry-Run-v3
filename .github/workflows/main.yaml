name: Rustee Trade ABI Recovery v3.7.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v371-pages
  cancel-in-progress: true

jobs:
  recover-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe guarded trade candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import json, urllib.request, datetime

          RPC="https://rpc.mainnet.chain.robinhood.com"
          CHAIN=4663
          OWNER="0x8fC320c8582f812695b6f62b2b5d13B14475B955"
          OUTSIDER="0x000000000000000000000000000000000000dEaD"
          NFT="0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"
          NVDA="0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          SEL="0x6c606ce7"

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),
                  headers={"content-type":"application/json","user-agent":"Rustee-v3.7"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      j=json.loads(r.read())
              except Exception as e:
                  return {"transportError":str(e)}
              return j

          def call(data,frm):
              return rpc("eth_call",[{"to":TBA,"from":frm,"data":data},"latest"])

          def w(n): return hex(int(n))[2:].rjust(64,"0")
          def aw(a): return a.lower().replace("0x","").rjust(64,"0")

          def obs(j):
              if "result" in j: return "return:"+j["result"]
              if "error" in j:
                  e=j["error"]
                  d=e.get("data","")
                  return "revert:"+str(d)+":"+e.get("message","")
              return "transport:"+j.get("transportError","unknown")

          # Confirm binding.
          def read_addr(selector):
              j=call(selector,OWNER)
              if "result" not in j:return None
              return "0x"+j["result"][-40:].lower()

          owner_actual=read_addr("0x8da5cb5b")
          registry_actual=read_addr("0x7b103999")
          tok=call("0xfc0c546a",OWNER)
          h=tok.get("result","0x")[2:]
          words=[h[i:i+64] for i in range(0,len(h),64)] if h else []
          token_chain=int(words[0],16) if len(words)>=3 else None
          token_contract="0x"+words[1][-40:] if len(words)>=3 else None
          token_id=int(words[2],16) if len(words)>=3 else None
          binding_pass=(
              owner_actual==OWNER.lower() and
              registry_actual==REGISTRY.lower() and
              token_chain==CHAIN and
              token_contract.lower()==NFT.lower() and
              token_id==1
          )

          # Runtime shows selector expects:
          # word0 = address
          # word1 = offset to a dynamic object.
          # Probe offsets and minimum payload sizes, while keeping all payload
          # words zero. This safely exposes ABI parser thresholds.
          probes=[]

          def dyn_call(first_addr, payload_words, offset=64, frm=OWNER):
              payload="".join(w(x) for x in payload_words)
              # Dynamic object at byte offset 64 from arguments start.
              # The first dynamic word is treated as object content, not
              # assumed to be a bytes length — we are recovering a dynamic
              # tuple/struct shape.
              data=SEL+aw(first_addr)+w(offset)+payload
              return call(data,frm)

          cases=[
              ("0 words / owner",OWNER,[]),
              ("1 word / owner",OWNER,[0]),
              ("2 words / owner",OWNER,[0,0]),
              ("4 words / owner",OWNER,[0]*4),
              ("6 words / owner",OWNER,[0]*6),
              ("8 words / owner",OWNER,[0]*8),
              ("10 words / owner",OWNER,[0]*10),
              ("12 words / owner",OWNER,[0]*12),
              ("16 words / owner",OWNER,[0]*16),
              ("6 words / router",ROUTER,[0]*6),
              ("6 words / NVDA",NVDA,[0]*6),
              ("6 words / WETH",WETH,[0]*6),
          ]

          for name,a,p in cases:
              o=obs(dyn_call(a,p))
              probes.append({
                  "name":name,
                  "firstAddress":a,
                  "payloadWords":len(p),
                  "observation":o,
                  "interesting":("return:" in o or "revert:0x" in o and len(o)>20)
              })

          # Authorization comparison with the same structurally largest probe.
          owner_o=obs(dyn_call(ROUTER,[0]*16,64,OWNER))
          outsider_o=obs(dyn_call(ROUTER,[0]*16,64,OUTSIDER))
          outsider_rejected=("revert:" in outsider_o)

          # Try traceCall gracefully. Some public RPCs disable it.
          trace_req={
              "to":TBA,
              "from":OWNER,
              "data":SEL+aw(ROUTER)+w(64)+("".join(w(0) for _ in range(16)))
          }
          trace_raw=rpc("debug_traceCall",[trace_req,"latest",{"tracer":"callTracer"}])
          trace_supported=("result" in trace_raw)
          trace_summary=""
          if trace_supported:
              def walk(x,depth=0,out=None):
                  if out is None: out=[]
                  if isinstance(x,dict):
                      if x.get("to"):
                          out.append({
                              "depth":depth,
                              "from":x.get("from"),
                              "to":x.get("to"),
                              "input":x.get("input","")[:10],
                              "error":x.get("error")
                          })
                      for c in x.get("calls",[]) or []:
                          walk(c,depth+1,out)
                  return out
              calls=walk(trace_raw["result"])
              trace_summary=json.dumps(calls[:40])
          else:
              trace_summary=str(trace_raw.get("error") or trace_raw.get("transportError"))

          report={
              "project":"Rustee Broker Trade ABI Recovery v3.7",
              "network":"Robinhood Chain Mainnet",
              "chainId":CHAIN,
              "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "selector":"0x6c606ce7",
              "corrections":{
                  "selector523e3260":"Consistent with ERC-6551 isValidSigner(address,bytes); removed as trade candidate."
              },
              "binding":{
                  "pass":binding_pass,
                  "owner":owner_actual,
                  "registry":registry_actual,
                  "token":{"chainId":token_chain,"tokenContract":token_contract,"tokenId":token_id}
              },
              "probes":probes,
              "authorization":{
                  "ownerObservation":owner_o,
                  "outsiderObservation":outsider_o,
                  "outsiderRejected":outsider_rejected
              },
              "trace":{
                  "supported":trace_supported,
                  "summary":trace_summary
              },
              "recovery":{
                  "candidateSelector":"0x6c606ce7",
                  "observedTopLevelShape":"address + dynamic object",
                  "minimumDynamicRegionSuggestedByRuntime":"at least 0xc0 bytes before nested dynamic validation",
                  "exactAbiRecovered":False,
                  "nextGoal":"Recover six-word core struct and nested dynamic bytes offsets; then replay exact policy path on a fork."
              },
              "executionGate":{
                  "ready":False,
                  "verdict":"POLICY ABI RECOVERY IN PROGRESS",
                  "assetFundingAllowed":False,
                  "approvalAllowed":False,
                  "unpauseAllowed":False,
                  "broadcastAllowed":False
              }
          }

          with open("data/trade-abi-recovery.json","w") as f:
              json.dump(report,f,indent=2)

          print("PASS binding",binding_pass)
          print("PASS probes",len(probes))
          print("TRACE supported",trace_supported)
          PY

      - name: Validate report
        shell: bash
        run: |
          set -euo pipefail
          test -s data/trade-abi-recovery.json
          python3 <<'PY'
          import json
          p=json.load(open("data/trade-abi-recovery.json"))
          assert p["chainId"] == 4663
          assert p["binding"]["pass"] is True
          assert p["selector"] == "0x6c606ce7"
          assert len(p["probes"]) >= 10
          assert p["executionGate"]["broadcastAllowed"] is False
          print("PASS v3.7")
          PY

      - name: Build deterministic Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/data

          cp index.html site/index.html
          cp data/trade-abi-recovery.json site/data/trade-abi-recovery.json

          test -s site/index.html
          test -s site/data/trade-abi-recovery.json

          echo "=== site artifact ==="
          find site -maxdepth 3 -type f -print
          echo "=== report bytes ==="
          wc -c site/data/trade-abi-recovery.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload deterministic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
