name: Rustee Signed Report Replay Gate v3.13

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v313-pages
  cancel-in-progress: true

jobs:
  replay-gate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Confirm verifier and build readiness report
        shell: bash
        env:
          NVDA_STREAM_ID: ${{ vars.NVDA_STREAM_ID }}
          WETH_STREAM_ID: ${{ vars.WETH_STREAM_ID }}
          SIGNED_NVDA_REPORT_HEX: ${{ secrets.SIGNED_NVDA_REPORT_HEX }}
          SIGNED_NVDA_PARAMETER_PAYLOAD_HEX: ${{ secrets.SIGNED_NVDA_PARAMETER_PAYLOAD_HEX }}
        run: |
          set -euo pipefail
          mkdir -p data
          RPC="https://rpc.mainnet.chain.robinhood.com"
          VERIFIER="0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"
          CODE="$(cast code "$VERIFIER" --rpc-url "$RPC")"
          test "$CODE" != "0x"

          python3 <<'PY'
          import json, os, re, datetime
          from pathlib import Path

          nvda=os.getenv("NVDA_STREAM_ID","").strip()
          weth=os.getenv("WETH_STREAM_ID","").strip()
          report=os.getenv("SIGNED_NVDA_REPORT_HEX","").strip()
          params=os.getenv("SIGNED_NVDA_PARAMETER_PAYLOAD_HEX","").strip()

          b32=lambda x: bool(re.fullmatch(r"0x[0-9a-fA-F]{64}",x))
          hx=lambda x: bool(re.fullmatch(r"0x(?:[0-9a-fA-F]{2})*",x))

          ready=(b32(nvda) and b32(weth) and bool(report) and hx(report)
                 and bool(params) and hx(params))

          p={
            "project":"Rustee Broker Signed Report Replay Gate v3.13",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"NO_MAINNET_WRITES",
            "verifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
            "verifierProxyHasCode":True,
            "inputs":{
              "nvdaStreamIdPresent":bool(nvda),
              "nvdaStreamIdValidBytes32":b32(nvda),
              "wethStreamIdPresent":bool(weth),
              "wethStreamIdValidBytes32":b32(weth),
              "signedNvdaReportPresent":bool(report),
              "signedNvdaReportHexValid":hx(report) if report else False,
              "parameterPayloadPresent":bool(params),
              "parameterPayloadHexValid":hx(params) if params else False
            },
            "realSignedReplay":{
              "readyToAttemptOnFork":ready,
              "attempted":False,
              "verified":False
            },
            "requiredRepositoryVariables":["NVDA_STREAM_ID","WETH_STREAM_ID"],
            "requiredRepositorySecrets":[
              "SIGNED_NVDA_REPORT_HEX",
              "SIGNED_NVDA_PARAMETER_PAYLOAD_HEX"
            ],
            "executionGate":{
              "mainnetDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":(
                "INPUTS PRESENT; LOCAL-FORK REPLAY MAY RUN"
                if ready else
                "WAITING FOR EXACT FEED IDS + REAL SIGNED REPORT INPUTS"
              )
            }
          }

          Path("data/signed-report-v313.json").write_text(json.dumps(p,indent=2))
          Path("signed-report-v313.json").write_text(json.dumps(p,indent=2))
          PY

      - name: Embed v3.13 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("data/signed-report-v313.json"))
          h=Path("index.html").read_text()
          e=json.dumps(p,separators=(",",":")).replace("</","<\\/")
          script='<script id="v313-report" type="application/json">'+e+'</script>'
          script+='''<script>(()=>{const n=document.getElementById("v313-report");const o=document.getElementById("report");if(n&&o)o.textContent=JSON.stringify(JSON.parse(n.textContent),null,2);})();</script>'''
          Path("index.html").write_text(h.replace("</body>",script+"</body>"))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
