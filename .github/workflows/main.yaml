name: Rustee Broker Production Input Resolution v4.9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the same Pages concurrency group so old workflows cannot collide.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  production-input-resolution:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PUBLIC_RPC_URL: https://rpc.mainnet.chain.robinhood.com

      # Required to pass the historical evidence gate.
      ARCHIVE_RPC_URL: ${{ secrets.ARCHIVE_RPC_URL }}

      # OPTION A — authoritative AggregatorV3 ETH/USD path.
      ETH_USD_FEED_ADDRESS: ${{ vars.ETH_USD_FEED_ADDRESS }}
      ETH_USD_PROVENANCE_URL: ${{ vars.ETH_USD_PROVENANCE_URL }}
      ETH_USD_HEARTBEAT_SECONDS: ${{ vars.ETH_USD_HEARTBEAT_SECONDS }}

      # OPTION B — Chainlink Data Streams path.
      ETH_USD_DATA_STREAM_ID: ${{ vars.ETH_USD_DATA_STREAM_ID }}
      ETH_USD_DATA_STREAM_PROVENANCE_URL: ${{ vars.ETH_USD_DATA_STREAM_PROVENANCE_URL }}

      # Production sequencer design must be an explicit operator choice.
      # Allowed values:
      #   REGISTRY_V2_CHAIN_SPECIFIC_GUARD
      #   KEEP_CURRENT_REGISTRY_PAUSED
      SEQUENCER_PRODUCTION_OPTION: ${{ vars.SEQUENCER_PRODUCTION_OPTION }}

      # Independent review is intentionally an explicit operator/auditor gate.
      # Set to an audit artifact URL only after a real independent review.
      ORACLE_AUDIT_URL: ${{ vars.ORACLE_AUDIT_URL }}
      ADAPTER_AUDIT_URL: ${{ vars.ADAPTER_AUDIT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify canonical deployed state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="$PUBLIC_RPC_URL"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          VERIFIER="0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"

          CHAIN_ID="$(cast chain-id --rpc-url "$RPC")"
          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          FEE="$(cast call "$POOL" 'fee()(uint24)' --rpc-url "$RPC" | awk '{print $1}')"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"
          REG_CODE="$(cast code "$REGISTRY" --rpc-url "$RPC")"
          TBA_CODE="$(cast code "$TBA" --rpc-url "$RPC")"
          VERIFIER_CODE="$(cast code "$VERIFIER" --rpc-url "$RPC")"

          python3 - "$CHAIN_ID" "$TOKEN0" "$TOKEN1" "$FEE" "$LIQ" "$REG_CODE" "$TBA_CODE" "$VERIFIER_CODE" <<'PY'
          import json,sys
          from pathlib import Path

          chain,token0,token1,fee,liq,reg_code,tba_code,verifier_code=sys.argv[1:]
          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"
          stonk="0xe934e36a439c94017b64a3fece66af12099abf50"

          out={
            "chainId":int(chain),
            "pool":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
            "token0":token0.lower(),
            "token1":token1.lower(),
            "fee":int(fee),
            "pairMatches":{token0.lower(),token1.lower()}=={weth,stonk},
            "liquidity":str(int(liq)),
            "liquidityNonZero":int(liq)>0,
            "registry":"0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199",
            "registryHasCode":len(reg_code)>2,
            "tradingTba":"0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654",
            "tradingTbaHasCode":len(tba_code)>2,
            "dataStreamsVerifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
            "dataStreamsVerifierProxyHasCode":len(verifier_code)>2
          }

          assert out["chainId"]==4663
          assert out["pairMatches"]
          assert out["liquidityNonZero"]
          assert out["registryHasCode"]
          assert out["tradingTbaHasCode"]
          assert out["dataStreamsVerifierProxyHasCode"]

          Path("data/v49-binding.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Resolve archive evidence gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os,urllib.request,datetime
          from pathlib import Path

          PUBLIC=os.environ["PUBLIC_RPC_URL"]
          ARCHIVE=os.environ.get("ARCHIVE_RPC_URL","").strip()
          RPC=ARCHIVE or PUBLIC

          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          OBSERVE_SELECTOR="0x883bdbfd"
          LIQ_SELECTOR="0x1a686502"
          WINDOW=1800

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({
                    "jsonrpc":"2.0","id":1,"method":method,"params":params
                  }).encode(),
                  headers={
                    "content-type":"application/json",
                    "user-agent":"Rustee-v4.9"
                  }
              )
              with urllib.request.urlopen(req,timeout=40) as r:
                  j=json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          def word(n):
              return int(n).to_bytes(32,"big").hex()

          def observe_data(window):
              return OBSERVE_SELECTOR+word(32)+word(2)+word(window)+word(0)

          def u256(b,o):
              return int.from_bytes(b[o:o+32],"big")

          def signed56(b,o):
              raw=u256(b,o)&((1<<56)-1)
              if raw&(1<<55): raw-=1<<56
              return raw

          def decode_observe(h):
              b=bytes.fromhex(h[2:])
              off=u256(b,0)
              n=u256(b,off)
              vals=[signed56(b,off+32+32*i) for i in range(n)]
              if len(vals)!=2:
                  raise RuntimeError("unexpected observe return")
              return vals

          def mean_tick(delta,window):
              q=abs(delta)//window
              q=-q if delta<0 else q
              if delta<0 and abs(delta)%window: q-=1
              if not -887272 <= q <= 887272:
                  raise RuntimeError("tick out of bounds")
              return q

          latest_num=int(rpc("eth_blockNumber",[]),16)
          latest=rpc("eth_getBlockByNumber",[hex(latest_num),False])
          latest_ts=int(latest["timestamp"],16)
          cache={latest_num:latest}

          def get_block(n):
              if n not in cache:
                  cache[n]=rpc("eth_getBlockByNumber",[hex(n),False])
              if cache[n] is None:
                  raise RuntimeError(f"block unavailable: {n}")
              return cache[n]

          def find_block(ts_target):
              lo=max(0,latest_num-8_500_000)
              hi=latest_num
              best=lo
              while lo<=hi:
                  mid=(lo+hi)//2
                  b=get_block(mid)
                  ts=int(b["timestamp"],16)
                  if ts<=ts_target:
                      best=mid
                      lo=mid+1
                  else:
                      hi=mid-1
              return best

          lookbacks=[0,1,2,4,8,12,18,24,36,48,72,96,120,168]
          rows=[]
          for hrs in lookbacks:
              try:
                  bn=latest_num if hrs==0 else find_block(latest_ts-hrs*3600)
                  tag=hex(bn)
                  block=get_block(bn)
                  ticks=decode_observe(
                      rpc("eth_call",[{"to":POOL,"data":observe_data(WINDOW)},tag])
                  )
                  liq=int(
                      rpc("eth_call",[{"to":POOL,"data":LIQ_SELECTOR},tag]),16
                  )
                  rows.append({
                    "lookbackHours":hrs,
                    "available":True,
                    "blockNumber":bn,
                    "blockTimestamp":int(block["timestamp"],16),
                    "meanTick":mean_tick(ticks[1]-ticks[0],WINDOW),
                    "liquidity":str(liq)
                  })
              except Exception as e:
                  rows.append({
                    "lookbackHours":hrs,
                    "available":False,
                    "error":str(e)[:500]
                  })

          available=[r for r in rows if r["available"]]
          liqs=[int(r["liquidity"]) for r in available]
          latest_liq=liqs[0] if liqs else 0
          min_pct=(min(liqs)/latest_liq*100) if latest_liq else None

          out={
            "archiveRpcConfigured":bool(ARCHIVE),
            "rpcMode":"ARCHIVE_VARIABLE" if ARCHIVE else "PUBLIC_FALLBACK",
            "requestedSamples":len(rows),
            "availableSamples":len(available),
            "archiveEvidencePass":bool(ARCHIVE) and len(available)>=8,
            "liquidityContinuityPass":bool(
                liqs and min_pct is not None and min_pct>=50.0
            ),
            "liquidityMin":str(min(liqs)) if liqs else None,
            "liquidityMax":str(max(liqs)) if liqs else None,
            "liquidityMinVsLatestPct":min_pct,
            "samples":rows
          }

          Path("data/v49-archive.json").write_text(
              json.dumps(out,indent=2,allow_nan=False)
          )
          print(json.dumps(out,indent=2,allow_nan=False))
          PY

      - name: Resolve ETH USD candidate path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path

          rpc=os.environ["PUBLIC_RPC_URL"]

          agg_addr=os.environ.get("ETH_USD_FEED_ADDRESS","").strip()
          agg_prov=os.environ.get("ETH_USD_PROVENANCE_URL","").strip()
          agg_hb=os.environ.get("ETH_USD_HEARTBEAT_SECONDS","").strip()

          stream_id=os.environ.get("ETH_USD_DATA_STREAM_ID","").strip()
          stream_prov=os.environ.get(
              "ETH_USD_DATA_STREAM_PROVENANCE_URL",""
          ).strip()

          agg={
            "mode":"AGGREGATOR_V3",
            "address":agg_addr or None,
            "addressValid":bool(re.fullmatch(r"0x[0-9a-fA-F]{40}",agg_addr)),
            "provenanceUrl":agg_prov or None,
            "provenancePresent":agg_prov.startswith("https://"),
            "heartbeatSeconds":int(agg_hb) if agg_hb.isdigit() else None,
            "heartbeatValid":agg_hb.isdigit() and int(agg_hb)>0,
            "hasCode":False,
            "aggregatorV3Readable":False,
            "decimals":None,
            "answer":None,
            "updatedAt":None,
            "ageSeconds":None,
            "notStale":False,
            "ready":False
          }

          if agg["addressValid"]:
              code=subprocess.check_output(
                  ["cast","code",agg_addr,"--rpc-url",rpc],text=True
              ).strip()
              agg["hasCode"]=len(code)>2

              if agg["hasCode"]:
                  try:
                      dec=subprocess.check_output(
                          ["cast","call",agg_addr,"decimals()(uint8)","--rpc-url",rpc],
                          text=True
                      ).strip().split()[0]
                      rd=subprocess.check_output(
                          ["cast","call",agg_addr,
                           "latestRoundData()(uint80,int256,uint256,uint256,uint80)",
                           "--rpc-url",rpc],
                          text=True
                      ).strip().splitlines()
                      vals=[x.strip().split()[0] for x in rd if x.strip()]
                      agg["decimals"]=int(dec)
                      agg["answer"]=int(vals[1])
                      agg["updatedAt"]=int(vals[3])
                      agg["ageSeconds"]=max(0,int(time.time())-agg["updatedAt"])
                      agg["aggregatorV3Readable"]=agg["answer"]>0 and agg["updatedAt"]>0
                      if agg["heartbeatValid"]:
                          agg["notStale"]=agg["ageSeconds"] <= agg["heartbeatSeconds"]
                  except Exception as e:
                      agg["readError"]=str(e)[:500]

          agg["ready"]=all([
              agg["addressValid"],agg["provenancePresent"],
              agg["heartbeatValid"],agg["hasCode"],
              agg["aggregatorV3Readable"],agg["notStale"]
          ])

          streams={
            "mode":"CHAINLINK_DATA_STREAMS",
            "verifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
            "feedId":stream_id or None,
            "feedIdValidBytes32":bool(
                re.fullmatch(r"0x[0-9a-fA-F]{64}",stream_id)
            ),
            "provenanceUrl":stream_prov or None,
            "provenancePresent":stream_prov.startswith("https://"),
            "credentialsRequiredForLiveRetrieval":True,
            "signedReportReplayAttempted":False,
            "readyForSignedReportReplay":False,
            "productionReady":False
          }
          streams["readyForSignedReportReplay"]=bool(
              streams["feedIdValidBytes32"] and streams["provenancePresent"]
          )

          selected=(
              "AGGREGATOR_V3" if agg["ready"]
              else "CHAINLINK_DATA_STREAMS"
              if streams["readyForSignedReportReplay"]
              else None
          )

          out={
            "aggregatorV3":agg,
            "dataStreams":streams,
            "selectedCandidatePath":selected,
            "candidateConfigured":selected is not None,
            "productionReady":agg["ready"]
          }

          Path("data/v49-eth-usd.json").write_text(
              json.dumps(out,indent=2)
          )
          print(json.dumps(out,indent=2))
          PY

      - name: Resolve sequencer production decision
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from pathlib import Path

          selected=os.environ.get("SEQUENCER_PRODUCTION_OPTION","").strip()
          allowed={
            "REGISTRY_V2_CHAIN_SPECIFIC_GUARD",
            "KEEP_CURRENT_REGISTRY_PAUSED"
          }

          valid=selected in allowed

          out={
            "documentedFeed":"wss://feed.mainnet.chain.robinhood.com",
            "documentedFeedType":"WEBSOCKET_NITRO_SEQUENCER_FEED",
            "aggregatorV3UptimeFeedDocumented":False,
            "decisionRule":"DO_NOT_INVENT_AGGREGATOR_V3_SEQUENCER_ADDRESS",
            "selectedProductionOption":selected or None,
            "selectionValid":valid,
            "requiresNewContractReview":
              selected=="REGISTRY_V2_CHAIN_SPECIFIC_GUARD",
            "allowsExistingRegistryToRemainPaused":
              selected=="KEEP_CURRENT_REGISTRY_PAUSED",
            "productionDesignSelected":valid
          }

          Path("data/v49-sequencer.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Resolve independent review evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from pathlib import Path

          oracle=os.environ.get("ORACLE_AUDIT_URL","").strip()
          adapter=os.environ.get("ADAPTER_AUDIT_URL","").strip()

          def valid_url(x):
              return x.startswith("https://") and len(x)>12

          out={
            "oracleAuditUrl":oracle or None,
            "oracleAuditEvidencePresent":valid_url(oracle),
            "adapterAuditUrl":adapter or None,
            "adapterAuditEvidencePresent":valid_url(adapter),
            "independentSecurityReviewComplete":
              valid_url(oracle) and valid_url(adapter),
            "importantBoundary":
              "A URL is evidence input, not proof by itself. Human review of "
              "scope, auditor identity, findings, commit hashes and remediation "
              "is still required before any live write."
          }

          Path("data/v49-audit.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Build v4.9 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,datetime
          from pathlib import Path

          binding=json.load(open("data/v49-binding.json"))
          archive=json.load(open("data/v49-archive.json"))
          eth=json.load(open("data/v49-eth-usd.json"))
          seq=json.load(open("data/v49-sequencer.json"))
          audit=json.load(open("data/v49-audit.json"))

          blockers=[]

          if not archive["archiveEvidencePass"]:
              blockers.append(
                "Archive evidence gate has not passed: set ARCHIVE_RPC_URL "
                "and obtain >=8 successful historical samples"
              )

          if not eth["candidateConfigured"]:
              blockers.append(
                "No authoritative ETH/USD production candidate is configured"
              )
          elif eth["selectedCandidatePath"]=="CHAINLINK_DATA_STREAMS":
              blockers.append(
                "Data Streams candidate is configured but real signed-report "
                "retrieval/replay and verifier integration remain"
              )

          if not seq["productionDesignSelected"]:
              blockers.append(
                "Choose SEQUENCER_PRODUCTION_OPTION explicitly"
              )

          if seq["requiresNewContractReview"]:
              blockers.append(
                "Selected Registry V2 chain-specific guard requires contract "
                "implementation, fork tests and independent review"
              )

          if not audit["independentSecurityReviewComplete"]:
              blockers.append(
                "Independent oracle + adapter audit evidence is incomplete"
              )

          # Critical safety rule:
          # v4.9 is a resolution/readiness report, never an execution workflow.
          all_inputs_resolved=all([
              archive["archiveEvidencePass"],
              archive["liquidityContinuityPass"],
              eth["candidateConfigured"],
              seq["productionDesignSelected"],
              audit["independentSecurityReviewComplete"]
          ])

          report={
            "project":"Rustee Broker Production Input Resolution v4.9",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":
              datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"READ_ONLY_NO_MAINNET_WRITES",
            "binding":binding,
            "archiveEvidence":{
              k:v for k,v in archive.items() if k!="samples"
            },
            "ethUsdResolution":eth,
            "sequencerResolution":seq,
            "securityReviewEvidence":audit,
            "readiness":{
              "bindingVerified":True,
              "archiveEvidencePass":archive["archiveEvidencePass"],
              "liquidityContinuityPass":
                archive["liquidityContinuityPass"],
              "ethUsdCandidateConfigured":eth["candidateConfigured"],
              "sequencerProductionDesignSelected":
                seq["productionDesignSelected"],
              "securityReviewEvidenceComplete":
                audit["independentSecurityReviewComplete"],
              "allProductionInputsResolved":all_inputs_resolved,
              "readyForFinalMainnetPreflight":all_inputs_resolved,
              "readyForMainnetWrites":False
            },
            "remainingBlockers":blockers,
            "nextPhase":
              "v5.0 FINAL MAINNET TRANSACTION PREFLIGHT"
              if all_inputs_resolved
              else "Resolve the remaining v4.9 blockers before v5.0",
            "executionGate":{
              "mainnetOracleDeploymentAllowed":False,
              "mainnetAdapterDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":
                "V4.9 INPUT RESOLUTION COMPLETE; "
                + (
                  "ALL INPUT GATES RESOLVED — PROCEED TO SEPARATE V5.0 "
                  "FINAL PREFLIGHT, STILL NO BROADCAST"
                  if all_inputs_resolved else
                  "ONE OR MORE PRODUCTION INPUT GATES REMAIN UNRESOLVED"
                )
            }
          }

          Path("data/v49-report.json").write_text(
              json.dumps(report,indent=2,allow_nan=False)
          )
          print(json.dumps(report,indent=2,allow_nan=False))
          PY

      - name: Validate zero-write invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p=json.load(open("data/v49-report.json"))
          assert p["mode"]=="READ_ONLY_NO_MAINNET_WRITES"
          assert p["readiness"]["readyForMainnetWrites"] is False
          for k,v in p["executionGate"].items():
              if k.endswith("Allowed"):
                  assert v is False, (k,v)
          print("PASS: v4.9 has no mainnet write authority")
          PY

      - name: Embed v4.9 report into page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html
          from pathlib import Path

          report=Path("data/v49-report.json").read_text()
          esc=html.escape(report)

          page=f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Rustee Broker v4.9</title>
            <style>
              :root{{--bg:#041c17;--panel:#08271f;--line:#2e6c5e;
              --text:#eafff8;--muted:#9bc0b7;--teal:#37dfc3;--orange:#ff9a36}}
              *{{box-sizing:border-box}}
              body{{margin:0;background:var(--bg);color:var(--text);
              font-family:system-ui,-apple-system,Segoe UI,sans-serif}}
              main{{max-width:920px;margin:auto;padding:28px 18px 90px}}
              .pill{{display:inline-block;border:1px solid var(--line);
              border-radius:999px;padding:11px 15px;color:var(--teal)}}
              h1{{font-size:clamp(38px,8vw,62px);line-height:1.02}}
              p{{color:var(--muted);font-size:18px;line-height:1.55}}
              .warn{{border-left:8px solid var(--orange);background:#36200b;
              padding:20px;border-radius:18px;margin:24px 0;line-height:1.5}}
              .card{{border:1px solid var(--line);border-radius:24px;
              padding:24px;background:var(--panel);margin:20px 0}}
              pre{{white-space:pre-wrap;word-break:break-word;background:#03130f;
              border:1px solid #24584c;border-radius:18px;padding:18px;
              overflow:auto;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}}
            </style>
          </head>
          <body>
            <main>
              <span class="pill">Robinhood Chain · v4.9 · READ ONLY</span>
              <h1>Production Input Resolution</h1>
              <p>Archive evidence, ETH/USD candidate selection, sequencer design,
              and independent review evidence are resolved here before the
              separate final mainnet preflight.</p>
              <div class="warn"><b>No mainnet writes.</b> Even a fully green
              v4.9 report only unlocks the next preflight phase; it does not
              deploy, configure, fund, approve, unpause, or trade.</div>
              <div class="card"><pre>{esc}</pre></div>
            </main>
          </body>
          </html>"""
          Path("index.html").write_text(page)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
