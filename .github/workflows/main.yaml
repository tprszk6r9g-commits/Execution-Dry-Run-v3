name: Rustee Data Streams Onboarding v3.14

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v314-pages
  cancel-in-progress: true

jobs:
  onboarding:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build onboarding report
        shell: bash
        env:
          NVDA_STREAM_ID: ${{ vars.NVDA_STREAM_ID }}
          WETH_STREAM_ID: ${{ vars.WETH_STREAM_ID }}
          CHAINLINK_DATA_STREAMS_ENDPOINT: ${{ vars.CHAINLINK_DATA_STREAMS_ENDPOINT }}
          CHAINLINK_DATA_STREAMS_CLIENT_ID: ${{ secrets.CHAINLINK_DATA_STREAMS_CLIENT_ID }}
          CHAINLINK_DATA_STREAMS_CLIENT_SECRET: ${{ secrets.CHAINLINK_DATA_STREAMS_CLIENT_SECRET }}
          SIGNED_NVDA_REPORT_HEX: ${{ secrets.SIGNED_NVDA_REPORT_HEX }}
          SIGNED_NVDA_PARAMETER_PAYLOAD_HEX: ${{ secrets.SIGNED_NVDA_PARAMETER_PAYLOAD_HEX }}
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY'
          import json, os, re, datetime
          from pathlib import Path

          def val(n): return os.getenv(n,"").strip()
          def present(n): return bool(val(n))
          def b32(n): return bool(re.fullmatch(r"0x[0-9a-fA-F]{64}", val(n)))
          def hx(n):
              x=val(n)
              return bool(x and re.fullmatch(r"0x(?:[0-9a-fA-F]{2})*", x))

          ids_ready=b32("NVDA_STREAM_ID") and b32("WETH_STREAM_ID")
          auth_ready=present("CHAINLINK_DATA_STREAMS_CLIENT_ID") and present("CHAINLINK_DATA_STREAMS_CLIENT_SECRET")
          report_ready=hx("SIGNED_NVDA_REPORT_HEX") and hx("SIGNED_NVDA_PARAMETER_PAYLOAD_HEX")

          if ids_ready and report_ready:
              verdict="READY TO RE-RUN v3.13 LOCAL-FORK SIGNED REPORT REPLAY"
          elif ids_ready and auth_ready:
              verdict="FEED IDS + AUTH READY; ACQUIRE A GENUINE SIGNED NVDA REPORT"
          elif ids_ready:
              verdict="FEED IDS READY; AUTHENTICATED DATA STREAMS ACCESS STILL REQUIRED"
          else:
              verdict="WAITING FOR EXACT PRODUCTION STREAM IDS"

          p={
            "project":"Rustee Broker Data Streams Onboarding v3.14",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"NO_MAINNET_WRITES",
            "authoritativeFacts":{
              "robinhoodChainUsesChainlink":True,
              "dataStreamsVerifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
              "nvdaRestPriceMultiplierAdjusted":False,
              "nvdaOnchainChainlinkPriceMultiplierAdjusted":True
            },
            "repositoryVariables":{
              "NVDA_STREAM_ID":{"present":present("NVDA_STREAM_ID"),"validBytes32":b32("NVDA_STREAM_ID")},
              "WETH_STREAM_ID":{"present":present("WETH_STREAM_ID"),"validBytes32":b32("WETH_STREAM_ID")},
              "CHAINLINK_DATA_STREAMS_ENDPOINT":{"present":present("CHAINLINK_DATA_STREAMS_ENDPOINT")}
            },
            "repositorySecrets":{
              "CHAINLINK_DATA_STREAMS_CLIENT_ID":present("CHAINLINK_DATA_STREAMS_CLIENT_ID"),
              "CHAINLINK_DATA_STREAMS_CLIENT_SECRET":present("CHAINLINK_DATA_STREAMS_CLIENT_SECRET"),
              "SIGNED_NVDA_REPORT_HEX":{"present":present("SIGNED_NVDA_REPORT_HEX"),"validHex":hx("SIGNED_NVDA_REPORT_HEX")},
              "SIGNED_NVDA_PARAMETER_PAYLOAD_HEX":{"present":present("SIGNED_NVDA_PARAMETER_PAYLOAD_HEX"),"validHex":hx("SIGNED_NVDA_PARAMETER_PAYLOAD_HEX")}
            },
            "readiness":{
              "feedIdsReady":ids_ready,
              "authenticatedDataStreamsAccessReady":auth_ready,
              "signedReportInputsReady":report_ready,
              "v313ReplayReady":ids_ready and report_ready
            },
            "executionGate":{
              "mainnetDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":verdict
            }
          }
          Path("data/datastreams-onboarding-v314.json").write_text(json.dumps(p,indent=2))
          Path("datastreams-onboarding-v314.json").write_text(json.dumps(p,indent=2))
          PY

      - name: Embed report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("data/datastreams-onboarding-v314.json"))
          h=Path("index.html").read_text()
          e=json.dumps(p,separators=(",",":")).replace("</","<\\/")
          s='<script id="v314-report" type="application/json">'+e+'</script>'
          s+='''<script>(()=>{const n=document.getElementById("v314-report");const o=document.getElementById("report");if(n&&o)o.textContent=JSON.stringify(JSON.parse(n.textContent),null,2);})();</script>'''
          Path("index.html").write_text(h.replace("</body>",s+"</body>"))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
