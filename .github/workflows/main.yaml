name: Rustee Production Discovery v3.11.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v311-pages
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install v3.11 candidate adapter source
        shell: bash
        run: |
          set -euo pipefail

          # Isolate this compile from stale Foundry files left by earlier phases.
          # `forge build` can compile Solidity under test/ as part of the project,
          # so the old RusteeFork.t.sol must not remain in this v3.11 build.
          rm -rf src test script out cache
          rm -f foundry.toml
          mkdir -p src data

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          out = "out"
          solc_version = "0.8.26"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          EOF

          cat > src/RusteeNvdaRouterAdapter.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface ISwapRouter02 {
              struct ExactOutputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountOut;
                  uint256 amountInMaximum;
                  uint160 sqrtPriceLimitX96;
              }

              function exactOutputSingle(
                  ExactOutputSingleParams calldata params
              ) external payable returns (uint256 amountIn);
          }

          interface IStockTokenVenueAdapter {
              struct TradeRequest {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  uint256 deadline;
                  bytes venueData;
              }

              struct TradePlan {
                  address venue;
                  address spender;
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  address recipient;
                  bytes callData;
              }

              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan);
          }

          contract RusteeNvdaRouterAdapter is IStockTokenVenueAdapter {
              address public immutable WETH;
              address public immutable NVDA;
              address public immutable ROUTER;
              uint24 public immutable fee;

              error UnsupportedPair();
              error Expired();
              error EmptyTrade();

              constructor(
                  address weth_,
                  address nvda_,
                  address router_,
                  uint24 fee_
              ) {
                  if (
                      weth_ == address(0) ||
                      nvda_ == address(0) ||
                      router_ == address(0)
                  ) revert UnsupportedPair();

                  WETH = weth_;
                  NVDA = nvda_;
                  ROUTER = router_;
                  fee = fee_;
              }

              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan) {
                  if (
                      request.tokenIn != WETH ||
                      request.tokenOut != NVDA
                  ) revert UnsupportedPair();

                  if (block.timestamp > request.deadline) revert Expired();

                  if (
                      request.amountIn == 0 ||
                      request.minAmountOut == 0
                  ) revert EmptyTrade();

                  bytes memory callData = abi.encodeCall(
                      ISwapRouter02.exactOutputSingle,
                      (
                          ISwapRouter02.ExactOutputSingleParams({
                              tokenIn: WETH,
                              tokenOut: NVDA,
                              fee: fee,
                              recipient: tradingAccount,
                              amountOut: request.minAmountOut,
                              amountInMaximum: request.amountIn,
                              sqrtPriceLimitX96: 0
                          })
                      )
                  );

                  plan = TradePlan({
                      venue: ROUTER,
                      spender: ROUTER,
                      tokenIn: WETH,
                      tokenOut: NVDA,
                      amountIn: request.amountIn,
                      minAmountOut: request.minAmountOut,
                      recipient: tradingAccount,
                      callData: callData
                  });
              }
          }
          EOF

          forge build

      - name: Build read-only production discovery report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import urllib.request
          import hashlib
          import datetime
          from pathlib import Path

          RPC = "https://rpc.mainnet.chain.robinhood.com"
          ASSETS = "https://api.robinhood.com/rhj/assets"
          PRICES = "https://api.robinhood.com/rhj/prices/NVDA"

          CHAIN_ID = 4663
          WETH = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          NVDA = "0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"
          ROUTER = "0xCaf681a66D020601342297493863E78C959E5cb2"
          REGISTRY = "0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA = "0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          VERIFIER_PROXY = "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Rustee-v3.11-discovery"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def rpc(method, params):
              req = urllib.request.Request(
                  RPC,
                  data=json.dumps({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": method,
                      "params": params
                  }).encode(),
                  headers={
                      "content-type": "application/json",
                      "user-agent": "Rustee-v3.11-discovery"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  j = json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          assets_json = get_json(ASSETS)
          prices_json = get_json(PRICES)

          asset = next(
              a for a in assets_json["assets"]
              if a.get("tokenSymbol") == "NVDA"
          )
          quote = next(
              q for q in prices_json["quotes"]
              if q.get("tokenSymbol") == "NVDA"
          )
          deployment = next(
              d for d in asset["deployments"]
              if int(d["chainId"]) == CHAIN_ID
          )

          multiplier = asset.get("currentMultiplier")
          pending_multiplier = asset.get("pendingMultiplier", "")
          pending_time = asset.get("pendingMultiplierEffectiveTime")

          verifier_code = rpc(
              "eth_getCode",
              [VERIFIER_PROXY, "latest"]
          )
          verifier_has_code = len(verifier_code) > 2

          adapter_artifact = Path(
              "out/RusteeNvdaRouterAdapter.sol/"
              "RusteeNvdaRouterAdapter.json"
          )
          compiled = json.load(open(adapter_artifact))
          bytecode = compiled["bytecode"]["object"]
          deployed_bytecode = compiled["deployedBytecode"]["object"]

          source_bytes = Path(
              "src/RusteeNvdaRouterAdapter.sol"
          ).read_bytes()

          source_sha256 = hashlib.sha256(source_bytes).hexdigest()
          initcode_sha256 = hashlib.sha256(
              bytes.fromhex(bytecode.removeprefix("0x"))
          ).hexdigest()
          runtime_sha256 = hashlib.sha256(
              bytes.fromhex(deployed_bytecode.removeprefix("0x"))
          ).hexdigest()

          # We deliberately do not invent stream IDs. Robinhood documents that
          # REST prices are raw underlier prices while the onchain Chainlink
          # surface is multiplier-adjusted. A production implementation needs
          # an independently verified stream identifier and a purpose-built
          # adapter from Data Streams report semantics to the Registry's
          # AggregatorV3-style latestRoundData() interface.
          report = {
              "project": "Rustee Broker Production Discovery v3.11",
              "network": "Robinhood Chain Mainnet",
              "chainId": CHAIN_ID,
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mode": "READ_ONLY_AND_COMPILE_ONLY",
              "knownProductionAddresses": {
                  "registry": REGISTRY,
                  "tradingTba": TBA,
                  "weth": WETH,
                  "nvda": NVDA,
                  "router": ROUTER,
                  "chainlinkDataStreamsVerifierProxy": VERIFIER_PROXY,
              },
              "oracleDiscovery": {
                  "officialRobinhoodOracleTechnology": "Chainlink",
                  "dataStreamsVerifierProxyHasCode": verifier_has_code,
                  "nvdaCurrentMultiplier": multiplier,
                  "nvdaPendingMultiplier": pending_multiplier,
                  "nvdaPendingMultiplierEffectiveTime": pending_time,
                  "restBidRawUnderlyingUsd": quote.get("bid"),
                  "restAskRawUnderlyingUsd": quote.get("ask"),
                  "restPriceMultiplierAdjusted": False,
                  "onchainChainlinkStockPriceMultiplierAdjusted": True,
                  "nvdaStreamId": None,
                  "wethUsdStreamOrFeedId": None,
                  "decision":
                      "Use verified onchain Chainlink semantics; do not use raw REST NVDA price directly as Registry oracle.",
              },
              "sequencerDiscovery": {
                  "networkArchitecture": "Arbitrum L2",
                  "publicSequencerEndpointDocumented": True,
                  "aggregatorStyleUptimeFeedAddress": None,
                  "decision":
                      "Do not invent an uptime-feed contract address. Keep production configuration blocked until a compatible onchain feed is explicitly documented or Registry logic is adapted.",
              },
              "adapterCandidate": {
                  "name": "RusteeNvdaRouterAdapter",
                  "status": "COMPILED_NOT_DEPLOYED",
                  "feeTier": 500,
                  "sourceSha256": source_sha256,
                  "initCodeSha256": initcode_sha256,
                  "runtimeBytecodeSha256": runtime_sha256,
                  "constructor": [
                      WETH,
                      NVDA,
                      ROUTER,
                      500
                  ],
                  "sameRouteShapeAsSuccessfulV39Fork": True,
                  "productionDeploymentAddress": None,
              },
              "mainnetState": {
                  "canonicalNvda": (
                      deployment["contractAddress"].lower()
                      == NVDA.lower()
                  ),
                  "nvdaActive": asset.get("status") == "ASSET_STATUS_ACTIVE",
                  "nvdaNotHalted": quote.get("isTradingHalt") is False,
              },
              "resolvedBlockers": [
                  "Oracle vendor: Chainlink",
                  "Robinhood Chain Data Streams verifier proxy",
                  "Candidate production venue adapter source and reproducible bytecode",
                  "v3.9-tested WETH/NVDA fee tier 500 route shape",
              ],
              "remainingBlockers": [
                  "Exact verified NVDA Chainlink stream/feed identifier",
                  "Exact verified WETH/USD Chainlink stream/feed identifier",
                  "AggregatorV3-compatible oracle adapter design for StockTokenRegistry",
                  "Sequencer uptime feed compatibility decision",
                  "Independent review of candidate RusteeNvdaRouterAdapter",
                  "Production adapter deployment and bytecode verification",
              ],
              "executionGate": {
                  "mainnetRegistryWritesAllowed": False,
                  "mainnetAdapterDeploymentAllowed": False,
                  "mainnetFundingAllowed": False,
                  "mainnetApprovalAllowed": False,
                  "mainnetUnpauseAllowed": False,
                  "mainnetBroadcastAllowed": False,
                  "verdict":
                      "ORACLE/ADAPTER ARCHITECTURE IDENTIFIED; EXACT STREAM IDS AND PRODUCTION ORACLE ADAPTER STILL REQUIRED",
              },
          }

          Path("data/production-discovery-v311.json").write_text(
              json.dumps(report, indent=2)
          )
          Path("production-discovery-v311.json").write_text(
              json.dumps(report, indent=2)
          )

          print("PASS: verifier proxy code", verifier_has_code)
          print("PASS: NVDA multiplier", multiplier)
          print("PASS: adapter compiled and hashed")
          print("PASS: no live writes")
          PY

      - name: Validate v3.11 report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          p = json.load(open("data/production-discovery-v311.json"))

          assert p["chainId"] == 4663
          assert p["mode"] == "READ_ONLY_AND_COMPILE_ONLY"
          assert p["oracleDiscovery"]["officialRobinhoodOracleTechnology"] == "Chainlink"
          assert p["oracleDiscovery"]["dataStreamsVerifierProxyHasCode"] is True
          assert p["adapterCandidate"]["status"] == "COMPILED_NOT_DEPLOYED"
          assert p["adapterCandidate"]["sameRouteShapeAsSuccessfulV39Fork"] is True
          assert p["executionGate"]["mainnetBroadcastAllowed"] is False
          assert p["executionGate"]["mainnetAdapterDeploymentAllowed"] is False

          print("PASS: v3.11 discovery validates")
          PY

      - name: Embed v3.11 report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          report = json.load(open("data/production-discovery-v311.json"))
          path = Path("index.html")
          html = path.read_text()
          embedded = json.dumps(report, separators=(",", ":")).replace(
              "</", "<\\/"
          )

          script = f"""
          <script id="v311-report" type="application/json">{embedded}</script>
          <script>
          (() => {{
            const node = document.getElementById('v311-report');
            const out = document.getElementById('report');
            if (!node || !out) return;
            out.textContent = JSON.stringify(
              JSON.parse(node.textContent), null, 2
            );
          }})();
          </script>
          """

          if "</body>" not in html:
              raise RuntimeError("index.html missing </body>")

          path.write_text(html.replace("</body>", script + "</body>"))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
