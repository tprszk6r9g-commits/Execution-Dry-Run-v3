name: Rustee STONKBROKER Production Infrastructure Gate v4.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v48
  cancel-in-progress: true

jobs:
  infrastructure-gate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PUBLIC_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      ARCHIVE_RPC_URL: ${{ vars.ARCHIVE_RPC_URL }}
      ETH_USD_FEED_ADDRESS: ${{ vars.ETH_USD_FEED_ADDRESS }}
      ETH_USD_PROVENANCE_URL: ${{ vars.ETH_USD_PROVENANCE_URL }}
      ETH_USD_HEARTBEAT_SECONDS: ${{ vars.ETH_USD_HEARTBEAT_SECONDS }}
      SEQUENCER_UPTIME_FEED_ADDRESS: ${{ vars.SEQUENCER_UPTIME_FEED_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify canonical Robinhood Chain state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="$PUBLIC_RPC_URL"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"

          CHAIN_ID="$(cast chain-id --rpc-url "$RPC")"
          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"
          REG_CODE="$(cast code "$REGISTRY" --rpc-url "$RPC")"
          TBA_CODE="$(cast code "$TBA" --rpc-url "$RPC")"

          python3 - "$CHAIN_ID" "$TOKEN0" "$TOKEN1" "$LIQ" "$REG_CODE" "$TBA_CODE" <<'PY'
          import json,sys
          from pathlib import Path
          chain,token0,token1,liq,reg_code,tba_code=sys.argv[1:]
          expected={
            "weth":"0x0bd7d308f8e1639fab988df18a8011f41eacad73",
            "stonk":"0xe934e36a439c94017b64a3fece66af12099abf50",
          }
          out={
            "chainId":int(chain),
            "pool":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
            "token0":token0.lower(),
            "token1":token1.lower(),
            "pairMatches":{token0.lower(),token1.lower()}==set(expected.values()),
            "liquidity":str(int(liq)),
            "liquidityNonZero":int(liq)>0,
            "registryHasCode":len(reg_code)>2,
            "tradingTbaHasCode":len(tba_code)>2,
          }
          assert out["chainId"]==4663
          assert out["pairMatches"] and out["liquidityNonZero"]
          assert out["registryHasCode"] and out["tradingTbaHasCode"]
          Path("data/v48-binding.json").write_text(json.dumps(out,indent=2))
          PY

      - name: Validate production ETH USD Chainlink Data Feed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path

          rpc=os.environ["PUBLIC_RPC_URL"]
          addr=os.environ.get("ETH_USD_FEED_ADDRESS","").strip()
          provenance=os.environ.get("ETH_USD_PROVENANCE_URL","").strip()
          heartbeat_raw=os.environ.get("ETH_USD_HEARTBEAT_SECONDS","").strip()

          def valid_addr(a):
              return bool(re.fullmatch(r"0x[0-9a-fA-F]{40}",a))

          result={
            "address":addr or None,
            "addressValid":valid_addr(addr),
            "provenanceUrl":provenance or None,
            "provenancePresent":provenance.startswith("https://"),
            "heartbeatSeconds":int(heartbeat_raw) if heartbeat_raw.isdigit() else None,
            "heartbeatValid":heartbeat_raw.isdigit() and int(heartbeat_raw)>0,
            "hasCode":False,
            "aggregatorV3Readable":False,
            "decimals":None,
            "answer":None,
            "updatedAt":None,
            "ageSeconds":None,
            "notStale":False,
          }

          if result["addressValid"]:
              code=subprocess.check_output(
                  ["cast","code",addr,"--rpc-url",rpc],text=True
              ).strip()
              result["hasCode"]=len(code)>2
              if result["hasCode"]:
                  try:
                      dec=subprocess.check_output(
                          ["cast","call",addr,"decimals()(uint8)","--rpc-url",rpc],
                          text=True
                      ).strip().split()[0]
                      rd=subprocess.check_output(
                          ["cast","call",addr,
                           "latestRoundData()(uint80,int256,uint256,uint256,uint80)",
                           "--rpc-url",rpc],
                          text=True
                      ).strip().splitlines()
                      vals=[x.strip().split()[0] for x in rd if x.strip()]
                      result["decimals"]=int(dec)
                      result["answer"]=int(vals[1])
                      result["updatedAt"]=int(vals[3])
                      result["ageSeconds"]=max(0,int(time.time())-result["updatedAt"])
                      result["aggregatorV3Readable"]=result["answer"]>0 and result["updatedAt"]>0
                      if result["heartbeatValid"]:
                          result["notStale"]=result["ageSeconds"] <= result["heartbeatSeconds"]
                  except Exception as e:
                      result["readError"]=str(e)[:500]

          result["ready"]=all([
              result["addressValid"],
              result["provenancePresent"],
              result["heartbeatValid"],
              result["hasCode"],
              result["aggregatorV3Readable"],
              result["notStale"],
          ])

          Path("data/v48-eth-usd.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY

      - name: Validate archive RPC and sample 30 minute TWAP history
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, datetime
          from decimal import Decimal, getcontext
          from pathlib import Path

          getcontext().prec=90
          PUBLIC=os.environ["PUBLIC_RPC_URL"]
          ARCHIVE=os.environ.get("ARCHIVE_RPC_URL","").strip()
          RPC=ARCHIVE or PUBLIC

          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          OBSERVE_SELECTOR="0x883bdbfd"
          LIQ_SELECTOR="0x1a686502"
          WINDOW=1800

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),
                  headers={"content-type":"application/json","user-agent":"Rustee-v4.8"}
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          def word(n): return int(n).to_bytes(32,"big").hex()
          def observe_data(window):
              return OBSERVE_SELECTOR+word(32)+word(2)+word(window)+word(0)
          def u256(b,o): return int.from_bytes(b[o:o+32],"big")
          def signed_word(b,o,bits):
              raw=u256(b,o)&((1<<bits)-1)
              if raw&(1<<(bits-1)): raw-=1<<bits
              return raw
          def decode_observe(h):
              b=bytes.fromhex(h[2:])
              ot=u256(b,0)
              nt=u256(b,ot)
              ticks=[signed_word(b,ot+32+32*i,56) for i in range(nt)]
              if len(ticks)!=2: raise RuntimeError("bad observe lengths")
              return ticks
          def mean_tick(delta,window):
              q=abs(delta)//window
              q=-q if delta<0 else q
              if delta<0 and abs(delta)%window: q-=1
              if not -887272<=q<=887272: raise RuntimeError("tick out of bounds")
              return q
          def weth_per_stonk(tick):
              return Decimal(1)/(Decimal("1.0001")**Decimal(tick))

          latest_num=int(rpc("eth_blockNumber",[]),16)
          latest=rpc("eth_getBlockByNumber",[hex(latest_num),False])
          latest_ts=int(latest["timestamp"],16)
          cache={latest_num:latest}

          def get_block(n):
              if n not in cache:
                  cache[n]=rpc("eth_getBlockByNumber",[hex(n),False])
              return cache[n]

          def find_block(target_ts):
              lo=max(0,latest_num-8000000)
              hi=latest_num
              best=lo
              while lo<=hi:
                  mid=(lo+hi)//2
                  b=get_block(mid)
                  ts=int(b["timestamp"],16)
                  if ts<=target_ts:
                      best=mid; lo=mid+1
                  else:
                      hi=mid-1
              return best

          lookbacks=[0,1,2,4,8,12,18,24,36,48,72,96,120,168]
          rows=[]
          for hrs in lookbacks:
              try:
                  bn=latest_num if hrs==0 else find_block(latest_ts-hrs*3600)
                  block=get_block(bn)
                  tag=hex(bn)
                  ticks=decode_observe(rpc("eth_call",[{"to":POOL,"data":observe_data(WINDOW)},tag]))
                  mt=mean_tick(ticks[1]-ticks[0],WINDOW)
                  price=weth_per_stonk(mt)
                  liq=int(rpc("eth_call",[{"to":POOL,"data":LIQ_SELECTOR},tag]),16)
                  rows.append({
                    "lookbackHours":hrs,
                    "available":True,
                    "blockNumber":bn,
                    "blockTimestamp":int(block["timestamp"],16),
                    "meanTick":mt,
                    "wethPerStonk":format(price,".30g"),
                    "liquidity":str(liq),
                  })
              except Exception as e:
                  rows.append({"lookbackHours":hrs,"available":False,"error":str(e)[:500]})

          avail=[r for r in rows if r["available"]]
          liqs=[int(r["liquidity"]) for r in avail]
          latest_liq=liqs[0] if liqs else 0
          min_vs_latest=(min(liqs)/latest_liq*100) if liqs and latest_liq else None
          archive_pass=bool(ARCHIVE) and len(avail)>=8
          liquidity_pass=bool(liqs) and min(liqs)>0 and min_vs_latest is not None and min_vs_latest>=50.0

          out={
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "rpcMode":"ARCHIVE_VARIABLE" if ARCHIVE else "PUBLIC_FALLBACK",
            "archiveRpcConfigured":bool(ARCHIVE),
            "windowSeconds":WINDOW,
            "samples":rows,
            "summary":{
              "requestedSamples":len(rows),
              "availableSamples":len(avail),
              "archiveEvidencePass":archive_pass,
              "liquidityContinuityPass":liquidity_pass,
              "liquidityMin":str(min(liqs)) if liqs else None,
              "liquidityMax":str(max(liqs)) if liqs else None,
              "liquidityMinVsLatestPct":min_vs_latest,
            }
          }
          Path("data/v48-history.json").write_text(json.dumps(out,indent=2,allow_nan=False))
          print(json.dumps(out,indent=2,allow_nan=False))
          PY

      - name: Evaluate sequencer compatibility without inventing an address
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          rpc=os.environ["PUBLIC_RPC_URL"]
          addr=os.environ.get("SEQUENCER_UPTIME_FEED_ADDRESS","").strip()

          valid=bool(re.fullmatch(r"0x[0-9a-fA-F]{40}",addr))
          out={
            "robinhoodDocumentedSequencerFeed":"wss://feed.mainnet.chain.robinhood.com",
            "robinhoodDocumentedFeedType":"WEBSOCKET",
            "aggregatorV3Address":addr or None,
            "addressValid":valid,
            "hasCode":False,
            "aggregatorV3Readable":False,
          }
          if valid:
              code=subprocess.check_output(["cast","code",addr,"--rpc-url",rpc],text=True).strip()
              out["hasCode"]=len(code)>2
              if out["hasCode"]:
                  try:
                      subprocess.check_output(
                        ["cast","call",addr,
                         "latestRoundData()(uint80,int256,uint256,uint256,uint80)",
                         "--rpc-url",rpc],text=True
                      )
                      out["aggregatorV3Readable"]=True
                  except Exception as e:
                      out["readError"]=str(e)[:500]

          out["compatibleWithCurrentRegistryProven"] = bool(
              out["addressValid"] and out["hasCode"] and out["aggregatorV3Readable"]
          )
          Path("data/v48-sequencer.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Build v4.8 readiness report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,datetime
          from pathlib import Path

          binding=json.load(open("data/v48-binding.json"))
          eth=json.load(open("data/v48-eth-usd.json"))
          hist=json.load(open("data/v48-history.json"))
          seq=json.load(open("data/v48-sequencer.json"))

          blockers=[]
          if not eth["ready"]:
              blockers.append("Production ETH/USD Chainlink Data Feed candidate is not fully validated")
          if not hist["summary"]["archiveEvidencePass"]:
              blockers.append("Archive RPC evidence gate requires an ARCHIVE_RPC_URL and at least 8 successful historical samples")
          if not hist["summary"]["liquidityContinuityPass"]:
              blockers.append("Historical pool liquidity continuity gate has not passed")
          if not seq["compatibleWithCurrentRegistryProven"]:
              blockers.append("Current Registry sequencer uptime interface still lacks a proven AggregatorV3-compatible feed")
          blockers += [
            "Candidate STONKBROKER TWAP oracle still requires independent security review",
            "Candidate STONKBROKER venue adapter still requires independent security review and verified deployment",
            "No live mainnet configuration or trade is authorized by v4.8",
          ]

          infra_ready=(
              binding["pairMatches"] and
              eth["ready"] and
              hist["summary"]["archiveEvidencePass"] and
              hist["summary"]["liquidityContinuityPass"] and
              seq["compatibleWithCurrentRegistryProven"]
          )

          report={
            "project":"Rustee Broker Production Infrastructure Gate v4.8",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"READ_ONLY_NO_MAINNET_WRITES",
            "newAuthoritativeFinding":{
              "chainlinkDataFeedsLiveOnRobinhoodChainMainnet":True,
              "ethUsdListedForRobinhoodChain":True,
              "robinhoodRecommendedProductionRpcProvider":"Alchemy",
              "archiveReadsRequireArchiveEndpoint":True
            },
            "binding":binding,
            "productionEthUsdFeed":eth,
            "historical30mTwap":hist["summary"],
            "sequencerCompatibility":seq,
            "readiness":{
              "productionEthUsdFeedReady":eth["ready"],
              "archiveEvidencePass":hist["summary"]["archiveEvidencePass"],
              "liquidityContinuityPass":hist["summary"]["liquidityContinuityPass"],
              "sequencerCompatibilityProven":seq["compatibleWithCurrentRegistryProven"],
              "infrastructureInputsReady":infra_ready
            },
            "remainingBlockers":blockers,
            "executionGate":{
              "mainnetOracleDeploymentAllowed":False,
              "mainnetAdapterDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":(
                "V4.8 INFRASTRUCTURE INPUTS VALIDATED; MOVE TO AUDIT/DEPLOYMENT PREFLIGHT"
                if infra_ready else
                "V4.8 FOUND OFFICIAL ROBINHOOD CHAIN DATA FEEDS PATH; REQUIRED PRODUCTION INPUTS STILL INCOMPLETE"
              )
            }
          }
          Path("data/v48-report.json").write_text(json.dumps(report,indent=2,allow_nan=False))
          print(json.dumps(report,indent=2,allow_nan=False))
          PY

      - name: Validate no-write gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p=json.load(open("data/v48-report.json"))
          g=p["executionGate"]
          assert p["chainId"]==4663
          assert p["mode"]=="READ_ONLY_NO_MAINNET_WRITES"
          assert all(v is False for k,v in g.items() if k.endswith("Allowed"))
          print("PASS: v4.8 remains read-only")
          PY

      - name: Embed v4.8 report into page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,html
          from pathlib import Path
          report=Path("data/v48-report.json").read_text()
          esc=html.escape(report)
          page=f"""<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Rustee Broker v4.8</title>
          <style>
          body{{margin:0;background:#041c17;color:#eafff8;font-family:system-ui}}
          main{{max-width:900px;margin:auto;padding:28px 18px 80px}}
          .card{{border:1px solid #2e6c5e;border-radius:24px;padding:24px;background:#08271f;margin:18px 0}}
          pre{{white-space:pre-wrap;word-break:break-word;background:#03130f;border:1px solid #24584c;border-radius:18px;padding:18px;overflow:auto}}
          h1{{font-size:42px}} p{{color:#9bc0b7;font-size:17px;line-height:1.5}}
          </style></head><body><main>
          <h1>Rustee Broker Production Infrastructure Gate v4.8</h1>
          <p>No mainnet writes. Validates the official Chainlink Data Feeds path, an optional authoritative ETH/USD candidate, archive RPC evidence, and sequencer compatibility.</p>
          <div class="card"><pre>{esc}</pre></div>
          </main></body></html>"""
          Path("index.html").write_text(page)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
