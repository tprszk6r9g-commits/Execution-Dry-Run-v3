name: Deploy Rustee Broker Portfolio Executor v1.4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.4 withdrawal fix
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Portfolio Executor v1.4" index.html
          grep -q "SEL_WITHDRAW_TOKEN='9e281a98'" index.html
          grep -q "withdrawToken(address,uint256)" index.html
          echo "PASS: v1.4 restricted Trading TBA withdrawal path detected"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
