name: Rustee Data Feed Resolution v3.15

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v315-pages
  cancel-in-progress: true

jobs:
  data-feed-resolution:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Resolve AggregatorV3 feed path
        shell: bash
        env:
          NVDA_USD_FEED_ADDRESS: ${{ vars.NVDA_USD_FEED_ADDRESS }}
          ETH_USD_FEED_ADDRESS: ${{ vars.ETH_USD_FEED_ADDRESS }}
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY2'
          import json, os, re, urllib.request, datetime, subprocess
          from pathlib import Path
          RPC='https://rpc.mainnet.chain.robinhood.com'
          ASSETS='https://api.robinhood.com/rhj/assets'
          PRICES='https://api.robinhood.com/rhj/prices/NVDA'
          def rpc(method,params):
              req=urllib.request.Request(RPC,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'content-type':'application/json','user-agent':'Rustee-v3.15'})
              with urllib.request.urlopen(req,timeout=30) as r:j=json.loads(r.read().decode())
              if 'error' in j: raise RuntimeError(j['error'])
              return j['result']
          def get_json(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Rustee-v3.15'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          def address_ok(x): return bool(re.fullmatch(r'0x[0-9a-fA-F]{40}',x or ''))
          def selector(sig): return subprocess.check_output(['cast','sig',sig],text=True).strip()
          def eth_call(to,data): return rpc('eth_call',[{'to':to,'data':data},'latest'])
          def read_uint(to,sig): return int(eth_call(to,selector(sig)),16)
          def read_round(to):
              raw=eth_call(to,selector('latestRoundData()')); h=raw[2:]; w=[h[i:i+64] for i in range(0,len(h),64)]
              if len(w)<5: raise RuntimeError('bad latestRoundData response')
              def sint(x):
                  n=int(x,16); return n-(1<<256) if n>=(1<<255) else n
              return {'roundId':int(w[0],16),'answer':sint(w[1]),'startedAt':int(w[2],16),'updatedAt':int(w[3],16),'answeredInRound':int(w[4],16)}
          assets=get_json(ASSETS)['assets']; quotes=get_json(PRICES)['quotes']; quote=next(q for q in quotes if q.get('tokenSymbol')=='NVDA'); asset=next(a for a in assets if a.get('tokenSymbol')=='NVDA')
          multiplier=float(asset.get('currentMultiplier','1')); rest_mid=(float(quote['bid'])+float(quote['ask']))/2; expected=rest_mid*multiplier
          nvda=os.getenv('NVDA_USD_FEED_ADDRESS','').strip(); eth=os.getenv('ETH_USD_FEED_ADDRESS','').strip(); feeds={}
          for name,addr in [('nvdaUsd',nvda),('ethUsd',eth)]:
              e={'address':addr or None,'present':bool(addr),'validAddress':address_ok(addr)}
              if address_ok(addr):
                  code=rpc('eth_getCode',[addr,'latest']); e['hasCode']=code!='0x'
                  if e['hasCode']:
                      try:
                          dec=read_uint(addr,'decimals()'); rd=read_round(addr); e.update({'aggregatorV3Readable':True,'decimals':dec,'round':rd,'normalizedAnswer':rd['answer']/(10**dec)})
                      except Exception as ex:
                          e['aggregatorV3Readable']=False; e['readError']=str(ex)
              feeds[name]=e
          compare=None
          if feeds['nvdaUsd'].get('aggregatorV3Readable'):
              observed=feeds['nvdaUsd']['normalizedAnswer']; diff=abs(observed-expected)/max(abs(expected),1e-12)*100
              compare={'restMidRawUnderlyingUsd':rest_mid,'currentMultiplier':multiplier,'expectedMultiplierAdjustedUsd':expected,'onchainFeedUsd':observed,'absolutePercentDifference':diff,'withinTwoPercent':diff<=2.0}
          feeds_ready=feeds['nvdaUsd'].get('aggregatorV3Readable') is True and feeds['ethUsd'].get('aggregatorV3Readable') is True
          sem_ok=compare is not None and compare['withinTwoPercent']
          blockers=[]
          if not address_ok(nvda): blockers.append('Set authoritative NVDA_USD_FEED_ADDRESS from Chainlink Price Feed Addresses')
          if not address_ok(eth): blockers.append('Set authoritative ETH_USD_FEED_ADDRESS from Chainlink Price Feed Addresses')
          if address_ok(nvda) and not feeds['nvdaUsd'].get('aggregatorV3Readable'): blockers.append('NVDA/USD address is not AggregatorV3-readable')
          if address_ok(eth) and not feeds['ethUsd'].get('aggregatorV3Readable'): blockers.append('ETH/USD address is not AggregatorV3-readable')
          if compare is not None and not compare['withinTwoPercent']: blockers.append('NVDA feed value does not match REST midpoint × currentMultiplier within 2%')
          blockers += ['Confirm stock-feed market-hours/staleness semantics for production policy','Sequencer uptime compatibility decision','Independent security review before any mainnet write']
          verdict='DIRECT DATA FEEDS PATH TECHNICALLY COMPATIBLE; SECURITY/SEQUENCER REVIEW STILL REQUIRED' if feeds_ready and sem_ok else 'WAITING FOR AUTHORITATIVE ROBINHOOD CHAIN NVDA/USD + ETH/USD FEED ADDRESSES'
          p={'project':'Rustee Broker Data Feed Resolution v3.15','network':'Robinhood Chain Mainnet','chainId':4663,'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'READ_ONLY','chainlinkDataFeedsAvailableOnRobinhoodChain':True,'whyThisPath':{'existingRegistryExpectsAggregatorV3StyleInterface':True,'directDataFeedsCanAvoidSignedReportCacheIfSemanticsMatch':True,'nvdaRestQuoteIsMultiplierAdjusted':False,'nvdaOnchainChainlinkPriceExpectedMultiplierAdjusted':True},'feeds':feeds,'nvdaSemanticComparison':compare,'readiness':{'bothFeedsAggregatorV3Readable':feeds_ready,'nvdaMultiplierSemanticsMatch':sem_ok},'remainingBlockers':blockers,'executionGate':{'mainnetRegistryWritesAllowed':False,'mainnetOracleDeploymentAllowed':False,'mainnetFundingAllowed':False,'mainnetApprovalAllowed':False,'mainnetUnpauseAllowed':False,'mainnetBroadcastAllowed':False,'verdict':verdict}}
          Path('data/data-feed-resolution-v315.json').write_text(json.dumps(p,indent=2)); Path('data-feed-resolution-v315.json').write_text(json.dumps(p,indent=2)); print(verdict)
          PY2
      - name: Embed v3.15 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          import json
          from pathlib import Path
          p=json.load(open('data/data-feed-resolution-v315.json')); h=Path('index.html').read_text(); e=json.dumps(p,separators=(',',':')).replace('</','<\/')
          s='<script id="v315-report" type="application/json">'+e+'</script><script>(()=>{const n=document.getElementById("v315-report");const o=document.getElementById("report");if(n&&o)o.textContent=JSON.stringify(JSON.parse(n.textContent),null,2);})();</script>'
          Path('index.html').write_text(h.replace('</body>',s+'</body>'))
          PY2
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
