name: Rustee Broker Production Infrastructure Gate v4.8.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v481
  cancel-in-progress: true

jobs:
  infrastructure-decision:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PUBLIC_RPC_URL: https://rpc.mainnet.chain.robinhood.com

      # Optional archive endpoint. Set this in:
      # Settings -> Secrets and variables -> Actions -> Variables.
      ARCHIVE_RPC_URL: ${{ vars.ARCHIVE_RPC_URL }}

      # OPTION A: AggregatorV3-style ETH/USD feed, only if you have an
      # authoritative Robinhood Chain listing and provenance URL.
      ETH_USD_FEED_ADDRESS: ${{ vars.ETH_USD_FEED_ADDRESS }}
      ETH_USD_PROVENANCE_URL: ${{ vars.ETH_USD_PROVENANCE_URL }}
      ETH_USD_HEARTBEAT_SECONDS: ${{ vars.ETH_USD_HEARTBEAT_SECONDS }}

      # OPTION B: Chainlink Data Streams. v4.8.1 does not require or expose
      # credentials. These variables merely record an operator-approved feed ID
      # and provenance once obtained from an authoritative Chainlink source.
      ETH_USD_DATA_STREAM_ID: ${{ vars.ETH_USD_DATA_STREAM_ID }}
      ETH_USD_DATA_STREAM_PROVENANCE_URL: ${{ vars.ETH_USD_DATA_STREAM_PROVENANCE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify canonical Robinhood Chain state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="$PUBLIC_RPC_URL"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          VERIFIER="0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"

          CHAIN_ID="$(cast chain-id --rpc-url "$RPC")"
          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"
          REG_CODE="$(cast code "$REGISTRY" --rpc-url "$RPC")"
          TBA_CODE="$(cast code "$TBA" --rpc-url "$RPC")"
          VERIFIER_CODE="$(cast code "$VERIFIER" --rpc-url "$RPC")"

          python3 - "$CHAIN_ID" "$TOKEN0" "$TOKEN1" "$LIQ" "$REG_CODE" "$TBA_CODE" "$VERIFIER_CODE" <<'PY'
          import json,sys
          from pathlib import Path

          chain,token0,token1,liq,reg_code,tba_code,verifier_code=sys.argv[1:]
          expected={
            "weth":"0x0bd7d308f8e1639fab988df18a8011f41eacad73",
            "stonk":"0xe934e36a439c94017b64a3fece66af12099abf50",
          }

          out={
            "chainId":int(chain),
            "pool":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
            "token0":token0.lower(),
            "token1":token1.lower(),
            "pairMatches":{token0.lower(),token1.lower()}==set(expected.values()),
            "liquidity":str(int(liq)),
            "liquidityNonZero":int(liq)>0,
            "registryHasCode":len(reg_code)>2,
            "tradingTbaHasCode":len(tba_code)>2,
            "dataStreamsVerifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
            "dataStreamsVerifierProxyHasCode":len(verifier_code)>2,
          }

          assert out["chainId"]==4663
          assert out["pairMatches"]
          assert out["liquidityNonZero"]
          assert out["registryHasCode"]
          assert out["tradingTbaHasCode"]
          assert out["dataStreamsVerifierProxyHasCode"]

          Path("data/v481-binding.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Validate optional AggregatorV3 ETH USD path
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path

          rpc=os.environ["PUBLIC_RPC_URL"]
          addr=os.environ.get("ETH_USD_FEED_ADDRESS","").strip()
          provenance=os.environ.get("ETH_USD_PROVENANCE_URL","").strip()
          hb=os.environ.get("ETH_USD_HEARTBEAT_SECONDS","").strip()

          valid=bool(re.fullmatch(r"0x[0-9a-fA-F]{40}",addr))
          out={
            "mode":"AGGREGATOR_V3",
            "address":addr or None,
            "addressValid":valid,
            "provenanceUrl":provenance or None,
            "provenancePresent":provenance.startswith("https://"),
            "heartbeatSeconds":int(hb) if hb.isdigit() else None,
            "heartbeatValid":hb.isdigit() and int(hb)>0,
            "hasCode":False,
            "aggregatorV3Readable":False,
            "decimals":None,
            "answer":None,
            "updatedAt":None,
            "ageSeconds":None,
            "notStale":False,
            "ready":False,
          }

          if valid:
              code=subprocess.check_output(
                  ["cast","code",addr,"--rpc-url",rpc],text=True
              ).strip()
              out["hasCode"]=len(code)>2

              if out["hasCode"]:
                  try:
                      dec=subprocess.check_output(
                          ["cast","call",addr,"decimals()(uint8)","--rpc-url",rpc],
                          text=True
                      ).strip().split()[0]

                      rd=subprocess.check_output(
                          [
                            "cast","call",addr,
                            "latestRoundData()(uint80,int256,uint256,uint256,uint80)",
                            "--rpc-url",rpc
                          ],
                          text=True
                      ).strip().splitlines()

                      vals=[x.strip().split()[0] for x in rd if x.strip()]
                      out["decimals"]=int(dec)
                      out["answer"]=int(vals[1])
                      out["updatedAt"]=int(vals[3])
                      out["ageSeconds"]=max(0,int(time.time())-out["updatedAt"])
                      out["aggregatorV3Readable"]=out["answer"]>0 and out["updatedAt"]>0

                      if out["heartbeatValid"]:
                          out["notStale"]=out["ageSeconds"] <= out["heartbeatSeconds"]
                  except Exception as e:
                      out["readError"]=str(e)[:500]

          out["ready"]=all([
              out["addressValid"],
              out["provenancePresent"],
              out["heartbeatValid"],
              out["hasCode"],
              out["aggregatorV3Readable"],
              out["notStale"],
          ])

          Path("data/v481-aggregator.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Validate optional Data Streams ETH USD operator input
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json,os,re
          from pathlib import Path

          feed_id=os.environ.get("ETH_USD_DATA_STREAM_ID","").strip()
          provenance=os.environ.get(
              "ETH_USD_DATA_STREAM_PROVENANCE_URL",""
          ).strip()

          # Chainlink feed IDs are bytes32 values. v4.8.1 does NOT guess one.
          valid_id=bool(re.fullmatch(r"0x[0-9a-fA-F]{64}",feed_id))

          out={
            "mode":"CHAINLINK_DATA_STREAMS",
            "verifierProxy":
              "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
            "feedId":feed_id or None,
            "feedIdValidBytes32":valid_id,
            "provenanceUrl":provenance or None,
            "provenancePresent":provenance.startswith("https://"),
            "credentialsRequiredForLiveRetrieval":True,
            "credentialsStoredByThisWorkflow":False,
            "signedReportReplayAttempted":False,
            "readyForSignedReportReplay":bool(
                valid_id and provenance.startswith("https://")
            ),
            "productionReady":False,
          }

          Path("data/v481-data-streams.json").write_text(
              json.dumps(out,indent=2)
          )
          print(json.dumps(out,indent=2))
          PY

      - name: Validate archive endpoint and collect 30m history
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json,os,urllib.request,datetime
          from decimal import Decimal,getcontext
          from pathlib import Path

          getcontext().prec=90
          PUBLIC=os.environ["PUBLIC_RPC_URL"]
          ARCHIVE=os.environ.get("ARCHIVE_RPC_URL","").strip()
          RPC=ARCHIVE or PUBLIC

          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          OBSERVE_SELECTOR="0x883bdbfd"
          LIQ_SELECTOR="0x1a686502"
          WINDOW=1800

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({
                    "jsonrpc":"2.0","id":1,"method":method,"params":params
                  }).encode(),
                  headers={
                    "content-type":"application/json",
                    "user-agent":"Rustee-v4.8.1"
                  }
              )
              with urllib.request.urlopen(req,timeout=35) as r:
                  j=json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          def word(n):
              return int(n).to_bytes(32,"big").hex()

          def observe_data(window):
              return OBSERVE_SELECTOR+word(32)+word(2)+word(window)+word(0)

          def u256(b,o):
              return int.from_bytes(b[o:o+32],"big")

          def signed_word(b,o,bits):
              raw=u256(b,o)&((1<<bits)-1)
              if raw&(1<<(bits-1)):
                  raw-=1<<bits
              return raw

          def decode_observe(h):
              b=bytes.fromhex(h[2:])
              offset=u256(b,0)
              length=u256(b,offset)
              ticks=[
                signed_word(b,offset+32+32*i,56)
                for i in range(length)
              ]
              if len(ticks)!=2:
                  raise RuntimeError("unexpected observe return")
              return ticks

          def mean_tick(delta,window):
              q=abs(delta)//window
              q=-q if delta<0 else q
              if delta<0 and abs(delta)%window:
                  q-=1
              if not -887272 <= q <= 887272:
                  raise RuntimeError("tick out of bounds")
              return q

          latest_num=int(rpc("eth_blockNumber",[]),16)
          latest=rpc("eth_getBlockByNumber",[hex(latest_num),False])
          latest_ts=int(latest["timestamp"],16)
          cache={latest_num:latest}

          def get_block(n):
              if n not in cache:
                  cache[n]=rpc("eth_getBlockByNumber",[hex(n),False])
              if cache[n] is None:
                  raise RuntimeError(f"block unavailable: {n}")
              return cache[n]

          def find_block(target_ts):
              # Conservative binary search over a broad recent range.
              lo=max(0,latest_num-8_000_000)
              hi=latest_num
              best=lo
              while lo<=hi:
                  mid=(lo+hi)//2
                  b=get_block(mid)
                  ts=int(b["timestamp"],16)
                  if ts<=target_ts:
                      best=mid
                      lo=mid+1
                  else:
                      hi=mid-1
              return best

          lookbacks=[0,1,2,4,8,12,18,24,36,48,72,96,120,168]
          rows=[]

          for hrs in lookbacks:
              try:
                  bn=latest_num if hrs==0 else find_block(
                      latest_ts-hrs*3600
                  )
                  block=get_block(bn)
                  tag=hex(bn)

                  ticks=decode_observe(
                      rpc("eth_call",[
                        {"to":POOL,"data":observe_data(WINDOW)},tag
                      ])
                  )

                  mt=mean_tick(ticks[1]-ticks[0],WINDOW)
                  liq=int(
                      rpc("eth_call",[
                        {"to":POOL,"data":LIQ_SELECTOR},tag
                      ]),
                      16
                  )

                  rows.append({
                    "lookbackHours":hrs,
                    "available":True,
                    "blockNumber":bn,
                    "blockTimestamp":int(block["timestamp"],16),
                    "meanTick":mt,
                    "liquidity":str(liq),
                  })
              except Exception as e:
                  rows.append({
                    "lookbackHours":hrs,
                    "available":False,
                    "error":str(e)[:500]
                  })

          avail=[r for r in rows if r["available"]]
          liqs=[int(r["liquidity"]) for r in avail]
          latest_liq=liqs[0] if liqs else 0
          min_pct=(
              min(liqs)/latest_liq*100
              if liqs and latest_liq
              else None
          )

          out={
            "generatedAt":
              datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "rpcMode":"ARCHIVE_VARIABLE" if ARCHIVE else "PUBLIC_FALLBACK",
            "archiveRpcConfigured":bool(ARCHIVE),
            "samples":rows,
            "summary":{
              "requestedSamples":len(rows),
              "availableSamples":len(avail),
              "archiveEvidencePass":bool(ARCHIVE) and len(avail)>=8,
              "liquidityContinuityPass":bool(
                  liqs and min_pct is not None and min_pct>=50.0
              ),
              "liquidityMin":
                str(min(liqs)) if liqs else None,
              "liquidityMax":
                str(max(liqs)) if liqs else None,
              "liquidityMinVsLatestPct":min_pct,
            }
          }

          Path("data/v481-history.json").write_text(
              json.dumps(out,indent=2,allow_nan=False)
          )
          print(json.dumps(out,indent=2,allow_nan=False))
          PY

      - name: Record Robinhood sequencer architecture decision
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          out={
            "robinhoodDocumentedSequencerFeed":
              "wss://feed.mainnet.chain.robinhood.com",
            "documentedFeedType":"WEBSOCKET_NITRO_SEQUENCER_FEED",
            "aggregatorV3UptimeFeedDocumentedByRobinhood":False,
            "currentRegistryAggregatorV3CompatibilityProven":False,
            "decision":
              "DO_NOT_INVENT_AGGREGATOR_V3_SEQUENCER_ADDRESS",
            "productionOptions":[
              {
                "option":"REGISTRY_V2_CHAIN_SPECIFIC_GUARD",
                "meaning":
                  "Use a Robinhood-specific production Registry/guard design "
                  "that does not pretend the websocket sequencer feed is an "
                  "onchain AggregatorV3 uptime oracle.",
                "requiresNewContractReview":True,
              },
              {
                "option":"KEEP_CURRENT_REGISTRY_PAUSED",
                "meaning":
                  "Leave deployed Registry paused until an independently "
                  "verified compatible onchain uptime mechanism exists.",
                "requiresNewContractReview":False,
              }
            ],
            "selectedProductionOption":None,
            "productionReady":False,
          }

          Path("data/v481-sequencer-decision.json").write_text(
              json.dumps(out,indent=2)
          )
          print(json.dumps(out,indent=2))
          PY

      - name: Build v4.8.1 decision report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json,datetime
          from pathlib import Path

          binding=json.load(open("data/v481-binding.json"))
          agg=json.load(open("data/v481-aggregator.json"))
          streams=json.load(open("data/v481-data-streams.json"))
          hist=json.load(open("data/v481-history.json"))
          seq=json.load(open("data/v481-sequencer-decision.json"))

          eth_path_ready = bool(
              agg["ready"] or streams["readyForSignedReportReplay"]
          )

          blockers=[]

          if not hist["summary"]["archiveEvidencePass"]:
              blockers.append(
                "Set ARCHIVE_RPC_URL to a production archive-capable "
                "Robinhood Chain endpoint; >=8 historical samples required"
              )

          if not eth_path_ready:
              blockers.append(
                "Choose and authoritatively document ETH/USD oracle path: "
                "validated AggregatorV3 feed OR Chainlink Data Streams feed ID"
              )

          if streams["readyForSignedReportReplay"]:
              blockers.append(
                "Data Streams feed ID is configured but a real signed report "
                "still must be replayed through Robinhood's verifier proxy"
              )

          if not seq["productionReady"]:
              blockers.append(
                "Sequencer architecture decision is still required; "
                "do not invent an AggregatorV3 uptime-feed address"
              )

          blockers += [
            "Candidate STONKBROKER TWAP oracle requires independent security review",
            "Candidate venue adapter requires independent security review",
            "No mainnet deployment, Registry write, funding, approval, unpause, or trade is authorized by v4.8.1",
          ]

          report={
            "project":
              "Rustee Broker Production Infrastructure Decision v4.8.1",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":
              datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"READ_ONLY_NO_MAINNET_WRITES",
            "authoritativeArchitecture":{
              "robinhoodProductionRpc":
                "Use an archive-capable provider endpoint for historical evidence",
              "chainlinkDataStreamsVerifierProxy":
                "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
              "robinhoodSequencerFeed":
                "wss://feed.mainnet.chain.robinhood.com",
              "sequencerFeedIsNotAnAggregatorV3Contract":True,
            },
            "binding":binding,
            "ethUsdPaths":{
              "aggregatorV3":agg,
              "dataStreams":streams,
              "atLeastOneCandidateConfigured":eth_path_ready,
            },
            "archiveEvidence":hist["summary"],
            "sequencerDecision":seq,
            "readiness":{
              "bindingVerified":True,
              "archiveEvidencePass":
                hist["summary"]["archiveEvidencePass"],
              "liquidityContinuityPass":
                hist["summary"]["liquidityContinuityPass"],
              "ethUsdCandidateConfigured":eth_path_ready,
              "sequencerProductionDesignSelected":False,
              "securityReviewComplete":False,
              "readyForMainnetWrites":False,
            },
            "remainingBlockers":blockers,
            "executionGate":{
              "mainnetOracleDeploymentAllowed":False,
              "mainnetAdapterDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":
                "V4.8.1 INFRASTRUCTURE DECISION COMPLETE; ARCHIVE, ETH/USD "
                "ORACLE INPUT, SEQUENCER DESIGN, AND SECURITY REVIEW REMAIN "
                "BEFORE MAINNET PREFLIGHT"
            }
          }

          Path("data/v481-report.json").write_text(
              json.dumps(report,indent=2,allow_nan=False)
          )
          print(json.dumps(report,indent=2,allow_nan=False))
          PY

      - name: Validate no-write gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p=json.load(open("data/v481-report.json"))
          assert p["chainId"]==4663
          assert p["mode"]=="READ_ONLY_NO_MAINNET_WRITES"
          gate=p["executionGate"]
          assert all(
              value is False
              for key,value in gate.items()
              if key.endswith("Allowed")
          )
          print("PASS: v4.8.1 remains read-only")
          PY

      - name: Embed v4.8.1 report into page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html
          from pathlib import Path

          report=Path("data/v481-report.json").read_text()
          esc=html.escape(report)

          page=f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Rustee Broker v4.8.1</title>
            <style>
              body{{
                margin:0;background:#041c17;color:#eafff8;
                font-family:system-ui,-apple-system,Segoe UI,sans-serif
              }}
              main{{max-width:900px;margin:auto;padding:28px 18px 80px}}
              .pill{{
                display:inline-block;border:1px solid #2e6c5e;border-radius:999px;
                padding:10px 14px;color:#37dfc3
              }}
              .card{{
                border:1px solid #2e6c5e;border-radius:24px;padding:24px;
                background:#08271f;margin:18px 0
              }}
              .warn{{
                border-left:7px solid #ff9a36;background:#36200b;
                padding:18px;border-radius:16px
              }}
              pre{{
                white-space:pre-wrap;word-break:break-word;background:#03130f;
                border:1px solid #24584c;border-radius:18px;padding:18px;
                overflow:auto
              }}
              h1{{font-size:42px}}
              p{{color:#9bc0b7;font-size:17px;line-height:1.5}}
            </style>
          </head>
          <body>
            <main>
              <span class="pill">Robinhood Chain · v4.8.1 · READ ONLY</span>
              <h1>Production Infrastructure Decision</h1>
              <div class="warn">
                <b>No mainnet writes.</b> This phase validates archive evidence,
                records the supported ETH/USD oracle paths, and explicitly
                rejects inventing an AggregatorV3 sequencer address.
              </div>
              <div class="card">
                <pre>{esc}</pre>
              </div>
            </main>
          </body>
          </html>"""

          Path("index.html").write_text(page)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
