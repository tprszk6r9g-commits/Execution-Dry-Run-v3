name: Rustee STONKBROKER Historical + Manipulation Analysis v4.6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v46
  cancel-in-progress: true

jobs:
  historical-manipulation-analysis:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read canonical pool binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data test src

          RPC="https://rpc.mainnet.chain.robinhood.com"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"

          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          FEE="$(cast call "$POOL" 'fee()(uint24)' --rpc-url "$RPC" | awk '{print $1}')"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"
          DEC0="$(cast call "$TOKEN0" 'decimals()(uint8)' --rpc-url "$RPC" | awk '{print $1}')"
          DEC1="$(cast call "$TOKEN1" 'decimals()(uint8)' --rpc-url "$RPC" | awk '{print $1}')"

          python3 - "$TOKEN0" "$TOKEN1" "$FEE" "$LIQ" "$DEC0" "$DEC1" <<'PY'
          import json,sys
          from pathlib import Path

          token0,token1,fee,liq,dec0,dec1=sys.argv[1:]
          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"
          stonk="0xe934e36a439c94017b64a3fece66af12099abf50"
          assert {token0.lower(),token1.lower()} == {weth,stonk}
          assert int(liq) > 0
          assert int(fee) == 10000

          out={
            "pool":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
            "token0":token0.lower(),
            "token1":token1.lower(),
            "token0Decimals":int(dec0),
            "token1Decimals":int(dec1),
            "fee":int(fee),
            "liquidity":str(int(liq)),
            "pairMatches":True,
            "liquidityNonZero":True
          }
          Path("data/pool-binding.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Historical 30m TWAP and liquidity sampling
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json, urllib.request, datetime, math
          from decimal import Decimal, getcontext
          from pathlib import Path

          getcontext().prec=90

          RPC="https://rpc.mainnet.chain.robinhood.com"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          OBSERVE_SELECTOR="0x883bdbfd"  # observe(uint32[])
          LIQ_SELECTOR="0x1a686502"      # liquidity()
          SLOT0_SELECTOR="0x3850c7bd"    # slot0()
          WINDOW=1800

          binding=json.load(open("data/pool-binding.json"))
          token0=binding["token0"]
          token1=binding["token1"]
          dec0=binding["token0Decimals"]
          dec1=binding["token1Decimals"]
          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"

          def rpc(method, params):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(
                  RPC,data=body,
                  headers={"content-type":"application/json","user-agent":"Rustee-v4.6"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      j=json.loads(r.read().decode())
              except Exception as e:
                  return {"_transportError":str(e)}
              return j

          def result(method,params):
              j=rpc(method,params)
              if "result" not in j:
                  raise RuntimeError(str(j.get("error") or j.get("_transportError")))
              return j["result"]

          def word(n):
              return int(n).to_bytes(32,"big").hex()

          def observe_data(window):
              return OBSERVE_SELECTOR + word(32)+word(2)+word(window)+word(0)

          def u256(b,o):
              return int.from_bytes(b[o:o+32],"big")

          def signed_word(b,o,bits):
              raw=u256(b,o) & ((1<<bits)-1)
              if raw & (1<<(bits-1)):
                  raw -= 1<<bits
              return raw

          def decode_observe(h):
              b=bytes.fromhex(h[2:])
              ot=u256(b,0); os=u256(b,32)
              nt=u256(b,ot); ns=u256(b,os)
              ticks=[signed_word(b,ot+32+32*i,56) for i in range(nt)]
              spl=[u256(b,os+32+32*i)&((1<<160)-1) for i in range(ns)]
              if len(ticks)!=2 or len(spl)!=2:
                  raise RuntimeError("Unexpected observe result lengths")
              return ticks,spl

          def mean_tick(delta,window):
              q=abs(delta)//window
              q=-q if delta<0 else q
              if delta<0 and abs(delta)%window:
                  q-=1
              if not -887272 <= q <= 887272:
                  raise RuntimeError(f"mean tick out of bounds: {q}")
              return q

          def weth_per_stonk(tick):
              raw=(Decimal("1.0001")**Decimal(tick)) * (Decimal(10)**Decimal(dec0-dec1))
              if token0==weth:
                  return Decimal(1)/raw
              return raw

          def block_by_number(n):
              return result("eth_getBlockByNumber",[hex(n),False])

          latest=block_by_number(int(result("eth_blockNumber",[]),16))
          latest_num=int(latest["number"],16)
          latest_ts=int(latest["timestamp"],16)

          # Find a block at or immediately before a target timestamp.
          cache={latest_num:latest}
          def get_block(n):
              if n not in cache:
                  cache[n]=block_by_number(n)
              return cache[n]

          def find_block_at_or_before(target_ts):
              lo=max(0,latest_num-3000000)
              hi=latest_num
              # Narrow low bound until it is older than target when possible.
              while lo>0 and int(get_block(lo)["timestamp"],16)>target_ts:
                  span=latest_num-lo
                  lo=max(0,lo-max(span,1000000))
              best=lo
              while lo<=hi:
                  mid=(lo+hi)//2
                  ts=int(get_block(mid)["timestamp"],16)
                  if ts<=target_ts:
                      best=mid; lo=mid+1
                  else:
                      hi=mid-1
              return best

          lookback_hours=[0,2,4,8,12,18,24,36,48]
          rows=[]
          archive_ok=True

          for hours in lookback_hours:
              target=latest_ts-hours*3600
              try:
                  bn=latest_num if hours==0 else find_block_at_or_before(target)
                  blk=get_block(bn)
                  tag=hex(bn)
                  raw_obs=result("eth_call",[{"to":POOL,"data":observe_data(WINDOW)},tag])
                  ticks,spl=decode_observe(raw_obs)
                  delta=ticks[1]-ticks[0]
                  mt=mean_tick(delta,WINDOW)
                  price=weth_per_stonk(mt)
                  raw_liq=result("eth_call",[{"to":POOL,"data":LIQ_SELECTOR},tag])
                  liq=int(raw_liq,16)
                  raw_slot=result("eth_call",[{"to":POOL,"data":SLOT0_SELECTOR},tag])
                  sb=bytes.fromhex(raw_slot[2:])
                  sqrtp=u256(sb,0) & ((1<<160)-1)
                  spot_tick=signed_word(sb,32,24)

                  rows.append({
                    "lookbackHours":hours,
                    "blockNumber":bn,
                    "blockTimestamp":int(blk["timestamp"],16),
                    "blockTimeUtc":datetime.datetime.fromtimestamp(
                        int(blk["timestamp"],16),datetime.timezone.utc
                    ).isoformat(),
                    "available":True,
                    "liquidity":str(liq),
                    "sqrtPriceX96":str(sqrtp),
                    "spotTick":spot_tick,
                    "twap30mMeanTick":mt,
                    "twap30mWethPerStonk":format(price,".30g"),
                    "twap30mWethPerStonkWei18":str(int(price*Decimal(10)**18))
                  })
              except Exception as e:
                  archive_ok=False
                  rows.append({
                    "lookbackHours":hours,
                    "available":False,
                    "error":str(e)[:500]
                  })

          avail=[r for r in rows if r["available"]]
          prices=[Decimal(r["twap30mWethPerStonk"]) for r in avail]
          liqs=[int(r["liquidity"]) for r in avail]

          stats={
            "requestedSamples":len(rows),
            "availableSamples":len(avail),
            "archiveHistoricalCallsFullyAvailable":archive_ok,
            "lookbackHours":lookback_hours,
            "twap30mMin":format(min(prices),".30g") if prices else None,
            "twap30mMax":format(max(prices),".30g") if prices else None,
            "twap30mRangeBps":float((max(prices)/min(prices)-1)*Decimal(10000)) if len(prices)>=2 else None,
            "liquidityMin":str(min(liqs)) if liqs else None,
            "liquidityMax":str(max(liqs)) if liqs else None,
            "liquidityMinVsLatestPct":(
                float(Decimal(min(liqs))/Decimal(liqs[0])*100)
                if liqs and liqs[0] else None
            )
          }

          out={
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "windowSeconds":WINDOW,
            "samples":rows,
            "summary":stats,
            "importantBoundary":"Unavailable historical RPC state is reported, never silently replaced with current state."
          }
          Path("data/historical-analysis.json").write_text(
              json.dumps(out,indent=2,allow_nan=False)
          )
          print(json.dumps(out,indent=2,allow_nan=False))
          PY

      - name: Generate fork manipulation stress test
        shell: bash
        run: |
          set -euo pipefail

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.26"
          evm_version = "cancun"
          fs_permissions = [{ access = "read-write", path = "./data" }]
          EOF

          cat > src/Placeholder.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;
          contract Placeholder {}
          EOF

          cat > test/ManipulationStress.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface Vm {
              function deal(address who, uint256 newBalance) external;
              function startPrank(address msgSender) external;
              function stopPrank() external;
              function snapshotState() external returns (uint256);
              function revertToState(uint256 snapshotId) external returns (bool);
              function writeFile(string calldata path, string calldata data) external;
              function toString(uint256 value) external pure returns (string memory);
              function toString(int256 value) external pure returns (string memory);
          }

          interface IWETH {
              function deposit() external payable;
              function approve(address spender, uint256 amount) external returns (bool);
          }

          interface IPool {
              function slot0()
                  external
                  view
                  returns (
                      uint160 sqrtPriceX96,
                      int24 tick,
                      uint16 observationIndex,
                      uint16 observationCardinality,
                      uint16 observationCardinalityNext,
                      uint8 feeProtocol,
                      bool unlocked
                  );
          }

          interface ISwapRouter02 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }

              function exactInputSingle(
                  ExactInputSingleParams calldata params
              ) external payable returns (uint256 amountOut);
          }

          contract ManipulationStress {
              Vm constant vm = Vm(address(uint160(uint256(keccak256("hevm cheat code")))));

              address constant WETH =
                  address(bytes20(hex"0bd7d308f8e1639fab988df18a8011f41eacad73"));
              address constant STONK =
                  address(bytes20(hex"e934e36a439c94017b64a3fece66af12099abf50"));
              address constant ROUTER =
                  address(bytes20(hex"caf681a66d020601342297493863e78c959e5cb2"));
              address constant POOL =
                  address(bytes20(hex"9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"));
              address constant ATTACKER =
                  address(bytes20(hex"000000000000000000000000000000000000a11c"));

              uint24 constant FEE = 10000;

              function testGrossSpotShiftStressGrid() public {
                  uint256[9] memory amounts = [
                      uint256(0.0001 ether),
                      0.00025 ether,
                      0.0005 ether,
                      0.001 ether,
                      0.0025 ether,
                      0.005 ether,
                      0.01 ether,
                      0.025 ether,
                      0.05 ether
                  ];

                  (, int24 baselineTick,,,,,) = IPool(POOL).slot0();

                  string memory csv =
                      "amountInWei,success,amountOutWei,baselineTick,postTick\n";

                  for (uint256 i = 0; i < amounts.length; i++) {
                      uint256 snap = vm.snapshotState();
                      uint256 amountIn = amounts[i];

                      vm.deal(ATTACKER, amountIn + 1 ether);
                      vm.startPrank(ATTACKER);

                      IWETH(WETH).deposit{value: amountIn}();
                      require(IWETH(WETH).approve(ROUTER, amountIn), "approve");

                      bool ok;
                      uint256 amountOut;

                      try ISwapRouter02(ROUTER).exactInputSingle(
                          ISwapRouter02.ExactInputSingleParams({
                              tokenIn: WETH,
                              tokenOut: STONK,
                              fee: FEE,
                              recipient: ATTACKER,
                              amountIn: amountIn,
                              amountOutMinimum: 0,
                              sqrtPriceLimitX96: 0
                          })
                      ) returns (uint256 out) {
                          ok = true;
                          amountOut = out;
                      } catch {
                          ok = false;
                          amountOut = 0;
                      }

                      vm.stopPrank();

                      (, int24 postTick,,,,,) = IPool(POOL).slot0();

                      csv = string.concat(
                          csv,
                          vm.toString(amountIn), ",",
                          ok ? "true" : "false", ",",
                          vm.toString(amountOut), ",",
                          vm.toString(int256(baselineTick)), ",",
                          vm.toString(int256(postTick)), "\n"
                      );

                      require(vm.revertToState(snap), "snapshot revert");
                  }

                  vm.writeFile("data/manipulation-stress.csv", csv);
              }
          }
          EOF

      - name: Run fork manipulation stress grid
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --fork-url https://rpc.mainnet.chain.robinhood.com \
            --match-test testGrossSpotShiftStressGrid \
            -vv

          test -s data/manipulation-stress.csv
          cat data/manipulation-stress.csv

      - name: Analyze manipulation envelopes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv,json,math,datetime
          from decimal import Decimal,getcontext
          from pathlib import Path

          getcontext().prec=70

          rows=[]
          with open("data/manipulation-stress.csv") as f:
              for r in csv.DictReader(f):
                  base=int(r["baselineTick"])
                  post=int(r["postTick"])
                  delta=post-base
                  ratio=Decimal("1.0001")**Decimal(delta)
                  move=abs((ratio-1)*Decimal(10000))
                  rows.append({
                    "amountInWei":r["amountInWei"],
                    "amountInWeth":format(Decimal(r["amountInWei"])/Decimal(10**18),".18g"),
                    "success":r["success"].lower()=="true",
                    "amountOutWei":r["amountOutWei"],
                    "baselineTick":base,
                    "postTick":post,
                    "tickDelta":delta,
                    "spotMoveBps":float(move)
                  })

          successful=[r for r in rows if r["success"]]
          successful.sort(key=lambda r:int(r["amountInWei"]))

          window=1800
          targets=[50,100,250]
          holds=[300,900,1800]

          envelopes=[]
          for target in targets:
              for hold in holds:
                  required_spot=Decimal(target)*Decimal(window)/Decimal(hold)
                  qualifying=[
                      r for r in successful
                      if Decimal(str(r["spotMoveBps"])) >= required_spot
                  ]
                  prev=[
                      r for r in successful
                      if Decimal(str(r["spotMoveBps"])) < required_spot
                  ]
                  upper=min(qualifying,key=lambda r:int(r["amountInWei"])) if qualifying else None
                  lower=max(prev,key=lambda r:int(r["amountInWei"])) if prev else None
                  envelopes.append({
                    "targetTwapBiasBps":target,
                    "assumedManipulationHoldSeconds":hold,
                    "requiredApproxSpotMoveBps":float(required_spot),
                    "testedGrossWethLowerBracket":lower["amountInWeth"] if lower else None,
                    "testedGrossWethUpperBracket":upper["amountInWeth"] if upper else None,
                    "thresholdReachedInTestGrid":upper is not None,
                    "interpretation":(
                      "Coarse gross-input bracket from a forked swap grid. "
                      "This is NOT net economic attack cost, does not include unwind, "
                      "fees, arbitrage response, tick-by-tick liquidity changes, "
                      "MEV, or capital recovery."
                    )
                  })

          out={
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "oracleCandidateWindowSeconds":1800,
            "stressDirection":"WETH_TO_STONKBROKER",
            "trials":rows,
            "twapBiasEnvelopes":envelopes,
            "maxObservedSpotMoveBps":max((r["spotMoveBps"] for r in successful),default=None),
            "importantBoundary":(
              "These are gross spot-shift stress measurements on a fork, not a "
              "claim of exact manipulation cost. A production oracle still needs "
              "historical depth, both-direction stress, unwind economics, "
              "arbitrage/MEV assumptions, and independent review."
            )
          }
          Path("data/manipulation-analysis.json").write_text(
              json.dumps(out,indent=2,allow_nan=False)
          )
          print(json.dumps(out,indent=2,allow_nan=False))
          PY

      - name: Build v4.6 decision report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json,datetime,statistics
          from pathlib import Path

          pool=json.load(open("data/pool-binding.json"))
          hist=json.load(open("data/historical-analysis.json"))
          manip=json.load(open("data/manipulation-analysis.json"))

          h=hist["summary"]
          available=h["availableSamples"]
          hist_range=h["twap30mRangeBps"]
          liq_floor=h["liquidityMinVsLatestPct"]

          historical_signal=(
              available >= 5
              and hist_range is not None
              and liq_floor is not None
          )

          # Conservative engineering nomination only.
          candidate_retained=(
              historical_signal
              and hist_range < 1500
              and liq_floor >= 25
          )

          blockers=[
            "Authoritative production WETH/USD oracle + provenance still unresolved",
            "WETH/USD heartbeat/staleness policy still unresolved",
            "Current Registry sequencer interface is not proven compatible with Robinhood's documented websocket feed",
            "Gross fork stress is not a full manipulation-cost proof",
            "Both-direction attack/unwind economics and arbitrage/MEV response remain to be modeled",
            "Candidate TWAP oracle requires independent security review",
            "No mainnet oracle deployment or Registry write has been separately authorized"
          ]
          if available < 5:
              blockers.insert(0,"Insufficient historical archive samples were available from the public RPC")
          if not candidate_retained:
              blockers.insert(0,"30-minute TWAP candidate not retained by v4.6 historical stability gate")

          report={
            "project":"Rustee STONKBROKER Historical + Manipulation Analysis v4.6",
            "network":"Robinhood Chain Mainnet + Fork",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"READ_ONLY_AND_FORK_ONLY_NO_MAINNET_WRITES",
            "pool":pool,
            "v452Baseline":{
              "candidateWindowSeconds":1800,
              "crossWindowDispersionBps":34.05615988640384,
              "status":"INPUT_BASELINE_FROM_PRIOR_GREEN_V4_5_2"
            },
            "historicalAnalysis":hist,
            "manipulationStress":manip,
            "decision":{
              "historicalSignalAvailable":historical_signal,
              "candidate30mRetained":candidate_retained,
              "productionAuthorized":False,
              "reason":(
                "30m remains an engineering candidate; v4.6 adds historical "
                "sampling and fork spot-shift stress but deliberately does not "
                "treat a coarse gross-input grid as exact manipulation cost."
                if candidate_retained else
                "v4.6 does not retain 30m yet because the historical stability "
                "gate lacks enough evidence or exceeded conservative thresholds."
              )
            },
            "remainingBlockers":blockers,
            "executionGate":{
              "mainnetOracleDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":(
                "V4.6 HISTORICAL + FORK STRESS COMPLETE; 30M CANDIDATE "
                + ("RETAINED" if candidate_retained else "NOT YET RETAINED")
                + "; MAINNET REMAINS LOCKED"
              )
            }
          }

          Path("data/stonkbroker-v46.json").write_text(
              json.dumps(report,indent=2,allow_nan=False)
          )
          print(json.dumps(report,indent=2,allow_nan=False))
          PY

      - name: Validate v4.6 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,math
          p=json.load(open("data/stonkbroker-v46.json"))
          assert p["chainId"] == 4663
          assert p["pool"]["pairMatches"] is True
          assert p["pool"]["liquidityNonZero"] is True
          assert p["v452Baseline"]["candidateWindowSeconds"] == 1800
          assert p["executionGate"]["mainnetBroadcastAllowed"] is False
          assert p["executionGate"]["mainnetRegistryWritesAllowed"] is False
          assert len(p["manipulationStress"]["trials"]) >= 5
          for t in p["manipulationStress"]["trials"]:
              assert math.isfinite(t["spotMoveBps"])
          print("PASS v4.6")
          PY

      - name: Embed v4.6 report into page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,html

          p=Path("index.html")
          s=p.read_text()
          report=Path("data/stonkbroker-v46.json").read_text()
          embedded=html.escape(report)
          s=s.replace("__EMBEDDED_V46_REPORT__",embedded)
          p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
