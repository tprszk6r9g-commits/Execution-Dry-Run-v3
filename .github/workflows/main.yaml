name: Rustee STONKBROKER Bidirectional Stress v4.7.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v47-4.yaml"

permissions:
  contents: read

concurrency:
  group: rustee-stonkbroker-v47-4
  cancel-in-progress: true

jobs:
  bidirectional-stress:
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://rpc.mainnet.chain.robinhood.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Generate isolated stress project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src test out cache lib
          mkdir -p src test data lib

          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.26"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "./data" }]
          EOF

          cat > src/Placeholder.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;
          contract Placeholder {}
          EOF

          cat > test/BidirectionalStress.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          import {Test} from "forge-std/Test.sol";

          interface IERC20 {
              function approve(address spender, uint256 amount)
                  external
                  returns (bool);
          }

          interface IWETH is IERC20 {
              function deposit() external payable;
          }

          interface IPool {
              function slot0()
                  external
                  view
                  returns (
                      uint160,
                      int24,
                      uint16,
                      uint16,
                      uint16,
                      uint8,
                      bool
                  );
          }

          interface ISwapRouter02 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }

              function exactInputSingle(
                  ExactInputSingleParams calldata params
              ) external payable returns (uint256 amountOut);
          }

          contract BidirectionalStress is Test {
              // v4.7.4 compile fix:
              // 21-byte integer literals (leading 00) are converted to uint160,
              // then address. Solidity therefore does not interpret the source
              // token as a 20-byte address literal and cannot reject it for
              // EIP-55 checksum formatting.
              address constant WETH =
                  address(uint160(0x000bd7d308f8e1639fab988df18a8011f41eacad73));
              address constant STONK =
                  address(uint160(0x00e934e36a439c94017b64a3fece66af12099abf50));
              address constant ROUTER =
                  address(uint160(0x00caf681a66d020601342297493863e78c959e5cb2));
              address constant POOL =
                  address(uint160(0x009cd74d5980a4bf60408b9ba2b0f6a3d368ebf594));
              address constant ATTACKER =
                  address(uint160(0x00000000000000000000000000000000000000b047));

              uint24 constant FEE = 10000;

              function swap(
                  address tokenIn,
                  address tokenOut,
                  uint256 amountIn
              ) internal returns (bool ok, uint256 out) {
                  try ISwapRouter02(ROUTER).exactInputSingle(
                      ISwapRouter02.ExactInputSingleParams({
                          tokenIn: tokenIn,
                          tokenOut: tokenOut,
                          fee: FEE,
                          recipient: ATTACKER,
                          amountIn: amountIn,
                          amountOutMinimum: 0,
                          sqrtPriceLimitX96: 0
                      })
                  ) returns (uint256 result) {
                      return (true, result);
                  } catch {
                      return (false, 0);
                  }
              }

              function appendRow(
                  string memory direction,
                  uint256 amountIn,
                  bool ok,
                  uint256 amountOut,
                  int24 baselineTick,
                  int24 postTick
              ) internal {
                  vm.writeLine(
                      "data/v47-stress.csv",
                      string.concat(
                          direction, ",",
                          vm.toString(amountIn), ",",
                          ok ? "true" : "false", ",",
                          vm.toString(amountOut), ",",
                          vm.toString(int256(baselineTick)), ",",
                          vm.toString(int256(postTick))
                      )
                  );
              }

              function testBidirectionalStress() public {
                  uint256[13] memory wethAmounts = [
                      uint256(0.0001 ether),
                      0.00025 ether,
                      0.0005 ether,
                      0.001 ether,
                      0.0025 ether,
                      0.005 ether,
                      0.01 ether,
                      0.025 ether,
                      0.05 ether,
                      0.1 ether,
                      0.25 ether,
                      0.5 ether,
                      1 ether
                  ];

                  (, int24 baselineTick,,,,,) = IPool(POOL).slot0();

                  vm.writeFile(
                      "data/v47-stress.csv",
                      "direction,inputWei,success,outputWei,baselineTick,postTick\n"
                  );

                  // A: WETH -> STONK, each amount from an identical fork state.
                  for (uint256 i = 0; i < wethAmounts.length; i++) {
                      uint256 snap = vm.snapshotState();
                      uint256 amt = wethAmounts[i];

                      vm.deal(ATTACKER, amt + 2 ether);
                      vm.startPrank(ATTACKER);
                      IWETH(WETH).deposit{value: amt}();
                      require(
                          IERC20(WETH).approve(ROUTER, amt),
                          "approve weth"
                      );
                      (bool ok, uint256 out) = swap(WETH, STONK, amt);
                      vm.stopPrank();

                      (, int24 postTick,,,,,) = IPool(POOL).slot0();
                      appendRow(
                          "WETH_TO_STONK",
                          amt,
                          ok,
                          out,
                          baselineTick,
                          postTick
                      );

                      require(vm.revertToState(snap), "revert A");
                  }

                  // Obtain a reverse-direction size scale, then revert it.
                  uint256 sizeSnap = vm.snapshotState();
                  vm.deal(ATTACKER, 2 ether);
                  vm.startPrank(ATTACKER);
                  IWETH(WETH).deposit{value: 1 ether}();
                  require(
                      IERC20(WETH).approve(ROUTER, 1 ether),
                      "size approve"
                  );
                  (bool sizeOk, uint256 oneWethOut) =
                      swap(WETH, STONK, 1 ether);
                  vm.stopPrank();
                  require(sizeOk && oneWethOut > 0, "size swap");
                  require(vm.revertToState(sizeSnap), "size revert");

                  uint256[10] memory fractionsBps = [
                      uint256(10),
                      25,
                      50,
                      100,
                      250,
                      500,
                      1000,
                      2500,
                      5000,
                      10000
                  ];

                  // B: STONK -> WETH. deal() assigns off-pool balance so every
                  // trial starts at the same canonical pool state.
                  for (uint256 i = 0; i < fractionsBps.length; i++) {
                      uint256 snap = vm.snapshotState();
                      uint256 amt =
                          (oneWethOut * fractionsBps[i]) / 10000;

                      deal(STONK, ATTACKER, amt);

                      vm.startPrank(ATTACKER);
                      require(
                          IERC20(STONK).approve(ROUTER, amt),
                          "approve stonk"
                      );
                      (bool ok, uint256 out) = swap(STONK, WETH, amt);
                      vm.stopPrank();

                      (, int24 postTick,,,,,) = IPool(POOL).slot0();
                      appendRow(
                          "STONK_TO_WETH",
                          amt,
                          ok,
                          out,
                          baselineTick,
                          postTick
                      );

                      require(vm.revertToState(snap), "revert B");
                  }
              }
          }
          EOF

      - name: Compile first
        shell: bash
        run: |
          set -euo pipefail
          forge build

      - name: Run bidirectional stress suite
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --fork-url "$RPC_URL" \
            --match-test testBidirectionalStress \
            -vv

          test -s data/v47-stress.csv
          cat data/v47-stress.csv

      - name: Validate fresh-baseline and opposite-direction behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, json
          from pathlib import Path

          rows = list(csv.DictReader(open("data/v47-stress.csv")))
          assert rows, "no stress rows"

          ok = [r for r in rows if r["success"].lower() == "true"]
          assert ok, "no successful swaps"

          baselines = {int(r["baselineTick"]) for r in ok}
          assert len(baselines) == 1, f"baseline changed across trials: {baselines}"

          a = [r for r in ok if r["direction"] == "WETH_TO_STONK"]
          b = [r for r in ok if r["direction"] == "STONK_TO_WETH"]
          assert a and b, "missing a direction"

          da = [int(r["postTick"]) - int(r["baselineTick"]) for r in a]
          db = [int(r["postTick"]) - int(r["baselineTick"]) for r in b]

          # token0=WETH, token1=STONK:
          # WETH->STONK should push tick down; STONK->WETH should push it up.
          assert all(x <= 0 for x in da), da
          assert all(x >= 0 for x in db), db
          assert any(x < 0 for x in da), "no measurable WETH->STONK movement"
          assert any(x > 0 for x in db), "no measurable STONK->WETH movement"

          report = {
              "project": "Rustee STONKBROKER Bidirectional Stress v4.7.4",
              "mode": "FORK_ONLY_NO_MAINNET_WRITES",
              "compileFix": "address literals converted via 21-byte integer -> uint160 -> address",
              "rows": len(rows),
              "successfulRows": len(ok),
              "freshBaselineInvariantPass": True,
              "wethToStonkDirectionPass": True,
              "stonkToWethDirectionPass": True,
              "oppositeDirectionPass": True,
              "mainnetWrites": False
          }
          Path("data/v47-4-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: rustee-v47-4-evidence
          path: |
            data/v47-stress.csv
            data/v47-4-report.json
