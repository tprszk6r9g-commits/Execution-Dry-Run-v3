name: Rustee STONKBROKER TBA Policy Fork Gate v4.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v41
  cancel-in-progress: true

jobs:
  tba-policy-fork-gate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify deployed Rustee binding and DEX contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="https://rpc.mainnet.chain.robinhood.com"
          NFT="0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"
          QUOTER="0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"

          for A in "$NFT" "$REGISTRY" "$TBA" "$WETH" "$STONK" "$ROUTER" "$QUOTER" "$POOL"; do
            test "$(cast code "$A" --rpc-url "$RPC")" != "0x"
          done

          OWNER="$(cast call "$TBA" 'owner()(address)' --rpc-url "$RPC")"
          REG_ACTUAL="$(cast call "$TBA" 'registry()(address)' --rpc-url "$RPC")"
          TOKEN_RAW="$(cast call "$TBA" 'token()(uint256,address,uint256)' --rpc-url "$RPC")"

          python3 - "$OWNER" "$REG_ACTUAL" "$TOKEN_RAW" <<'PY'
          import json,sys
          from pathlib import Path
          expected_owner="0x8fc320c8582f812695b6f62b2b5d13b14475b955"
          expected_reg="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          owner=sys.argv[1].strip().lower()
          registry=sys.argv[2].strip().lower()
          p={
            "owner":owner,
            "registry":registry,
            "tokenRaw":sys.argv[3].strip(),
            "ownerMatches":owner==expected_owner,
            "registryMatches":registry==expected_reg
          }
          Path("data/binding.json").write_text(json.dumps(p,indent=2))
          assert p["ownerMatches"], "TBA owner mismatch"
          assert p["registryMatches"], "TBA registry mismatch"
          print("PASS deployed TBA binding")
          PY

      - name: Generate isolated TBA policy fork test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src test script out cache
          rm -f foundry.toml
          mkdir -p src test data

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.26"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "./data" }]
          EOF

          cat > src/Placeholder.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;
          contract Placeholder {}
          EOF

          cat > test/RusteeStonkbrokerPolicyFork.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface Vm {
              function deal(address who, uint256 newBalance) external;
              function prank(address msgSender) external;
              function startPrank(address msgSender) external;
              function stopPrank() external;
              function expectRevert(bytes4 selector) external;
              function writeFile(string calldata path, string calldata data) external;
              function toString(uint256 value) external pure returns (string memory);
          }

          interface IERC20 {
              function balanceOf(address who) external view returns (uint256);
              function allowance(address owner, address spender) external view returns (uint256);
          }

          interface IWETH is IERC20 {
              function deposit() external payable;
          }

          interface IQuoterV2 {
              struct QuoteExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint24 fee;
                  uint160 sqrtPriceLimitX96;
              }
              function quoteExactInputSingle(
                  QuoteExactInputSingleParams memory params
              ) external returns (uint256,uint160,uint32,uint256);
          }

          interface ISwapRouter02 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }
              function exactInputSingle(
                  ExactInputSingleParams calldata params
              ) external payable returns (uint256 amountOut);
          }

          interface IStockTokenVenueAdapter {
              struct TradeRequest {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  uint256 deadline;
                  bytes venueData;
              }
              struct TradePlan {
                  address venue;
                  address spender;
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  address recipient;
                  bytes callData;
              }
              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan);
          }

          interface IStockTradingAccount {
              function executeTrade(
                  address adapter,
                  IStockTokenVenueAdapter.TradeRequest calldata request
              ) external returns (uint256 amountSpent, uint256 amountReceived);
          }

          interface IRegistry {
              struct TradingPolicy {
                  uint128 maxTradeUsd18;
                  uint128 maxDailyUsd18;
                  uint32 maxTradesPerDay;
                  bool paused;
              }
              function setAsset(
                  address token,
                  bytes32 symbol,
                  bool isStockToken,
                  address priceFeed,
                  uint32 heartbeat
              ) external;
              function setAdapter(address adapter, bool enabled) external;
              function setVenue(address venue, bool enabled) external;
              function setSpender(address spender, bool enabled) external;
              function setSequencerConfig(address feed, uint64 gracePeriod) external;
              function setTradingPolicy(TradingPolicy calldata next) external;
          }

          contract MockAggregatorV3 {
              uint8 public immutable decimals;
              int256 public answer;
              uint256 public startedAt;
              uint256 public updatedAt;
              constructor(uint8 decimals_, int256 answer_) {
                  decimals=decimals_;
                  answer=answer_;
                  startedAt=block.timestamp-2 hours;
                  updatedAt=block.timestamp;
              }
              function latestRoundData()
                  external
                  view
                  returns (uint80,int256,uint256,uint256,uint80)
              {
                  return (1,answer,startedAt,updatedAt,1);
              }
          }

          contract MockSequencerFeed {
              function latestRoundData()
                  external
                  view
                  returns (uint80,int256,uint256,uint256,uint80)
              {
                  return (1,0,block.timestamp-2 hours,block.timestamp,1);
              }
          }

          contract RusteeStonkbrokerV3Adapter is IStockTokenVenueAdapter {
              address public immutable weth;
              address public immutable stonk;
              address public immutable router;
              uint24 public immutable fee;

              constructor(address weth_,address stonk_,address router_,uint24 fee_) {
                  weth=weth_;
                  stonk=stonk_;
                  router=router_;
                  fee=fee_;
              }

              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan) {
                  require(request.tokenIn==weth,"tokenIn");
                  require(request.tokenOut==stonk,"tokenOut");

                  bytes memory callData=abi.encodeCall(
                      ISwapRouter02.exactInputSingle,
                      (
                          ISwapRouter02.ExactInputSingleParams({
                              tokenIn:request.tokenIn,
                              tokenOut:request.tokenOut,
                              fee:fee,
                              recipient:tradingAccount,
                              amountIn:request.amountIn,
                              amountOutMinimum:request.minAmountOut,
                              sqrtPriceLimitX96:0
                          })
                      )
                  );

                  plan=TradePlan({
                      venue:router,
                      spender:router,
                      tokenIn:request.tokenIn,
                      tokenOut:request.tokenOut,
                      amountIn:request.amountIn,
                      minAmountOut:request.minAmountOut,
                      recipient:tradingAccount,
                      callData:callData
                  });
              }
          }

          contract RusteeStonkbrokerPolicyForkTest {
              Vm constant vm=Vm(address(uint160(uint256(keccak256("hevm cheat code")))));

              address constant OWNER=address(bytes20(hex"8fc320c8582f812695b6f62b2b5d13b14475b955"));
              address constant OUTSIDER=address(bytes20(hex"000000000000000000000000000000000000dead"));
              address constant REGISTRY=address(bytes20(hex"a36a28f160d9cf0bb924c2ed5a1263dd11e54199"));
              address constant TBA=address(bytes20(hex"522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"));
              address constant WETH=address(bytes20(hex"0bd7d308f8e1639fab988df18a8011f41eacad73"));
              address constant STONK=address(bytes20(hex"e934e36a439c94017b64a3fece66af12099abf50"));
              address constant ROUTER=address(bytes20(hex"caf681a66d020601342297493863e78c959e5cb2"));
              address constant QUOTER=address(bytes20(hex"33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"));

              bytes4 constant INVALID_SIGNER=bytes4(keccak256("InvalidSigner()"));
              uint24 constant FEE=10000;

              function testRealRusteeTbaPolicyPathOnFork() public {
                  MockAggregatorV3 wethUsd=new MockAggregatorV3(8,2000e8);
                  MockAggregatorV3 stonkUsd=new MockAggregatorV3(8,1e6);
                  MockSequencerFeed sequencer=new MockSequencerFeed();
                  RusteeStonkbrokerV3Adapter adapter=
                      new RusteeStonkbrokerV3Adapter(WETH,STONK,ROUTER,FEE);

                  vm.startPrank(OWNER);
                  IRegistry(REGISTRY).setAsset(
                      WETH,bytes32("WETH"),false,address(wethUsd),1 hours
                  );
                  IRegistry(REGISTRY).setAsset(
                      STONK,bytes32("STONKBROKER"),false,address(stonkUsd),1 hours
                  );
                  IRegistry(REGISTRY).setAdapter(address(adapter),true);
                  IRegistry(REGISTRY).setVenue(ROUTER,true);
                  IRegistry(REGISTRY).setSpender(ROUTER,true);
                  IRegistry(REGISTRY).setSequencerConfig(address(sequencer),60);
                  IRegistry(REGISTRY).setTradingPolicy(
                      IRegistry.TradingPolicy({
                          maxTradeUsd18:uint128(5 ether),
                          maxDailyUsd18:uint128(10 ether),
                          maxTradesPerDay:1,
                          paused:false
                      })
                  );
                  vm.stopPrank();

                  uint256 amountIn=0.00025 ether;
                  (uint256 quotedOut,,,) =
                      IQuoterV2(QUOTER).quoteExactInputSingle(
                          IQuoterV2.QuoteExactInputSingleParams({
                              tokenIn:WETH,
                              tokenOut:STONK,
                              amountIn:amountIn,
                              fee:FEE,
                              sqrtPriceLimitX96:0
                          })
                      );
                  require(quotedOut>0,"zero quote");
                  uint256 minOut=quotedOut*97/100;

                  vm.deal(TBA,amountIn+0.01 ether);
                  vm.prank(TBA);
                  IWETH(WETH).deposit{value:amountIn}();

                  uint256 beforeStonk=IERC20(STONK).balanceOf(TBA);

                  IStockTokenVenueAdapter.TradeRequest memory request=
                      IStockTokenVenueAdapter.TradeRequest({
                          tokenIn:WETH,
                          tokenOut:STONK,
                          amountIn:amountIn,
                          minAmountOut:minOut,
                          deadline:block.timestamp+10 minutes,
                          venueData:bytes("")
                      });

                  vm.prank(OUTSIDER);
                  vm.expectRevert(INVALID_SIGNER);
                  IStockTradingAccount(TBA).executeTrade(address(adapter),request);

                  vm.prank(OWNER);
                  (uint256 spent,uint256 received)=
                      IStockTradingAccount(TBA).executeTrade(address(adapter),request);

                  uint256 afterStonk=IERC20(STONK).balanceOf(TBA);
                  uint256 allowanceAfter=IERC20(WETH).allowance(TBA,ROUTER);

                  require(spent>0,"nothing spent");
                  require(spent<=amountIn,"overspent");
                  require(received>=minOut,"output below min");
                  require(afterStonk>beforeStonk,"no STONKBROKER");
                  require(allowanceAfter==0,"router allowance remains");

                  string memory report=string.concat(
                      "{",
                      '"ok":true,',
                      '"forkOnly":true,',
                      '"actualDeployedTba":true,',
                      '"actualDeployedRegistry":true,',
                      '"ownerAuthorizationPassed":true,',
                      '"outsiderRejected":true,',
                      '"policyTemporarilyConfiguredOnFork":true,',
                      '"policyMaxTradeUsd18":"5000000000000000000",',
                      '"feeTier":10000,',
                      '"amountInWei":"',vm.toString(amountIn),'",',
                      '"quotedOutWei":"',vm.toString(quotedOut),'",',
                      '"minimumOutWei":"',vm.toString(minOut),'",',
                      '"amountSpentWei":"',vm.toString(spent),'",',
                      '"amountReceivedWei":"',vm.toString(received),'",',
                      '"allowanceAfterWei":"',vm.toString(allowanceAfter),'"',
                      "}"
                  );

                  vm.writeFile("data/stonkbroker-tba-policy-fork.json",report);
              }
          }
          EOF

      - name: Compile v4.1 policy test
        shell: bash
        run: |
          set -euo pipefail
          forge build

      - name: Run genuine Rustee TBA policy path on fork
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --fork-url https://rpc.mainnet.chain.robinhood.com \
            --match-test testRealRusteeTbaPolicyPathOnFork \
            -vv

      - name: Build v4.1 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,datetime
          from pathlib import Path
          binding=json.load(open("data/binding.json"))
          proof=json.load(open("data/stonkbroker-tba-policy-fork.json"))
          p={
            "project":"Rustee STONKBROKER TBA Policy Fork Gate v4.1",
            "network":"Robinhood Chain Mainnet Fork",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"FORK_ONLY_NO_MAINNET_WRITES",
            "binding":binding,
            "proof":proof,
            "whatPassed":[
              "Actual deployed Rustee trading TBA binding",
              "Actual deployed Rustee StockTokenRegistry binding",
              "Fork-only WETH and STONKBROKER asset configuration",
              "Fork-only adapter, venue and spender allowlisting",
              "Fork-only sequencer health configuration",
              "Fork-only $5 / $10 / one-trade policy unpause",
              "Unauthorized caller rejection",
              "NFT owner authorization",
              "Actual deployed TBA executeTrade entry point",
              "WETH to STONKBROKER Uniswap route",
              "Minimum-output enforcement",
              "Router allowance reset to zero"
            ],
            "importantBoundary":{
              "mockWethUsdFeedUsedOnFork":True,
              "mockStonkUsdFeedUsedOnFork":True,
              "mockSequencerFeedUsedOnFork":True,
              "productionOracleReadinessProven":False,
              "mainnetRegistryConfigurationProven":False
            },
            "executionGate":{
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":"ACTUAL RUSTEE TBA POLICY PATH PASSED ON FORK; LIVE MEMECOIN CONFIGURATION AND TRANSACTION PREFLIGHT STILL REQUIRED"
            }
          }
          Path("data/stonkbroker-v41.json").write_text(json.dumps(p,indent=2))
          Path("stonkbroker-v41.json").write_text(json.dumps(p,indent=2))
          PY

      - name: Embed v4.1 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("data/stonkbroker-v41.json"))
          h=Path("index.html").read_text()
          e=json.dumps(p,separators=(",",":")).replace("</","<\\/")
          s='<script id="v41-report" type="application/json">'+e+'</script>'
          s+="<script>(()=>{const n=document.getElementById('v41-report');const o=document.getElementById('report');if(n&&o)o.textContent=JSON.stringify(JSON.parse(n.textContent),null,2);})();</script>"
          Path("index.html").write_text(h.replace("</body>",s+"</body>"))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
