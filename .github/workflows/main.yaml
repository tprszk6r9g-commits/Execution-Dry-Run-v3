name: Rustee STONKBROKER Live Configuration Preflight v4.2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v421
  cancel-in-progress: true

jobs:
  live-config-preflight:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read current deployed state
        shell: bash
        env:
          WETH_USD_FEED_ADDRESS: ${{ vars.WETH_USD_FEED_ADDRESS }}
          STONKBROKER_USD_FEED_ADDRESS: ${{ vars.STONKBROKER_USD_FEED_ADDRESS }}
          SEQUENCER_FEED_ADDRESS: ${{ vars.SEQUENCER_FEED_ADDRESS }}
          PRODUCTION_ADAPTER_ADDRESS: ${{ vars.PRODUCTION_ADAPTER_ADDRESS }}
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="https://rpc.mainnet.chain.robinhood.com"
          OWNER="0x8fC320c8582f812695b6f62b2b5d13B14475B955"
          NFT="0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"
          QUOTER="0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"

          for A in "$NFT" "$REGISTRY" "$TBA" "$WETH" "$STONK" "$ROUTER" "$QUOTER" "$POOL"; do
            test "$(cast code "$A" --rpc-url "$RPC")" != "0x"
          done

          OWNER_ACTUAL="$(cast call "$TBA" 'owner()(address)' --rpc-url "$RPC")"
          REG_ACTUAL="$(cast call "$TBA" 'registry()(address)' --rpc-url "$RPC")"
          TOKEN_RAW="$(cast call "$TBA" 'token()(uint256,address,uint256)' --rpc-url "$RPC")"

          POLICY="$(cast call "$REGISTRY" 'tradingPolicy()(uint128,uint128,uint32,bool)' --rpc-url "$RPC" 2>/dev/null || true)"
          VENUE_ALLOWED="$(cast call "$REGISTRY" 'allowedVenues(address)(bool)' "$ROUTER" --rpc-url "$RPC" 2>/dev/null || true)"
          SPENDER_ALLOWED="$(cast call "$REGISTRY" 'allowedSpenders(address)(bool)' "$ROUTER" --rpc-url "$RPC" 2>/dev/null || true)"

          python3 - "$OWNER_ACTUAL" "$REG_ACTUAL" "$TOKEN_RAW" "$POLICY" "$VENUE_ALLOWED" "$SPENDER_ALLOWED" <<'PY'
          import json, os, sys, re
          from pathlib import Path

          def addr_ok(v):
              return bool(v and re.fullmatch(r"0x[0-9a-fA-F]{40}",v))

          p={
            "binding":{
              "owner":sys.argv[1].strip().lower(),
              "registry":sys.argv[2].strip().lower(),
              "tokenRaw":sys.argv[3].strip(),
              "ownerMatches":sys.argv[1].strip().lower()=="0x8fc320c8582f812695b6f62b2b5d13b14475b955",
              "registryMatches":sys.argv[2].strip().lower()=="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
            },
            "currentMainnet":{
              "tradingPolicyRaw":sys.argv[4].strip() or None,
              "routerVenueAllowedRaw":sys.argv[5].strip() or None,
              "routerSpenderAllowedRaw":sys.argv[6].strip() or None
            },
            "productionInputs":{
              "wethUsdFeed":os.getenv("WETH_USD_FEED_ADDRESS") or None,
              "stonkbrokerUsdFeed":os.getenv("STONKBROKER_USD_FEED_ADDRESS") or None,
              "sequencerFeed":os.getenv("SEQUENCER_FEED_ADDRESS") or None,
              "productionAdapter":os.getenv("PRODUCTION_ADAPTER_ADDRESS") or None
            }
          }
          p["productionInputsValid"]={
            k:addr_ok(v) for k,v in p["productionInputs"].items()
          }
          Path("data/current-state.json").write_text(json.dumps(p,indent=2))
          assert p["binding"]["ownerMatches"]
          assert p["binding"]["registryMatches"]
          PY

      - name: Generate v4.2 fork safety suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src test script out cache
          rm -f foundry.toml
          mkdir -p src test data

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.26"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "./data" }]
          EOF

          cat > src/Placeholder.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;
          contract Placeholder {}
          EOF

          cat > test/RusteeStonkbrokerV42.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface Vm {
              function deal(address who,uint256 newBalance) external;
              function prank(address msgSender) external;
              function startPrank(address msgSender) external;
              function stopPrank() external;
              function expectRevert() external;
              function writeFile(string calldata path,string calldata data) external;
              function toString(uint256 value) external pure returns (string memory);
          }

          interface IERC20 {
              function balanceOf(address who) external view returns (uint256);
              function allowance(address owner,address spender) external view returns (uint256);
          }

          interface IWETH is IERC20 {
              function deposit() external payable;
          }

          interface IQuoterV2 {
              struct QuoteExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint24 fee;
                  uint160 sqrtPriceLimitX96;
              }
              function quoteExactInputSingle(
                  QuoteExactInputSingleParams memory params
              ) external returns (uint256,uint160,uint32,uint256);
          }

          interface ISwapRouter02 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }
              function exactInputSingle(
                  ExactInputSingleParams calldata params
              ) external payable returns (uint256);
          }

          interface IStockTokenVenueAdapter {
              struct TradeRequest {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  uint256 deadline;
                  bytes venueData;
              }
              struct TradePlan {
                  address venue;
                  address spender;
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  address recipient;
                  bytes callData;
              }
              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan);
          }

          interface IStockTradingAccount {
              function executeTrade(
                  address adapter,
                  IStockTokenVenueAdapter.TradeRequest calldata request
              ) external returns (uint256 amountSpent,uint256 amountReceived);
          }

          interface IRegistry {
              struct TradingPolicy {
                  uint128 maxTradeUsd18;
                  uint128 maxDailyUsd18;
                  uint32 maxTradesPerDay;
                  bool paused;
              }
              function setAsset(
                  address token,
                  bytes32 symbol,
                  bool isStockToken,
                  address priceFeed,
                  uint32 heartbeat
              ) external;
              function setAdapter(address adapter,bool enabled) external;
              function setVenue(address venue,bool enabled) external;
              function setSpender(address spender,bool enabled) external;
              function setSequencerConfig(address feed,uint64 gracePeriod) external;
              function setTradingPolicy(TradingPolicy calldata next) external;
          }

          contract MockAggregatorV3 {
              uint8 public immutable decimals;
              int256 public answer;
              uint256 public startedAt;
              uint256 public updatedAt;

              constructor(uint8 d,int256 a,uint256 age) {
                  decimals=d;
                  answer=a;
                  startedAt=block.timestamp-age;
                  updatedAt=block.timestamp-age;
              }

              function latestRoundData()
                  external view returns (uint80,int256,uint256,uint256,uint80)
              {
                  return (1,answer,startedAt,updatedAt,1);
              }
          }

          contract MockSequencer {
              int256 public answer;
              uint256 public startedAt;
              constructor(int256 a) {
                  answer=a;
                  startedAt=block.timestamp-2 hours;
              }
              function latestRoundData()
                  external view returns (uint80,int256,uint256,uint256,uint80)
              {
                  return (1,answer,startedAt,block.timestamp,1);
              }
          }

          contract V42Adapter is IStockTokenVenueAdapter {
              address immutable weth;
              address immutable stonk;
              address immutable venue;
              address immutable spender;
              uint24 immutable fee;

              constructor(
                  address w,address s,address v,address sp,uint24 f
              ){
                  weth=w; stonk=s; venue=v; spender=sp; fee=f;
              }

              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan) {
                  require(request.tokenIn==weth,"tokenIn");
                  require(request.tokenOut==stonk,"tokenOut");
                  bytes memory callData=abi.encodeCall(
                      ISwapRouter02.exactInputSingle,
                      (
                          ISwapRouter02.ExactInputSingleParams({
                              tokenIn:request.tokenIn,
                              tokenOut:request.tokenOut,
                              fee:fee,
                              recipient:tradingAccount,
                              amountIn:request.amountIn,
                              amountOutMinimum:request.minAmountOut,
                              sqrtPriceLimitX96:0
                          })
                      )
                  );
                  plan=TradePlan({
                      venue:venue,
                      spender:spender,
                      tokenIn:request.tokenIn,
                      tokenOut:request.tokenOut,
                      amountIn:request.amountIn,
                      minAmountOut:request.minAmountOut,
                      recipient:tradingAccount,
                      callData:callData
                  });
              }
          }

          contract RusteeStonkbrokerV42Test {
              Vm constant vm=Vm(
                  address(uint160(uint256(keccak256("hevm cheat code"))))
              );

              address constant OWNER=address(bytes20(hex"8fc320c8582f812695b6f62b2b5d13b14475b955"));
              address constant OUTSIDER=address(bytes20(hex"000000000000000000000000000000000000dead"));
              address constant REGISTRY=address(bytes20(hex"a36a28f160d9cf0bb924c2ed5a1263dd11e54199"));
              address constant TBA=address(bytes20(hex"522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"));
              address constant WETH=address(bytes20(hex"0bd7d308f8e1639fab988df18a8011f41eacad73"));
              address constant STONK=address(bytes20(hex"e934e36a439c94017b64a3fece66af12099abf50"));
              address constant ROUTER=address(bytes20(hex"caf681a66d020601342297493863e78c959e5cb2"));
              address constant QUOTER=address(bytes20(hex"33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"));
              uint24 constant FEE=10000;

              function configure(
                  uint256 wethAge,
                  uint256 stonkAge,
                  int256 sequencerAnswer,
                  bool allowVenue,
                  bool allowSpender
              ) internal returns (V42Adapter adapter) {
                  MockAggregatorV3 wethUsd=new MockAggregatorV3(8,2000e8,wethAge);
                  MockAggregatorV3 stonkUsd=new MockAggregatorV3(8,1e6,stonkAge);
                  MockSequencer seq=new MockSequencer(sequencerAnswer);
                  adapter=new V42Adapter(WETH,STONK,ROUTER,ROUTER,FEE);

                  vm.startPrank(OWNER);
                  IRegistry(REGISTRY).setAsset(
                      WETH,bytes32("WETH"),false,address(wethUsd),1 hours
                  );
                  IRegistry(REGISTRY).setAsset(
                      STONK,bytes32("STONKBROKER"),false,address(stonkUsd),1 hours
                  );
                  IRegistry(REGISTRY).setAdapter(address(adapter),true);
                  if (allowVenue) IRegistry(REGISTRY).setVenue(ROUTER,true);
                  if (allowSpender) IRegistry(REGISTRY).setSpender(ROUTER,true);
                  IRegistry(REGISTRY).setSequencerConfig(address(seq),60);
                  IRegistry(REGISTRY).setTradingPolicy(
                      IRegistry.TradingPolicy({
                          maxTradeUsd18:uint128(5 ether),
                          maxDailyUsd18:uint128(10 ether),
                          maxTradesPerDay:1,
                          paused:false
                      })
                  );
                  vm.stopPrank();
              }

              function requestFor(
                  uint256 amountIn,
                  uint256 minOut
              ) internal view returns (
                  IStockTokenVenueAdapter.TradeRequest memory request
              ) {
                  request=IStockTokenVenueAdapter.TradeRequest({
                      tokenIn:WETH,
                      tokenOut:STONK,
                      amountIn:amountIn,
                      minAmountOut:minOut,
                      deadline:block.timestamp+10 minutes,
                      venueData:bytes("")
                  });
              }

              function quote(uint256 amountIn) internal returns (uint256 q) {
                  (q,,,) = IQuoterV2(QUOTER).quoteExactInputSingle(
                      IQuoterV2.QuoteExactInputSingleParams({
                          tokenIn:WETH,
                          tokenOut:STONK,
                          amountIn:amountIn,
                          fee:FEE,
                          sqrtPriceLimitX96:0
                      })
                  );
              }

              function fundWeth(uint256 amount) internal {
                  vm.deal(TBA,amount+0.01 ether);
                  vm.prank(TBA);
                  IWETH(WETH).deposit{value:amount}();
              }

              function testV42HappyPath() public {
                  V42Adapter adapter=configure(0,0,0,true,true);
                  uint256 amount=0.00025 ether;
                  uint256 q=quote(amount);
                  uint256 minOut=q*97/100;
                  fundWeth(amount);

                  uint256 beforeBal=IERC20(STONK).balanceOf(TBA);
                  vm.prank(OWNER);
                  (uint256 spent,uint256 received)=
                      IStockTradingAccount(TBA).executeTrade(
                          address(adapter),requestFor(amount,minOut)
                      );

                  require(spent==amount,"spent mismatch");
                  require(received>=minOut,"received low");
                  require(IERC20(STONK).balanceOf(TBA)>beforeBal,"no stonk");
                  require(IERC20(WETH).allowance(TBA,ROUTER)==0,"allowance");

                  vm.writeFile(
                      "data/v42-happy.json",
                      string.concat(
                          "{",
                          '"ok":true,',
                          '"spentWei":"',vm.toString(spent),'",',
                          '"receivedWei":"',vm.toString(received),'",',
                          '"allowanceAfterWei":"0"',
                          "}"
                      )
                  );
              }

              function testUnauthorizedCallerRejected() public {
                  V42Adapter adapter=configure(0,0,0,true,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OUTSIDER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testOverFiveDollarTradeRejected() public {
                  V42Adapter adapter=configure(0,0,0,true,true);
                  uint256 amount=0.003 ether; // ~= $6 at mock $2,000 WETH
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testSecondTradeSameDayRejected() public {
                  V42Adapter adapter=configure(0,0,0,true,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount*2);
                  vm.prank(OWNER);
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testUnapprovedAdapterRejected() public {
                  configure(0,0,0,true,true);
                  V42Adapter rogue=new V42Adapter(WETH,STONK,ROUTER,ROUTER,FEE);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(rogue),requestFor(amount,q*90/100)
                  );
              }

              function testVenueNotAllowedRejected() public {
                  V42Adapter adapter=configure(0,0,0,false,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testSpenderNotAllowedRejected() public {
                  V42Adapter adapter=configure(0,0,0,true,false);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testStaleWethOracleRejected() public {
                  V42Adapter adapter=configure(2 hours,0,0,true,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testBadSequencerRejected() public {
                  V42Adapter adapter=configure(0,0,1,true,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*90/100)
                  );
              }

              function testImpossibleMinOutputRejected() public {
                  V42Adapter adapter=configure(0,0,0,true,true);
                  uint256 amount=0.0001 ether;
                  uint256 q=quote(amount);
                  fundWeth(amount);
                  vm.prank(OWNER);
                  vm.expectRevert();
                  IStockTradingAccount(TBA).executeTrade(
                      address(adapter),requestFor(amount,q*2)
                  );
              }
          }
          EOF

      - name: Compile v4.2 safety suite
        shell: bash
        run: |
          set -euo pipefail
          forge build

      - name: Run v4.2 safety suite on fresh mainnet fork
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --fork-url https://rpc.mainnet.chain.robinhood.com \
            --match-contract RusteeStonkbrokerV42Test \
            -vv

      - name: Compile candidate production adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          cat > candidate/RusteeStonkbrokerV3Adapter.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface IStockTokenVenueAdapterV42 {
              struct TradeRequest {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  uint256 deadline;
                  bytes venueData;
              }
              struct TradePlan {
                  address venue;
                  address spender;
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint256 minAmountOut;
                  address recipient;
                  bytes callData;
              }
              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan);
          }

          interface ISwapRouter02V42 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }
              function exactInputSingle(
                  ExactInputSingleParams calldata params
              ) external payable returns (uint256 amountOut);
          }

          contract RusteeStonkbrokerV3Adapter is IStockTokenVenueAdapterV42 {
              address public immutable weth;
              address public immutable stonk;
              address public immutable router;
              uint24 public immutable fee;

              constructor(address w,address s,address r,uint24 f) {
                  require(w!=address(0) && s!=address(0) && r!=address(0));
                  weth=w; stonk=s; router=r; fee=f;
              }

              function buildTrade(
                  address tradingAccount,
                  TradeRequest calldata request
              ) external view returns (TradePlan memory plan) {
                  require(request.tokenIn==weth,"tokenIn");
                  require(request.tokenOut==stonk,"tokenOut");
                  require(request.amountIn>0,"amountIn");
                  require(request.minAmountOut>0,"minOut");
                  require(request.deadline>=block.timestamp,"deadline");

                  bytes memory callData=abi.encodeCall(
                      ISwapRouter02V42.exactInputSingle,
                      (
                          ISwapRouter02V42.ExactInputSingleParams({
                              tokenIn:weth,
                              tokenOut:stonk,
                              fee:fee,
                              recipient:tradingAccount,
                              amountIn:request.amountIn,
                              amountOutMinimum:request.minAmountOut,
                              sqrtPriceLimitX96:0
                          })
                      )
                  );

                  return TradePlan({
                      venue:router,
                      spender:router,
                      tokenIn:weth,
                      tokenOut:stonk,
                      amountIn:request.amountIn,
                      minAmountOut:request.minAmountOut,
                      recipient:tradingAccount,
                      callData:callData
                  });
              }
          }
          EOF

          # Foundry installs and manages the Solidity compiler internally.
          # Do not assume a standalone `solc` executable is on PATH.
          mkdir -p candidate/out

          forge inspect \
            candidate/RusteeStonkbrokerV3Adapter.sol:RusteeStonkbrokerV3Adapter \
            bytecode \
            > candidate/out/RusteeStonkbrokerV3Adapter.bin

          forge inspect \
            candidate/RusteeStonkbrokerV3Adapter.sol:RusteeStonkbrokerV3Adapter \
            deployedBytecode \
            > candidate/out/RusteeStonkbrokerV3Adapter.bin-runtime

          test -s candidate/out/RusteeStonkbrokerV3Adapter.bin
          test -s candidate/out/RusteeStonkbrokerV3Adapter.bin-runtime

          sha256sum candidate/RusteeStonkbrokerV3Adapter.sol > data/adapter-source.sha256
          sha256sum candidate/out/RusteeStonkbrokerV3Adapter.bin > data/adapter-initcode.sha256
          sha256sum candidate/out/RusteeStonkbrokerV3Adapter.bin-runtime > data/adapter-runtime.sha256

      - name: Build exact transaction-plan template
        shell: bash
        env:
          WETH_USD_FEED_ADDRESS: ${{ vars.WETH_USD_FEED_ADDRESS }}
          STONKBROKER_USD_FEED_ADDRESS: ${{ vars.STONKBROKER_USD_FEED_ADDRESS }}
          SEQUENCER_FEED_ADDRESS: ${{ vars.SEQUENCER_FEED_ADDRESS }}
          PRODUCTION_ADAPTER_ADDRESS: ${{ vars.PRODUCTION_ADAPTER_ADDRESS }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, hashlib, datetime
          from pathlib import Path

          state=json.load(open("data/current-state.json"))
          happy=json.load(open("data/v42-happy.json"))

          def valid_addr(x):
              return bool(x and re.fullmatch(r"0x[0-9a-fA-F]{40}",x))

          def digest(path):
              return Path(path).read_text().split()[0]

          inp=state["productionInputs"]
          all_prod_inputs=all(valid_addr(v) for v in inp.values())

          tx_plan=[
            {
              "order":1,
              "kind":"DEPLOY_CONTRACT",
              "name":"RusteeStonkbrokerV3Adapter",
              "constructor":[
                "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73",
                "0xe934e36A439C94017B64a3FecE66AF12099aBF50",
                "0xCaf681a66D020601342297493863E78C959E5cb2",
                10000
              ],
              "broadcastAllowed":False
            },
            {
              "order":2,
              "to":"0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199",
              "function":"setAsset(address,bytes32,bool,address,uint32)",
              "meaning":"Configure WETH valuation oracle; heartbeat intentionally unresolved until production feed cadence is reviewed.",
              "ready":valid_addr(inp["wethUsdFeed"]),
              "broadcastAllowed":False
            },
            {
              "order":3,
              "to":"0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199",
