name: Rustee v4.9.4 Verifier + Policy Fork Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v494-pages
  cancel-in-progress: true

env:
  CHAIN_ID: "4663"
  ETH_USD_FEED_ID: "0x000362205e10b3a147d02792eccee483dca6c7b44ecce7012cb8c6e0b68b3ae9"
  VERIFIER_PROXY: "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate public verifier inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY'
          import json, os, urllib.request, datetime
          rpc_url=os.environ["ARCHIVE_RPC_URL"]
          proxy=os.environ["VERIFIER_PROXY"]
          feed=os.environ["ETH_USD_FEED_ID"]

          def rpc(method, params):
              payload=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(rpc_url,data=payload,headers={"content-type":"application/json","user-agent":"Rustee-v4.9.4"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read())
              if "error" in j: raise RuntimeError(j["error"])
              return j["result"]

          chain=int(rpc("eth_chainId",[]),16)
          proxy_code=rpc("eth_getCode",[proxy,"latest"])

          report={
            "project":"Rustee Broker Verifier + Policy Fork Gate v4.9.4",
            "network":"Robinhood Chain Mainnet + Fork",
            "mode":"READ_ONLY_AND_FORK_ONLY_NO_MAINNET_WRITES",
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "chainId":chain,
            "ethUsdFeedId":feed,
            "feedIdBytes32Shape":feed.startswith("0x") and len(feed)==66,
            "verifierProxy":proxy,
            "verifierProxyHasCode":len(proxy_code)>2,
            "archiveRpcConfigured":bool(rpc_url),
            "signedReportReplay":{
              "attempted":False,
              "verified":False,
              "status":"AUTHENTICATED_REPORT_NOT_YET_SUPPLIED"
            },
            "policyHarness":{
              "maxTradeUsd18":"5000000000000000000",
              "maxReportAgeSeconds":120,
              "tests":["fresh verified <= $5 passes","over $5 rejects","unverified rejects","stale rejects","wrong feed rejects"]
            },
            "executionGate":{
              "mainnetDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False
            }
          }
          assert chain == 4663
          assert report["feedIdBytes32Shape"]
          assert report["verifierProxyHasCode"]
          open("data/v4.9.4-report.json","w").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
        env:
          ARCHIVE_RPC_URL: ${{ secrets.ARCHIVE_RPC_URL }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fork-test Registry V2 and Data Streams policy harness
        run: |
          forge test --match-path test/RegistryV2Fork.t.sol --fork-url "${{ secrets.ARCHIVE_RPC_URL }}" -vv
          forge test --match-path test/DataStreamsPolicyGateV2.t.sol --fork-url "${{ secrets.ARCHIVE_RPC_URL }}" -vv

      - name: Verify no broadcast primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -- 'startBroadcast|broadcast\(|eth_sendRawTransaction|eth_sendTransaction' src test 2>/dev/null; then
            echo "ERROR: broadcast/write primitive detected"
            exit 1
          fi
          echo "PASS: no broadcast primitives found in src/ or test/"

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
