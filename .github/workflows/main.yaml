name: Rustee STONKBROKER Fork Trade Gate v4.0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v402
  cancel-in-progress: true

jobs:
  fork-gate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify STONKBROKER pool and route contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="https://rpc.mainnet.chain.robinhood.com"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"
          QUOTER="0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"

          for A in "$STONK" "$WETH" "$POOL" "$ROUTER" "$QUOTER"; do
            test "$(cast code "$A" --rpc-url "$RPC")" != "0x"
          done

          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          FEE="$(cast call "$POOL" 'fee()(uint24)' --rpc-url "$RPC" | awk '{print $1}')"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"

          python3 - "$TOKEN0" "$TOKEN1" "$FEE" "$LIQ" <<'PY'
          import json,sys
          from pathlib import Path

          stonk="0xe934e36a439c94017b64a3fece66af12099abf50"
          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"
          token0=sys.argv[1].lower()
          token1=sys.argv[2].lower()
          fee=int(sys.argv[3])
          liq=int(sys.argv[4])

          ok={token0,token1}=={stonk,weth}
          p={
            "token0":token0,
            "token1":token1,
            "fee":fee,
            "liquidity":str(liq),
            "pairMatchesCanonicalTokens":ok,
            "liquidityNonZero":liq>0
          }
          Path("data/pool-check.json").write_text(json.dumps(p,indent=2))
          assert ok, "pool token mismatch"
          assert liq>0, "zero active liquidity"
          PY

      - name: Generate isolated Foundry fork test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src test script out cache
          rm -f foundry.toml
          mkdir -p src test data

          FEE="$(python3 -c 'import json;print(json.load(open("data/pool-check.json"))["fee"])')"

          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.26"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "./data" }]
          EOF

          cat > src/Placeholder.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;
          contract Placeholder {}
          EOF

          cat > test/RusteeStonkbrokerFork.t.sol <<EOF
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.26;

          interface Vm {
              function deal(address,uint256) external;
              function startPrank(address) external;
              function stopPrank() external;
              function writeFile(string calldata,string calldata) external;
              function toString(uint256) external pure returns (string memory);
          }

          interface IERC20 {
              function balanceOf(address) external view returns (uint256);
              function approve(address,uint256) external returns (bool);
              function allowance(address,address) external view returns (uint256);
          }

          interface IWETH is IERC20 {
              function deposit() external payable;
          }

          interface IQuoterV2 {
              struct QuoteExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint256 amountIn;
                  uint24 fee;
                  uint160 sqrtPriceLimitX96;
              }
              function quoteExactInputSingle(
                  QuoteExactInputSingleParams memory
              ) external returns (uint256,uint160,uint32,uint256);
          }

          interface ISwapRouter02 {
              struct ExactInputSingleParams {
                  address tokenIn;
                  address tokenOut;
                  uint24 fee;
                  address recipient;
                  uint256 amountIn;
                  uint256 amountOutMinimum;
                  uint160 sqrtPriceLimitX96;
              }
              function exactInputSingle(
                  ExactInputSingleParams calldata
              ) external payable returns (uint256);
          }

          contract RusteeStonkbrokerForkTest {
              Vm constant vm=Vm(address(uint160(uint256(keccak256("hevm cheat code")))));

              address constant TBA=address(bytes20(hex"522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"));
              address constant WETH=address(bytes20(hex"0bd7d308f8e1639fab988df18a8011f41eacad73"));
              address constant STONK=address(bytes20(hex"e934e36a439c94017b64a3fece66af12099abf50"));
              address constant ROUTER=address(bytes20(hex"caf681a66d020601342297493863e78c959e5cb2"));
              address constant QUOTER=address(bytes20(hex"33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7"));
              uint24 constant FEE=uint24($FEE);

              function testTinyStonkbrokerRouteOnFork() public {
                  uint256 amountIn=0.00025 ether;

                  (uint256 quotedOut,,,) =
                      IQuoterV2(QUOTER).quoteExactInputSingle(
                          IQuoterV2.QuoteExactInputSingleParams({
                              tokenIn:WETH,
                              tokenOut:STONK,
                              amountIn:amountIn,
                              fee:FEE,
                              sqrtPriceLimitX96:0
                          })
                      );

                  require(quotedOut>0,"zero quote");
                  uint256 minOut=quotedOut*97/100;

                  vm.deal(TBA,amountIn+0.01 ether);
                  vm.startPrank(TBA);
                  IWETH(WETH).deposit{value:amountIn}();

                  uint256 beforeBal=IERC20(STONK).balanceOf(TBA);
                  require(IERC20(WETH).approve(ROUTER,amountIn),"approve");

                  uint256 received=
                      ISwapRouter02(ROUTER).exactInputSingle(
                          ISwapRouter02.ExactInputSingleParams({
                              tokenIn:WETH,
                              tokenOut:STONK,
                              fee:FEE,
                              recipient:TBA,
                              amountIn:amountIn,
                              amountOutMinimum:minOut,
                              sqrtPriceLimitX96:0
                          })
                      );

                  require(IERC20(WETH).approve(ROUTER,0),"clear");
                  uint256 afterBal=IERC20(STONK).balanceOf(TBA);
                  uint256 allowanceAfter=IERC20(WETH).allowance(TBA,ROUTER);
                  vm.stopPrank();

                  require(received>=minOut,"slippage");
                  require(afterBal>beforeBal,"no token");
                  require(allowanceAfter==0,"allowance");

                  string memory r=string.concat(
                      "{",
                      '"ok":true,',
                      '"forkOnly":true,',
                      '"feeTier":',vm.toString(uint256(FEE)),",",
                      '"amountInWei":"',vm.toString(amountIn),'",',
                      '"quotedOutWei":"',vm.toString(quotedOut),'",',
                      '"receivedOutWei":"',vm.toString(received),'",',
                      '"allowanceAfterWei":"',vm.toString(allowanceAfter),'"',
                      "}"
                  );
                  vm.writeFile("data/stonkbroker-fork-trade.json",r);
              }
          }
          EOF

      - name: Compile generated fork test
        shell: bash
        run: |
          set -euo pipefail
          forge build

      - name: Run fork trade
        shell: bash
        run: |
          set -euo pipefail
          forge test             --fork-url https://rpc.mainnet.chain.robinhood.com             --match-test testTinyStonkbrokerRouteOnFork             -vv

      - name: Build v4.0.2 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,datetime
          from pathlib import Path

          pool=json.load(open("data/pool-check.json"))
          trade=json.load(open("data/stonkbroker-fork-trade.json"))

          p={
            "project":"Rustee STONKBROKER Fork Trade Gate v4.0.2",
            "network":"Robinhood Chain Mainnet Fork",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"FORK_ONLY_NO_MAINNET_WRITES",
            "canonicalToken":{
              "symbol":"STONKBROKER",
              "address":"0xe934e36A439C94017B64a3FecE66AF12099aBF50",
              "decimals":18
            },
            "weth":"0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73",
            "candidatePool":{
              "address":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
              **pool
            },
            "routeProof":trade,
            "executionGate":{
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":"STONKBROKER DEX ROUTE PASSED ON FORK; LIVE TBA POLICY PATH STILL MUST BE PROVEN"
            }
          }

          Path("data/stonkbroker-v402.json").write_text(json.dumps(p,indent=2))
          Path("stonkbroker-v402.json").write_text(json.dumps(p,indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
