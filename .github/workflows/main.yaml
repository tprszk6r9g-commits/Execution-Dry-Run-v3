name: Rustee Broker v3.4.1 · refresh snapshots + verify + deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Same-origin fallback refresh for mobile/Rabby browsers.
    # Direct Robinhood quotes are still attempted by the app first.
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Robinhood stock-token snapshots
        run: python scripts/update_robinhood_snapshots.py

      - name: Build Rustee history snapshot
        run: python scripts/update_rustee_history.py

      - name: Regenerate frontend integrity manifest
        run: python scripts/update_integrity.py

      - name: Verify AIO metadata payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, pathlib, re
          html = pathlib.Path("index.html").read_text()
          m = re.search(r'id="AIO_TOKEN_URI" type="text/plain">(.*?)</script>', html, re.S)
          assert m, "AIO_TOKEN_URI block missing"
          embedded = m.group(1)
          source = pathlib.Path("assets/tokenURI_utf8.txt").read_text().rstrip("\r\n")
          assert embedded.rstrip("\r\n") == source, "embedded tokenURI differs from source asset"
          assert "0x4523467C4DDC6D775C7EaD4Dce7656DCe54e7F60" in html
          assert "AIO_SEL_SET_TOKEN_URI='e0df5b6f'" in html
          assert "AIO_SEL_METADATA_FROZEN='fb3cc6c2'" in html
          assert "AIO_SEL_FREEZE='d111515d'" in html
          assert "SEL_OWNER_OF='6352211e'" in html, "ownerOf selector missing"
          assert "Metadata Studio" in html
          assert re.search(r"const\s+OWNER\s*=\s*[\'\"]0x", html) is None, "static owner wallet constant returned to dashboard"
          meta = json.loads(embedded.split(",", 1)[1])
          image = meta["image"]
          raw = base64.b64decode(image.split("base64,", 1)[1])
          assert len(raw) > 1000, "embedded image unexpectedly small"
          print(f"AIO metadata PASS: {len(embedded):,} chars; image {len(raw):,} bytes")
          PY

      - name: Static secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -rniE "(private[_-]?key|mnemonic|secret)[\"' ]*[:=][\"' ]*[^\"' ]" \
             index.html tools/ scripts/ src/ 2>/dev/null; then
            echo "Possible key material detected"
            exit 1
          fi
          echo "No key material detected"


      - name: Verify snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assets = json.loads(Path("data/robinhood-assets.json").read_text())
          prices = json.loads(Path("data/robinhood-prices.json").read_text())
          history = json.loads(Path("data/rustee-history.json").read_text())
          integrity = json.loads(Path("data/integrity.json").read_text())

          assert assets.get("chainId") == 4663
          assert len(assets.get("assets", [])) > 0
          assert prices.get("chainId") == 4663
          assert len(prices.get("quotesBySymbol", {})) > 0
          assert history.get("chainId") == 4663
          assert history.get("generatedAt")
          assert len(history.get("byAddress", {})) > 0
          assert integrity.get("generatedAt")
          assert set(integrity.get("sha256", {})) == {
              "index.html",
              "manifest.webmanifest",
              "sw.js",
              "data/robinhood-assets.json",
              "data/robinhood-prices.json",
              "data/rustee-history.json",
          }

          print("Assets:", len(assets["assets"]))
          print("Quotes:", len(prices["quotesBySymbol"]))
          print("History addresses:", len(history["byAddress"]))
          print("Generated:", prices.get("generatedAt"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
