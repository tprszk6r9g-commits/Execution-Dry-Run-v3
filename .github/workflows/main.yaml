name: Rustee v4.9.3.1 Data Streams + Registry V2 Fork Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v493-pages
  cancel-in-progress: true

env:
  CHAIN_ID: "4663"
  ETH_USD_FEED_ID: "0x000362205e10b3a147d02792eccee483dca6c7b44ecce7012cb8c6e0b68b3ae9"
  VERIFIER_PROXY: "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate public production inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY'
          import json, os, urllib.request, datetime
          RPC=os.environ.get("ARCHIVE_RPC_URL") or "https://rpc.mainnet.chain.robinhood.com"
          feed=os.environ["ETH_USD_FEED_ID"]
          proxy=os.environ["VERIFIER_PROXY"]

          def rpc(method, params):
              req=urllib.request.Request(RPC,data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),headers={"content-type":"application/json","user-agent":"Rustee-v4.9.3"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read())
              if "error" in j: raise RuntimeError(j["error"])
              return j["result"]

          chain=int(rpc("eth_chainId",[]),16)
          code=rpc("eth_getCode",[proxy,"latest"])
          report={
            "project":"Rustee Broker v4.9.3",
            "mode":"READ_FORK_ONLY_NO_MAINNET_WRITES",
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "chainId":chain,
            "feedId":feed,
            "feedIdValidBytes32":feed.startswith("0x") and len(feed)==66,
            "verifierProxy":proxy,
            "verifierProxyHasCode":len(code)>2,
            "archiveRpcConfigured":bool(os.environ.get("ARCHIVE_RPC_URL")),
            "signedReportReplay":{
              "attempted":False,
              "verified":False,
              "reason":"Requires authenticated Chainlink Data Streams report retrieval; no credentials are embedded in this repository."
            },
            "registryV2":{"forkTestsScheduled":True,"productionDeploymentAllowed":False},
            "executionGate":{
              "mainnetWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetBroadcastAllowed":False
            }
          }
          assert chain==4663
          assert report["feedIdValidBytes32"]
          assert report["verifierProxyHasCode"]
          open("data/v4.9.3-report.json","w").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
        env:
          ARCHIVE_RPC_URL: ${{ secrets.ARCHIVE_RPC_URL }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fork-test Registry V2 prototype
        run: forge test --fork-url "${{ secrets.ARCHIVE_RPC_URL }}" -vv

      - name: Verify no broadcast primitives
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E -- 'startBroadcast|broadcast\(|eth_sendRawTransaction|eth_sendTransaction' src test .github/workflows/main.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
