name: Rustee Mainnet Readiness v3.10

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v310-pages
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build read-only mainnet readiness report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import json
          import urllib.request
          import subprocess
          import datetime
          from pathlib import Path

          RPC = "https://rpc.mainnet.chain.robinhood.com"
          ASSETS_URL = "https://api.robinhood.com/rhj/assets"
          PRICE_URL = "https://api.robinhood.com/rhj/prices/NVDA"

          CHAIN_ID = 4663
          OWNER = "0x8fC320c8582f812695b6f62b2b5d13B14475B955"
          NFT = "0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY = "0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA = "0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          WETH = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          NVDA = "0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"
          ROUTER = "0xCaf681a66D020601342297493863E78C959E5cb2"

          def rpc(method, params):
              req = urllib.request.Request(
                  RPC,
                  data=json.dumps({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": method,
                      "params": params
                  }).encode(),
                  headers={
                      "content-type": "application/json",
                      "user-agent": "Rustee-v3.10-readiness"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  j = json.loads(r.read().decode())
              if "error" in j:
                  raise RuntimeError(j["error"])
              return j["result"]

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Rustee-v3.10-readiness"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def sig(signature):
              return subprocess.check_output(
                  ["cast", "sig", signature],
                  text=True
              ).strip()

          def word_chunks(hexdata):
              h = hexdata[2:] if hexdata.startswith("0x") else hexdata
              return [h[i:i+64] for i in range(0, len(h), 64) if h[i:i+64]]

          def decode_address_word(word):
              return "0x" + word[-40:]

          def bool_call(to, signature, address_arg):
              selector = sig(signature)
              data = selector + address_arg.lower().replace("0x", "").rjust(64, "0")
              raw = rpc("eth_call", [{"to": to, "data": data}, "latest"])
              return int(raw, 16) != 0

          # Chain + bytecode
          actual_chain = int(rpc("eth_chainId", []), 16)
          code_targets = {
              "registry": REGISTRY,
              "tradingTba": TBA,
              "weth": WETH,
              "nvda": NVDA,
              "router": ROUTER,
          }
          code_checks = {}
          for name, address in code_targets.items():
              code = rpc("eth_getCode", [address, "latest"])
              code_checks[name] = {
                  "address": address,
                  "codeBytes": max(0, (len(code) - 2) // 2),
                  "hasCode": len(code) > 2,
              }

          # ERC-6551 / TBA binding using selectors previously recovered.
          owner_raw = rpc(
              "eth_call",
              [{"to": TBA, "data": "0x8da5cb5b"}, "latest"]
          )
          registry_raw = rpc(
              "eth_call",
              [{"to": TBA, "data": "0x7b103999"}, "latest"]
          )
          token_raw = rpc(
              "eth_call",
              [{"to": TBA, "data": "0xfc0c546a"}, "latest"]
          )

          owner_actual = decode_address_word(word_chunks(owner_raw)[0])
          registry_actual = decode_address_word(word_chunks(registry_raw)[0])
          tw = word_chunks(token_raw)
          token_chain = int(tw[0], 16)
          token_contract = decode_address_word(tw[1])
          token_id = int(tw[2], 16)

          binding_pass = (
              actual_chain == CHAIN_ID
              and owner_actual.lower() == OWNER.lower()
              and registry_actual.lower() == REGISTRY.lower()
              and token_chain == CHAIN_ID
              and token_contract.lower() == NFT.lower()
              and token_id == 1
          )

          # Current trading policy, decoded as 4 ABI words.
          policy_selector = sig("getTradingPolicy()")
          policy_raw = rpc(
              "eth_call",
              [{"to": REGISTRY, "data": policy_selector}, "latest"]
          )
          pw = word_chunks(policy_raw)
          if len(pw) < 4:
              raise RuntimeError(
                  f"Unexpected getTradingPolicy return: {policy_raw}"
              )

          current_policy = {
              "maxTradeUsd18": str(int(pw[0], 16)),
              "maxDailyUsd18": str(int(pw[1], 16)),
              "maxTradesPerDay": int(pw[2], 16),
              "paused": bool(int(pw[3], 16)),
          }

          venue_allowed = bool_call(
              REGISTRY,
              "allowedVenue(address)",
              ROUTER
          )
          spender_allowed = bool_call(
              REGISTRY,
              "allowedSpender(address)",
              ROUTER
          )

          # Canonical Robinhood NVDA status.
          assets_json = get_json(ASSETS_URL)
          prices_json = get_json(PRICE_URL)
          assets = assets_json.get("assets", [])
          quotes = prices_json.get("quotes", [])

          asset = next(
              x for x in assets
              if str(x.get("tokenSymbol", "")).upper() == "NVDA"
          )
          quote = next(
              x for x in quotes
              if str(x.get("tokenSymbol", "")).upper() == "NVDA"
          )
          deployment = next(
              d for d in asset["deployments"]
              if int(d["chainId"]) == CHAIN_ID
          )

          canonical_nvda = (
              deployment["contractAddress"].lower() == NVDA.lower()
          )
          nvda_active = asset.get("status") == "ASSET_STATUS_ACTIVE"
          nvda_not_halted = quote.get("isTradingHalt") is False

          desired_policy = {
              "maxTradeUsd18": str(5 * 10**18),
              "maxDailyUsd18": str(10 * 10**18),
              "maxTradesPerDay": 1,
              "paused": False,
          }

          blockers = []
          if not binding_pass:
              blockers.append("TBA binding mismatch")
          if not all(x["hasCode"] for x in code_checks.values()):
              blockers.append("One or more canonical contracts have no bytecode")
          if not canonical_nvda:
              blockers.append("Canonical NVDA address mismatch")
          if not nvda_active:
              blockers.append("NVDA is not active")
          if not nvda_not_halted:
              blockers.append("NVDA is trading-halted")

          # These are intentionally unresolved until production addresses are
          # selected and independently verified.
          blockers += [
              "Production WETH/USD price feed not selected",
              "Production NVDA/USD price feed not selected",
              "Production sequencer-uptime feed decision not finalized",
              "Production StockTokenVenueAdapter not deployed/verified",
          ]

          report = {
              "project": "Rustee Broker Mainnet Readiness v3.10",
              "network": "Robinhood Chain Mainnet",
              "chainId": CHAIN_ID,
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mode": "READ_ONLY",
              "addresses": {
                  "owner": OWNER,
                  "brokerNft": NFT,
                  "stockTokenRegistry": REGISTRY,
                  "tradingTba": TBA,
                  "weth": WETH,
                  "nvda": NVDA,
                  "router": ROUTER,
              },
              "binding": {
                  "pass": binding_pass,
                  "owner": owner_actual,
                  "registry": registry_actual,
                  "token": {
                      "chainId": token_chain,
                      "tokenContract": token_contract,
                      "tokenId": token_id,
                  },
              },
              "bytecode": code_checks,
              "robinhoodNvda": {
                  "canonicalAddressPass": canonical_nvda,
                  "active": nvda_active,
                  "notHalted": nvda_not_halted,
                  "bid": quote.get("bid"),
                  "ask": quote.get("ask"),
              },
              "currentMainnetState": {
                  "policy": current_policy,
                  "routerVenueAllowed": venue_allowed,
                  "routerSpenderAllowed": spender_allowed,
              },
              "successfulForkProof": {
                  "version": "v3.9",
                  "selector": "0x6c606ce7",
                  "exactAbi":
                      "executeTrade(address,(address,address,uint256,uint256,uint256,bytes))",
                  "guardedExecuteTradeSucceeded": True,
                  "approvalClearedAfterTrade": True,
                  "feeTier": 500,
                  "quotedWethInWei": "2354570379252831",
                  "maxWethInWei": "2366343231149096",
                  "wethActuallySpentWei": "2354570379252831",
                  "targetNvdaWei": "20454545454545456",
                  "nvdaReceivedWei": "20454545454545456",
              },
              "desiredPolicy": desired_policy,
              "productionConfiguration": {
                  "wethUsdFeed": None,
                  "nvdaUsdFeed": None,
                  "sequencerUptimeFeed": None,
                  "sequencerGracePeriodSeconds": 3600,
                  "stockTokenVenueAdapter": None,
                  "venue": ROUTER,
                  "spender": ROUTER,
                  "wethHeartbeatSeconds": None,
                  "nvdaHeartbeatSeconds": None,
              },
              "blockers": blockers,
              "executionGate": {
                  "mainnetAssetFundingAllowed": False,
                  "mainnetApprovalAllowed": False,
                  "mainnetRegistryWritesAllowed": False,
                  "mainnetUnpauseAllowed": False,
                  "mainnetBroadcastAllowed": False,
                  "verdict":
                      "READ-ONLY MAINNET BINDING VERIFIED; PRODUCTION ORACLE/ADAPTER CONFIGURATION STILL REQUIRED",
              },
          }

          Path("data/mainnet-readiness-v310.json").write_text(
              json.dumps(report, indent=2)
          )
          Path("mainnet-readiness-v310.json").write_text(
              json.dumps(report, indent=2)
          )

          print("PASS: chain", actual_chain)
          print("PASS: binding", binding_pass)
          print("PASS: current policy", current_policy)
          print("PASS: canonical NVDA", canonical_nvda)
          print("PASS: live writes remain disabled")
          PY

      - name: Validate readiness report
        shell: bash
        run: |
          set -euo pipefail
          test -s data/mainnet-readiness-v310.json
          test -s mainnet-readiness-v310.json

          python3 <<'PY'
          import json

          p = json.load(open("data/mainnet-readiness-v310.json"))

          assert p["chainId"] == 4663
          assert p["mode"] == "READ_ONLY"
          assert p["binding"]["pass"] is True
          assert p["robinhoodNvda"]["canonicalAddressPass"] is True
          assert p["successfulForkProof"]["guardedExecuteTradeSucceeded"] is True
          assert p["successfulForkProof"]["approvalClearedAfterTrade"] is True
          assert p["executionGate"]["mainnetBroadcastAllowed"] is False
          assert p["executionGate"]["mainnetRegistryWritesAllowed"] is False

          print("PASS: v3.10 readiness report validates")
          PY

      - name: Embed readiness report in site
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          report = json.load(open("data/mainnet-readiness-v310.json"))
          html_path = Path("index.html")
          html = html_path.read_text()

          embedded = json.dumps(report, separators=(",", ":")).replace(
              "</",
              "<\\/"
          )

          script = f"""
          <script id="v310-report" type="application/json">{embedded}</script>
          <script>
          (() => {{
            const raw = document.getElementById('v310-report');
            const out = document.getElementById('report');
            if (!raw || !out) return;
            try {{
              out.textContent = JSON.stringify(
                JSON.parse(raw.textContent), null, 2
              );
            }} catch (e) {{
              out.textContent = 'ERROR: ' + e.message;
            }}
          }})();
          </script>
          """

          if "</body>" not in html:
              raise RuntimeError("index.html missing </body>")

          html_path.write_text(
              html.replace("</body>", script + "</body>")
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
