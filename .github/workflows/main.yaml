name: Deploy Rustee Broker Portfolio Executor v1.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.5 Account Center
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Portfolio Executor v1.5" index.html
          grep -q "Rustee Account Center" index.html
          grep -q "Universal Asset Mover" index.html
          grep -q "withdrawTokenCalldata" index.html
          grep -q "genericExecuteCalldata" index.html
          grep -q "REWARDS='0xfd0d881d73ec1476f5da0ab78283149ea21c3b32'" index.html
          grep -q "IDENTITY='0x496d7d47ae69d65d714413f0dc78c712ed92158d'" index.html
          echo "PASS: v1.5 five-account portfolio + transfer center detected"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
