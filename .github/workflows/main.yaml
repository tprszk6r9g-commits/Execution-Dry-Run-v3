name: Deploy Rustee Portfolio Terminal v2.1 Phase 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-portfolio-terminal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 2 terminal
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Portfolio Terminal v2.1" index.html
          grep -q "History + P&amp;L" index.html
          grep -q "blockscoutTokenTransfers" index.html
          grep -q "COST_BASIS_KEY" index.html
          grep -q "Universal Asset Mover" index.html
          grep -q "withdrawTokenCalldata" index.html
          echo "PASS: Rustee Portfolio Terminal v2.1 Phase 2"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
