name: Rustee STONKBROKER TWAP Math Correction v4.5.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v452
  cancel-in-progress: true

jobs:
  twap-analysis:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read canonical pool state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          RPC="https://rpc.mainnet.chain.robinhood.com"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"

          TOKEN0="$(cast call "$POOL" 'token0()(address)' --rpc-url "$RPC")"
          TOKEN1="$(cast call "$POOL" 'token1()(address)' --rpc-url "$RPC")"
          FEE="$(cast call "$POOL" 'fee()(uint24)' --rpc-url "$RPC" | awk '{print $1}')"
          LIQ="$(cast call "$POOL" 'liquidity()(uint128)' --rpc-url "$RPC" | awk '{print $1}')"
          DEC0="$(cast call "$TOKEN0" 'decimals()(uint8)' --rpc-url "$RPC" | awk '{print $1}')"
          DEC1="$(cast call "$TOKEN1" 'decimals()(uint8)' --rpc-url "$RPC" | awk '{print $1}')"

          printf '%s\n' "$TOKEN0" > data/token0.txt
          printf '%s\n' "$TOKEN1" > data/token1.txt
          printf '%s\n' "$FEE" > data/fee.txt
          printf '%s\n' "$LIQ" > data/liquidity.txt
          printf '%s\n' "$DEC0" > data/dec0.txt
          printf '%s\n' "$DEC1" > data/dec1.txt

          python3 <<'PY'
          from pathlib import Path
          import json

          token0=Path("data/token0.txt").read_text().strip().lower()
          token1=Path("data/token1.txt").read_text().strip().lower()
          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"
          stonk="0xe934e36a439c94017b64a3fece66af12099abf50"

          assert {token0, token1} == {weth, stonk}
          liquidity=int(Path("data/liquidity.txt").read_text().strip())
          assert liquidity > 0

          Path("data/pool-binding.json").write_text(json.dumps({
            "pool":"0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594",
            "token0":token0,
            "token1":token1,
            "token0Decimals":int(Path("data/dec0.txt").read_text().strip()),
            "token1Decimals":int(Path("data/dec1.txt").read_text().strip()),
            "fee":int(Path("data/fee.txt").read_text().strip()),
            "liquidity":str(liquidity),
            "pairMatches":True,
            "liquidityNonZero":True
          },indent=2))
          PY

      - name: Read and ABI-decode observe results safely
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json, urllib.request
          from pathlib import Path

          RPC="https://rpc.mainnet.chain.robinhood.com"
          POOL="0x9cd74d5980a4bf60408b9ba2b0f6a3d368ebf594"
          # keccak256("observe(uint32[])")[:4]
          SELECTOR="0x883bdbfd"

          def word(n):
              return int(n).to_bytes(32, "big").hex()

          def rpc(method, params):
              body=json.dumps({
                  "jsonrpc":"2.0","id":1,"method":method,"params":params
              }).encode()
              req=urllib.request.Request(
                  RPC,
                  data=body,
                  headers={"content-type":"application/json",
                           "user-agent":"Rustee-v4.5.2"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  out=json.loads(r.read().decode())
              if "error" in out:
                  raise RuntimeError(out["error"])
              return out["result"]

          def calldata(window):
              # ABI encode uint32[] [window, 0]:
              # head offset 0x20, then len=2, then two 32-byte elements.
              return SELECTOR + word(32) + word(2) + word(window) + word(0)

          def u256(buf, off):
              return int.from_bytes(buf[off:off+32], "big")

          def signed_from_word(buf, off, bits):
              raw=u256(buf, off)
              mask=(1 << bits)-1
              v=raw & mask
              if v & (1 << (bits-1)):
                  v -= (1 << bits)
              return v

          def decode_observe(hexdata):
              b=bytes.fromhex(hexdata[2:])
              if len(b) < 64:
                  raise RuntimeError("observe return too short")
              off_ticks=u256(b,0)
              off_spl=u256(b,32)

              n_ticks=u256(b,off_ticks)
              ticks=[
                  signed_from_word(b, off_ticks+32+32*i, 56)
                  for i in range(n_ticks)
              ]

              n_spl=u256(b,off_spl)
              spl=[
                  u256(b, off_spl+32+32*i) & ((1<<160)-1)
                  for i in range(n_spl)
              ]

              if len(ticks) != 2 or len(spl) != 2:
                  raise RuntimeError(
                      f"Unexpected observe lengths: {len(ticks)}, {len(spl)}"
                  )
              return ticks, spl

          results={}
          for w in (300,900,1800,3600):
              raw=rpc("eth_call", [{
                  "to":POOL,
                  "data":calldata(w)
              }, "latest"])
              ticks,spl=decode_observe(raw)
              results[str(w)]={
                  "tickCumulatives":[str(x) for x in ticks],
                  "secondsPerLiquidityCumulativeX128":[str(x) for x in spl]
              }

          Path("data/observe-decoded.json").write_text(
              json.dumps(results, indent=2)
          )
          print("PASS: observe() ABI decoded without cast pretty-print parsing")
          PY

      - name: Analyze corrected 5m 15m 30m 60m TWAP dispersion
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from decimal import Decimal, getcontext, ROUND_FLOOR
          from pathlib import Path
          import json, datetime, math

          getcontext().prec=100

          token0=Path("data/token0.txt").read_text().strip().lower()
          token1=Path("data/token1.txt").read_text().strip().lower()
          dec0=int(Path("data/dec0.txt").read_text().strip())
          dec1=int(Path("data/dec1.txt").read_text().strip())

          weth="0x0bd7d308f8e1639fab988df18a8011f41eacad73"
          stonk="0xe934e36a439c94017b64a3fece66af12099abf50"
          obs=json.load(open("data/observe-decoded.json"))

          MIN_TICK=-887272
          MAX_TICK=887272

          def arithmetic_mean_tick(delta, window):
              # Uniswap OracleLibrary semantics:
              # Solidity signed division truncates toward zero, then if delta
              # is negative and not exactly divisible, decrement to floor.
              q=abs(delta)//window
              q=-q if delta < 0 else q
              if delta < 0 and abs(delta) % window != 0:
                  q -= 1
              return q

          def raw_token1_per_token0(tick):
              # Safe here because tick is range-checked to Uniswap bounds.
              return Decimal("1.0001") ** Decimal(tick)

          rows=[]
          for w in (300,900,1800,3600):
              ticks=[int(x) for x in obs[str(w)]["tickCumulatives"]]
              delta=ticks[1]-ticks[0]
              tick=arithmetic_mean_tick(delta,w)

              if not (MIN_TICK <= tick <= MAX_TICK):
                  raise RuntimeError(
                      f"Mean tick out of Uniswap V3 bounds for {w}s: "
                      f"{tick}; cumulative delta={delta}"
                  )

              raw_ratio=raw_token1_per_token0(tick)
              # Adjust raw-unit ratio to whole-token ratio.
              token1_per_token0 = raw_ratio * (
                  Decimal(10) ** Decimal(dec0-dec1)
              )

              if token0==weth and token1==stonk:
                  weth_per_stonk=Decimal(1)/token1_per_token0
              elif token0==stonk and token1==weth:
                  weth_per_stonk=token1_per_token0
              else:
                  raise RuntimeError("Unexpected token ordering")

              if not weth_per_stonk.is_finite() or weth_per_stonk <= 0:
                  raise RuntimeError("Non-finite or non-positive TWAP price")

              wei18=int(
                  (weth_per_stonk * Decimal(10)**18)
                  .to_integral_value(rounding=ROUND_FLOOR)
              )

              rows.append({
                  "windowSeconds":w,
                  "tickCumulativePast":str(ticks[0]),
                  "tickCumulativeNow":str(ticks[1]),
                  "tickDelta":str(delta),
                  "meanTick":tick,
                  "wethPerStonk":format(weth_per_stonk, ".30g"),
                  "wethPerStonkWei18":str(wei18)
              })

          reference=next(r for r in rows if r["windowSeconds"]==3600)
          ref=Decimal(reference["wethPerStonk"])

          for r in rows:
              p=Decimal(r["wethPerStonk"])
              dev=(p/ref-Decimal(1))*Decimal(10000)
              if not dev.is_finite():
                  raise RuntimeError("Non-finite deviation")
              r["deviationFrom60mBps"]=float(dev)

          vals=[Decimal(r["wethPerStonk"]) for r in rows]
          vmax=max(vals); vmin=min(vals)
          dispersion=(vmax/vmin-Decimal(1))*Decimal(10000)
          if not dispersion.is_finite():
              raise RuntimeError("Non-finite dispersion")
          dispersion_bps=float(dispersion)

          if dispersion_bps <= 50:
              candidate=1800
              reason=(
                  "Corrected 5m-60m TWAP dispersion is <= 50 bps; "
                  "30m is a latency/resistance candidate pending "
                  "historical and adversarial manipulation review."
              )
          elif dispersion_bps <= 150:
              candidate=3600
              reason=(
                  "Corrected TWAP dispersion is 50-150 bps; "
                  "60m is the conservative candidate pending "
                  "historical and adversarial manipulation review."
              )
          else:
              candidate=None
              reason=(
                  "Corrected TWAP dispersion exceeds 150 bps; "
                  "no production TWAP window is nominated from this snapshot."
              )

          analysis={
              "version":"v4.5.2",
              "generatedAt":datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mathCorrection":{
                  "castPrettyPrintParsingRemoved":True,
                  "observeReturnAbiDecodedFromRawEthCall":True,
                  "signedInt56Decode":True,
                  "meanTickDividesTickDeltaByWindow":True,
                  "negativeRoundingMatchesUniswapOracleLibrary":True,
                  "tickBoundsEnforced":[MIN_TICK,MAX_TICK],
                  "nonFiniteOutputRejected":True
              },
              "windows":rows,
              "crossWindowDispersionBps":dispersion_bps,
              "candidateWindowSeconds":candidate,
              "candidateReason":reason,
              "importantCaveat":(
                  "Single-snapshot cross-window dispersion does not prove "
                  "manipulation resistance. Production selection still "
                  "requires historical liquidity/depth and adversarial-cost analysis."
              )
          }

          Path("data/twap-analysis.json").write_text(
              json.dumps(analysis,indent=2,allow_nan=False)
          )
          print(json.dumps(analysis,indent=2,allow_nan=False))
          PY

      - name: Validate corrected TWAP mathematics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, math

          a=json.load(open("data/twap-analysis.json"))
          assert a["version"] == "v4.5.2"
          assert len(a["windows"]) == 4
          assert math.isfinite(a["crossWindowDispersionBps"])

          for r in a["windows"]:
              assert -887272 <= r["meanTick"] <= 887272
              assert int(r["wethPerStonkWei18"]) >= 0
              assert math.isfinite(r["deviationFrom60mBps"])
              expected_delta=(
                  int(r["tickCumulativeNow"])
                  - int(r["tickCumulativePast"])
              )
              assert expected_delta == int(r["tickDelta"])

          print("PASS: corrected TWAP math is bounded and finite")
          PY

      - name: Record authoritative Robinhood and Chainlink evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          evidence={
            "robinhoodChainDocs":{
              "dataStreams":"https://docs.robinhood.com/chain/data-streams/",
              "connecting":"https://docs.robinhood.com/chain/connecting/",
              "contracts":"https://docs.robinhood.com/chain/contracts/"
            },
            "facts":{
              "robinhoodChainUsesChainlinkDataStreams":True,
              "robinhoodVerifierProxy":"0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7",
              "publicRpc":"https://rpc.mainnet.chain.robinhood.com",
              "publicRpcRecommendedForProduction":False,
              "documentedSequencerFeed":"wss://feed.mainnet.chain.robinhood.com",
              "documentedSequencerFeedIsAggregatorV3UptimeFeed":False
            },
            "wethUsdConclusion":{
              "authoritativeAggregatorV3AddressResolvedByThisWorkflow":False,
              "reason":"Robinhood documents Chainlink support/Data Streams, but v4.5.2 does not invent an AggregatorV3 WETH/USD address. Production value must come from an authoritative feed listing or a reviewed signed-report adapter."
            }
          }
          Path("data/authoritative-evidence.json").write_text(json.dumps(evidence,indent=2))
          PY

      - name: Validate optional production WETH USD candidate
        shell: bash
        env:
          WETH_USD_FEED_ADDRESS: ${{ vars.WETH_USD_FEED_ADDRESS }}
          WETH_USD_FEED_PROVENANCE_URL: ${{ vars.WETH_USD_FEED_PROVENANCE_URL }}
          WETH_HEARTBEAT_SECONDS: ${{ vars.WETH_HEARTBEAT_SECONDS }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os,re,json
          from pathlib import Path
          addr=os.getenv("WETH_USD_FEED_ADDRESS") or ""
          prov=os.getenv("WETH_USD_FEED_PROVENANCE_URL") or ""
          hb=os.getenv("WETH_HEARTBEAT_SECONDS") or ""

          p={
            "address":addr or None,
            "addressSyntaxValid":bool(re.fullmatch(r"0x[0-9a-fA-F]{40}",addr)),
            "provenanceUrl":prov or None,
            "provenancePresent":bool(prov),
            "heartbeatSeconds":int(hb) if hb.isdigit() else None,
            "heartbeatValid":hb.isdigit() and int(hb)>0,
            "onchainCodePresent":False,
            "aggregatorV3Readable":False,
            "decimals":None,
            "answer":None,
            "updatedAt":None
          }
          Path("data/weth-feed-candidate.json").write_text(json.dumps(p,indent=2))
          PY

          if [ -n "${WETH_USD_FEED_ADDRESS:-}" ]; then
            CODE="$(cast code "$WETH_USD_FEED_ADDRESS" --rpc-url https://rpc.mainnet.chain.robinhood.com || true)"
            DEC="$(cast call "$WETH_USD_FEED_ADDRESS" 'decimals()(uint8)' --rpc-url https://rpc.mainnet.chain.robinhood.com 2>/dev/null || true)"
            ROUND="$(cast call "$WETH_USD_FEED_ADDRESS" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url https://rpc.mainnet.chain.robinhood.com 2>/dev/null || true)"

            python3 - "$CODE" "$DEC" "$ROUND" <<'PY'
          import json,sys,re
          from pathlib import Path
          p=json.load(open("data/weth-feed-candidate.json"))
          code,dec,round_data=sys.argv[1:]
          p["onchainCodePresent"]=bool(code and code!="0x")
          if dec and round_data:
              nums=[int(x) for x in re.findall(r'-?\d+',round_data)]
              p["aggregatorV3Readable"]=len(nums)>=5
              try: p["decimals"]=int(re.findall(r'\d+',dec)[0])
              except: pass
              if len(nums)>=5:
                  p["answer"]=str(nums[1])
                  p["updatedAt"]=nums[3]
          Path("data/weth-feed-candidate.json").write_text(json.dumps(p,indent=2))
          PY
          fi

      - name: Build v4.5.2 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,datetime
          from pathlib import Path

          pool=json.load(open("data/pool-binding.json"))
          twap=json.load(open("data/twap-analysis.json"))
          auth=json.load(open("data/authoritative-evidence.json"))
          weth=json.load(open("data/weth-feed-candidate.json"))

          blockers=[]
          if not weth["addressSyntaxValid"]:
              blockers.append("Authoritative production WETH/USD oracle address not supplied")
          if not weth["provenancePresent"]:
              blockers.append("Authoritative WETH/USD provenance URL not supplied")
          if not weth["heartbeatValid"]:
              blockers.append("Production WETH/USD heartbeat not finalized")
          if weth["addressSyntaxValid"] and not weth["aggregatorV3Readable"]:
              blockers.append("Supplied WETH/USD candidate is not proven AggregatorV3-readable on Robinhood Chain")
          if twap["candidateWindowSeconds"] is None:
              blockers.append("TWAP snapshot dispersion is too high for a production-window recommendation")
          blockers += [
            "Cross-window snapshot analysis is not a full manipulation-cost study",
            "Historical liquidity/depth sampling is still required",
            "Current Registry expects AggregatorV3-style sequencer uptime semantics but Robinhood documents a websocket sequencer feed, not an AggregatorV3 uptime feed",
            "Candidate STONKBROKER TWAP oracle requires independent security review",
            "No mainnet oracle deployment or Registry configuration has been separately authorized"
          ]

          report={
            "project":"Rustee STONKBROKER Production Oracle Analysis v4.5.2",
            "network":"Robinhood Chain Mainnet",
            "chainId":4663,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"READ_ONLY_NO_MAINNET_WRITES",
            "pool":pool,
            "twapAnalysis":twap,
            "authoritativeEvidence":auth,
            "productionWethUsdCandidate":weth,
            "productionRecommendation":{
              "stonkbrokerValuationArchitecture":"Uniswap V3 STONKBROKER/WETH arithmetic-mean TWAP × trusted WETH/USD",
              "candidateTwapWindowSeconds":twap["candidateWindowSeconds"],
              "status":"CANDIDATE_ONLY_NOT_AUTHORIZED",
              "reason":twap["candidateReason"]
            },
            "remainingBlockers":blockers,
            "executionGate":{
              "mainnetOracleDeploymentAllowed":False,
              "mainnetRegistryWritesAllowed":False,
              "mainnetFundingAllowed":False,
              "mainnetApprovalAllowed":False,
              "mainnetTradeAllowed":False,
              "mainnetUnpauseAllowed":False,
              "mainnetBroadcastAllowed":False,
              "verdict":"V4.5.2 CORRECTED TWAP WINDOW ANALYSIS COMPLETE; PRODUCTION WETH/USD PROVENANCE, HISTORICAL MANIPULATION ANALYSIS, SEQUENCER COMPATIBILITY, AND SECURITY REVIEW STILL REQUIRED"
            }
          }

          Path("data/stonkbroker-v452.json").write_text(json.dumps(report,indent=2))
          Path("stonkbroker-v452.json").write_text(json.dumps(report,indent=2))
          PY

      - name: Validate v4.5.2 report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p=json.load(open("data/stonkbroker-v452.json"))
          assert p["chainId"]==4663
          assert p["pool"]["pairMatches"] is True
          assert p["pool"]["liquidityNonZero"] is True
          assert len(p["twapAnalysis"]["windows"])==4
          assert p["executionGate"]["mainnetBroadcastAllowed"] is False
          print("PASS v4.5")
          PY

      - name: Embed v4.5.2 report into page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, html

          report_path = Path("stonkbroker-v452.json")
          index_path = Path("index.html")

          report = json.loads(report_path.read_text())
          pretty = json.dumps(report, indent=2)

          page = index_path.read_text()

          start = "<!--RUSTEE_REPORT_START-->"
          end = "<!--RUSTEE_REPORT_END-->"

          if start not in page or end not in page:
              raise RuntimeError("Report embed markers missing from index.html")

          before = page.split(start, 1)[0]
          after = page.split(end, 1)[1]

          embedded = (
              start
              + "\n<pre id=\"report\">"
              + html.escape(pretty)
              + "</pre>\n"
              + end
          )

          index_path.write_text(before + embedded + after)

          print("PASS: embedded v4.5.2 report into index.html")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
