name: Rustee Differential ABI Recovery v3.8

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v38-pages
  cancel-in-progress: true

jobs:
  recover-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Differentially recover six-word struct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import json, urllib.request, datetime, time

          RPC="https://rpc.mainnet.chain.robinhood.com"
          CHAIN=4663
          OWNER="0x8fC320c8582f812695b6f62b2b5d13B14475B955"
          OUTSIDER="0x000000000000000000000000000000000000dEaD"
          NFT="0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"
          NVDA="0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          QUOTER="0x33e885eD0Ec9bF04EcfB19341582aADCb4c8A9E7"
          SEL="0x6c606ce7"

          def rpc(method,params):
              req=urllib.request.Request(
                  RPC,
                  data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),
                  headers={"content-type":"application/json","user-agent":"Rustee-v3.8"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read())
              except Exception as e:return {"transportError":str(e)}

          def call(data,frm=OWNER):
              return rpc("eth_call",[{"to":TBA,"from":frm,"data":data},"latest"])

          def w(v):
              if isinstance(v,str) and v.startswith("0x"):
                  return v[2:].lower().rjust(64,"0")
              return hex(int(v))[2:].rjust(64,"0")

          def aw(a): return a.lower().replace("0x","").rjust(64,"0")

          def encode(outer, fields):
              assert len(fields)==6
              return SEL+aw(outer)+w(64)+"".join(w(x) for x in fields)

          def parse(j):
              if "result" in j:
                  return {"success":True,"observation":"return:"+j["result"],"revertSelector":None}
              if "error" in j:
                  e=j["error"];d=e.get("data","")
                  selector=d[:10] if isinstance(d,str) and d.startswith("0x") and len(d)>=10 else None
                  return {"success":False,"observation":"revert:"+str(d)+":"+e.get("message",""),"revertSelector":selector}
              return {"success":False,"observation":"transport:"+j.get("transportError","unknown"),"revertSelector":None}

          # Binding.
          def read_addr(sel):
              p=parse(call(sel))
              if not p["success"]:return None
              return "0x"+p["observation"].split("return:")[1][-40:].lower()

          owner_actual=read_addr("0x8da5cb5b")
          registry_actual=read_addr("0x7b103999")
          tok=parse(call("0xfc0c546a"))
          raw=tok["observation"].split("return:")[1][2:] if tok["success"] else ""
          tw=[raw[i:i+64] for i in range(0,len(raw),64)] if raw else []
          token_chain=int(tw[0],16) if len(tw)>=3 else None
          token_contract=("0x"+tw[1][-40:]).lower() if len(tw)>=3 else None
          token_id=int(tw[2],16) if len(tw)>=3 else None
          binding_pass=owner_actual==OWNER.lower() and registry_actual==REGISTRY.lower() and token_chain==CHAIN and token_contract==NFT.lower() and token_id==1

          zero=[0,0,0,0,0,0]
          baseline=parse(call(encode(OWNER,zero)))
          baseline_sel=baseline["revertSelector"]

          # Values selected to be ABI-safe and useful for differential diagnosis.
          target_nvda=22685818513451888
          quoted_weth=2612246804036778
          max_weth=2625308038056962
          now=int(time.time())

          address_values=[
              ("OWNER",OWNER),("ROUTER",ROUTER),("NVDA",NVDA),
              ("WETH",WETH),("REGISTRY",REGISTRY),("TBA",TBA)
          ]
          numeric_values=[
              ("ONE",1),("FEE_500",500),
              ("TARGET_NVDA",target_nvda),
              ("QUOTED_WETH",quoted_weth),
              ("MAX_WETH",max_weth),
              ("DEADLINE",now+300)
          ]

          singles=[]
          # Address candidates in every field.
          for i in range(6):
              for label,val in address_values:
                  f=zero.copy();f[i]=val
                  p=parse(call(encode(OWNER,f)))
                  singles.append({
                      "name":f"field{i}={label}",
                      "field":i,"valueLabel":label,"value":val,
                      **p,
                      "changedFromBaseline":p["revertSelector"]!=baseline_sel or p["success"]!=baseline["success"]
                  })
              for label,val in numeric_values:
                  f=zero.copy();f[i]=val
                  p=parse(call(encode(OWNER,f)))
                  singles.append({
                      "name":f"field{i}={label}",
                      "field":i,"valueLabel":label,"value":str(val),
                      **p,
                      "changedFromBaseline":p["revertSelector"]!=baseline_sel or p["success"]!=baseline["success"]
                  })

          combos=[]
          candidates=[
              ("f0=WETH,f1=NVDA",[WETH,NVDA,0,0,0,0]),
              ("f0=NVDA,f1=WETH",[NVDA,WETH,0,0,0,0]),
              ("f0=ROUTER,f1=NVDA",[ROUTER,NVDA,0,0,0,0]),
              ("f0=NVDA,f1=ROUTER",[NVDA,ROUTER,0,0,0,0]),
              ("WETH,NVDA,target,max,fee,deadline",[WETH,NVDA,target_nvda,max_weth,500,now+300]),
              ("NVDA,WETH,target,max,fee,deadline",[NVDA,WETH,target_nvda,max_weth,500,now+300]),
              ("ROUTER,NVDA,target,max,fee,deadline",[ROUTER,NVDA,target_nvda,max_weth,500,now+300]),
              ("NVDA,ROUTER,target,max,fee,deadline",[NVDA,ROUTER,target_nvda,max_weth,500,now+300]),
              ("WETH,NVDA,max,target,fee,deadline",[WETH,NVDA,max_weth,target_nvda,500,now+300]),
          ]
          for name,f in candidates:
              p=parse(call(encode(OWNER,f)))
              combos.append({
                  "name":name,
                  "fields":[str(x) for x in f],
                  **p,
                  "changedFromBaseline":p["revertSelector"]!=baseline_sel or p["success"]!=baseline["success"]
              })

          # Authorization sanity check on best structurally plausible combo.
          auth_fields=[WETH,NVDA,target_nvda,max_weth,500,now+300]
          outsider=parse(call(encode(OWNER,auth_fields),OUTSIDER))

          transition_fields=sorted(set(x["field"] for x in singles if x["changedFromBaseline"]))
          transitions=[]
          for x in singles+combos:
              if x["changedFromBaseline"]:
                  transitions.append({
                      "name":x["name"],
                      "from":baseline_sel or baseline["observation"],
                      "to":x["revertSelector"] or ("SUCCESS" if x["success"] else x["observation"])
                  })

          report={
              "project":"Rustee Broker Differential ABI Recovery v3.8",
              "network":"Robinhood Chain Mainnet",
              "chainId":CHAIN,
              "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "selector":SEL,
              "binding":{
                  "pass":binding_pass,"owner":owner_actual,
                  "registry":registry_actual,
                  "token":{"chainId":token_chain,"tokenContract":token_contract,"tokenId":token_id}
              },
              "baseline":{
                  "fields":["0"]*6,
                  **baseline
              },
              "singleFieldProbes":singles,
              "combinationProbes":combos,
              "authorization":{
                  "outsiderProbe":outsider,
                  "outsiderRejected":not outsider["success"]
              },
              "analysis":{
                  "transitionFields":transition_fields,
                  "transitions":transitions,
                  "interpretation":
                      "A revert-selector transition means the mutated field allowed execution to advance to a different validation stage."
              },
              "executionGate":{
                  "ready":False,
                  "verdict":"DIFFERENTIAL ABI RECOVERY ONLY",
                  "assetFundingAllowed":False,
                  "approvalAllowed":False,
                  "unpauseAllowed":False,
                  "broadcastAllowed":False
              }
          }

          with open("data/differential-abi-recovery.json","w") as f:
              json.dump(report,f,indent=2)

          print("Baseline",baseline_sel)
          print("Transition fields",transition_fields)
          print("Transitions",len(transitions))
          PY

      - name: Validate report
        shell: bash
        run: |
          set -euo pipefail
          test -s data/differential-abi-recovery.json
          python3 <<'PY'
          import json
          p=json.load(open("data/differential-abi-recovery.json"))
          assert p["chainId"]==4663
          assert p["binding"]["pass"] is True
          assert p["selector"]=="0x6c606ce7"
          assert len(p["singleFieldProbes"]) >= 60
          assert p["executionGate"]["broadcastAllowed"] is False
          print("PASS v3.8")
          PY

      - name: Build deterministic Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data
          cp index.html site/index.html
          cp data/differential-abi-recovery.json site/data/differential-abi-recovery.json
          test -s site/index.html
          test -s site/data/differential-abi-recovery.json
          find site -maxdepth 3 -type f -print

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload deterministic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
