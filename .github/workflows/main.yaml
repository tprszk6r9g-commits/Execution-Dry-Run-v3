name: Rustee STONKBROKER Production Input Discovery v4.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-stonkbroker-v43
  cancel-in-progress: true

jobs:
  production-input-discovery:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Establish authoritative Robinhood Chain facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 <<'PY'
          import datetime, json, urllib.request
          from pathlib import Path

          docs = {
              "connecting": "https://docs.robinhood.com/chain/connecting/",
              "contracts": "https://docs.robinhood.com/chain/contracts/",
              "dataStreams": "https://docs.robinhood.com/chain/data-streams/",
              "stockTokenApis": "https://docs.robinhood.com/chain/stock-token-apis/",
          }

          pages = {}
          for key, url in docs.items():
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "text/html",
                      "User-Agent": "Rustee-Broker-v4.3-read-only-discovery"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  pages[key] = response.read().decode("utf-8", "replace")

          connecting = pages["connecting"]
          contracts = pages["contracts"]
          streams = pages["dataStreams"]
          stockapis = pages["stockTokenApis"]

          canonical_weth = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          verifier = "0xcE73c8ad08CBDEaCa6078BF0627C8fe0a9a536E7"
          public_rpc = "https://rpc.mainnet.chain.robinhood.com"
          sequencer_feed = "wss://feed.mainnet.chain.robinhood.com"

          checks = {
              "chainId4663Documented": "4663" in connecting,
              "canonicalWethDocumented": canonical_weth.lower() in contracts.lower(),
              "dataStreamsVerifierDocumented": verifier.lower() in streams.lower(),
              "publicRpcDocumented": public_rpc in connecting,
              "publicRpcProductionWarningDocumented":
                  ("not recommended for production" in connecting.lower())
                  or ("rate-limited" in connecting.lower()),
              "websocketSequencerFeedDocumented": sequencer_feed in connecting,
              "stockRestVsOnchainMultiplierDifferenceDocumented":
                  ("not multiplier-adjusted" in stockapis.lower())
                  and ("multiplier-adjusted" in stockapis.lower()),
          }

          if not all(checks.values()):
              raise SystemExit(
                  "Authoritative Robinhood documentation checks changed; "
                  "manual review required before trusting v4.3."
              )

          report = {
              "project": "Rustee Broker Production Input Discovery v4.3",
              "network": "Robinhood Chain Mainnet",
              "chainId": 4663,
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mode": "READ_ONLY_NO_MAINNET_WRITES",
              "authoritativeSources": docs,
              "verifiedFacts": {
                  "canonicalWeth": canonical_weth,
                  "dataStreamsVerifierProxy": verifier,
                  "publicRpc": public_rpc,
                  "publicRpcIsProductionRecommended": False,
                  "documentedSequencerFeedType": "WEBSOCKET",
                  "documentedSequencerFeed": sequencer_feed,
                  "aggregatorV3SequencerUptimeFeedDocumentedByRobinhood": False,
                  "stockRestPricesAreMultiplierAdjusted": False,
                  "stockOnchainChainlinkPricesAreMultiplierAdjusted": True,
              },
              "documentationChecks": checks,
          }

          Path("data/official-facts.json").write_text(
              json.dumps(report, indent=2)
          )
          PY

      - name: Probe deployed Rustee bindings and production input candidates
        shell: bash
        env:
          WETH_USD_FEED_ADDRESS: ${{ vars.WETH_USD_FEED_ADDRESS }}
          STONKBROKER_USD_FEED_ADDRESS: ${{ vars.STONKBROKER_USD_FEED_ADDRESS }}
          WETH_USD_FEED_PROVENANCE_URL: ${{ vars.WETH_USD_FEED_PROVENANCE_URL }}
          STONKBROKER_USD_FEED_PROVENANCE_URL: ${{ vars.STONKBROKER_USD_FEED_PROVENANCE_URL }}
          WETH_HEARTBEAT_SECONDS: ${{ vars.WETH_HEARTBEAT_SECONDS }}
          STONKBROKER_HEARTBEAT_SECONDS: ${{ vars.STONKBROKER_HEARTBEAT_SECONDS }}
          SEQUENCER_FEED_ADDRESS: ${{ vars.SEQUENCER_FEED_ADDRESS }}
          PRODUCTION_ADAPTER_ADDRESS: ${{ vars.PRODUCTION_ADAPTER_ADDRESS }}
        run: |
          set -euo pipefail

          RPC="https://rpc.mainnet.chain.robinhood.com"
          OWNER="0x8fC320c8582f812695b6f62b2b5d13B14475B955"
          NFT="0x4523467c4ddc6d775c7ead4dce7656dce54e7f60"
          REGISTRY="0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199"
          TBA="0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654"
          WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          STONK="0xe934e36A439C94017B64a3FecE66AF12099aBF50"
          ROUTER="0xCaf681a66D020601342297493863E78C959E5cb2"

          for A in "$NFT" "$REGISTRY" "$TBA" "$WETH" "$STONK" "$ROUTER"; do
            test "$(cast code "$A" --rpc-url "$RPC")" != "0x"
          done

          OWNER_ACTUAL="$(cast call "$TBA" 'owner()(address)' --rpc-url "$RPC")"
          REG_ACTUAL="$(cast call "$TBA" 'registry()(address)' --rpc-url "$RPC")"
          TOKEN_RAW="$(cast call "$TBA" 'token()(uint256,address,uint256)' --rpc-url "$RPC")"
          POLICY="$(cast call "$REGISTRY" 'tradingPolicy()(uint128,uint128,uint32,bool)' --rpc-url "$RPC" 2>/dev/null || true)"

          probe_feed () {
            local NAME="$1"
            local ADDR="$2"
            local OUT="data/${NAME}.json"

            if [ -z "$ADDR" ]; then
              printf '{"present":false,"status":"NOT_PROVIDED"}\n' > "$OUT"
              return 0
            fi

            CODE="$(cast code "$ADDR" --rpc-url "$RPC" 2>/dev/null || true)"
            if [ -z "$CODE" ] || [ "$CODE" = "0x" ]; then
              python3 - "$ADDR" "$OUT" <<'PY'
          import json, sys
          open(sys.argv[2],"w").write(json.dumps({
            "present": True,
            "address": sys.argv[1],
            "hasCode": False,
            "aggregatorV3Readable": False,
            "status": "REJECTED_NO_CODE"
          }, indent=2))
          PY
              return 0
            fi

            DECIMALS="$(cast call "$ADDR" 'decimals()(uint8)' --rpc-url "$RPC" 2>/dev/null || true)"
            DESCRIPTION="$(cast call "$ADDR" 'description()(string)' --rpc-url "$RPC" 2>/dev/null || true)"
            ROUND="$(cast call "$ADDR" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC" 2>/dev/null || true)"

            python3 - "$ADDR" "$DECIMALS" "$DESCRIPTION" "$ROUND" "$OUT" <<'PY'
          import json, re, sys
          addr, decimals, description, round_raw, out = sys.argv[1:]
          nums = re.findall(r"-?\d+", round_raw or "")
          answer = int(nums[1]) if len(nums) >= 5 else None
          updated = int(nums[3]) if len(nums) >= 5 else None
          obj = {
              "present": True,
              "address": addr,
              "hasCode": True,
              "decimalsRaw": decimals.strip() or None,
              "descriptionRaw": description.strip() or None,
              "latestRoundDataRaw": round_raw.strip() or None,
              "aggregatorV3Readable": len(nums) >= 5,
              "answerPositive": answer is not None and answer > 0,
              "updatedAt": updated,
          }
          obj["status"] = (
              "CANDIDATE_INTERFACE_PASS"
              if obj["aggregatorV3Readable"] and obj["answerPositive"]
              else "REJECTED_INTERFACE_OR_PRICE"
          )
          open(out,"w").write(json.dumps(obj,indent=2))
          PY
          }

          probe_feed "weth-feed" "${WETH_USD_FEED_ADDRESS:-}"
          probe_feed "stonk-feed" "${STONKBROKER_USD_FEED_ADDRESS:-}"

          if [ -n "${SEQUENCER_FEED_ADDRESS:-}" ]; then
            SEQ_CODE="$(cast code "$SEQUENCER_FEED_ADDRESS" --rpc-url "$RPC" 2>/dev/null || true)"
            SEQ_ROUND="$(cast call "$SEQUENCER_FEED_ADDRESS" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC" 2>/dev/null || true)"
          else
            SEQ_CODE=""
            SEQ_ROUND=""
          fi

          if [ -n "${PRODUCTION_ADAPTER_ADDRESS:-}" ]; then
            ADAPTER_CODE="$(cast code "$PRODUCTION_ADAPTER_ADDRESS" --rpc-url "$RPC" 2>/dev/null || true)"
          else
            ADAPTER_CODE=""
          fi

          export OWNER_ACTUAL REG_ACTUAL TOKEN_RAW POLICY
          export SEQ_CODE SEQ_ROUND ADAPTER_CODE

          python3 <<'PY'
          import datetime, hashlib, json, os, re
          from pathlib import Path

          def readj(path):
              return json.loads(Path(path).read_text())

          def valid_addr(v):
              return bool(v and re.fullmatch(r"0x[0-9a-fA-F]{40}", v))

          official = readj("data/official-facts.json")
          weth = readj("data/weth-feed.json")
          stonk = readj("data/stonk-feed.json")

          owner = os.environ["OWNER_ACTUAL"].strip().lower()
          registry = os.environ["REG_ACTUAL"].strip().lower()
          token_raw = os.environ["TOKEN_RAW"].strip()

          seq_addr = os.getenv("SEQUENCER_FEED_ADDRESS") or None
          seq_round = os.getenv("SEQ_ROUND", "")
          seq_nums = re.findall(r"-?\d+", seq_round)
          seq_agg = len(seq_nums) >= 5

          adapter_addr = os.getenv("PRODUCTION_ADAPTER_ADDRESS") or None
          adapter_code = os.getenv("ADAPTER_CODE", "")
          adapter_has_code = bool(adapter_code and adapter_code != "0x")

          runtime_sha = None
          if adapter_has_code:
              raw = bytes.fromhex(adapter_code[2:])
              runtime_sha = hashlib.sha256(raw).hexdigest()

          expected_runtime_sha = (
              "224de783890705c83c9556ee4b50855ec421f482ad5e8d425bcd649c55bc196d"
          )

          weth_prov = os.getenv("WETH_USD_FEED_PROVENANCE_URL") or None
          stonk_prov = os.getenv("STONKBROKER_USD_FEED_PROVENANCE_URL") or None
          weth_hb = os.getenv("WETH_HEARTBEAT_SECONDS") or None
          stonk_hb = os.getenv("STONKBROKER_HEARTBEAT_SECONDS") or None

          binding = {
              "owner": owner,
              "registry": registry,
              "tokenRaw": token_raw,
              "ownerMatches":
                  owner == "0x8fc320c8582f812695b6f62b2b5d13b14475b955",
              "registryMatches":
                  registry == "0xa36a28f160d9cf0bb924c2ed5a1263dd11e54199",
          }

          feed_ready = (
              weth.get("status") == "CANDIDATE_INTERFACE_PASS"
              and stonk.get("status") == "CANDIDATE_INTERFACE_PASS"
              and bool(weth_prov)
              and bool(stonk_prov)
              and bool(weth_hb)
              and bool(stonk_hb)
          )

          # Robinhood documents a websocket sequencer feed. The currently
          # deployed Registry expects an address-based AggregatorV3-style
          # uptime source, so absence of a separately proven compatible
          # contract remains a blocker.
          sequencer = {
              "repositoryVariableAddress": seq_addr,
              "addressValid": valid_addr(seq_addr),
              "hasCode": bool(os.getenv("SEQ_CODE") and os.getenv("SEQ_CODE") != "0x"),
              "aggregatorV3Readable": seq_agg,
              "robinhoodDocumentedFeed":
                  official["verifiedFacts"]["documentedSequencerFeed"],
              "robinhoodDocumentedFeedType": "WEBSOCKET",
              "compatibleWithCurrentRegistryProven":
                  valid_addr(seq_addr) and seq_agg,
          }

          adapter = {
              "candidateName": "RusteeStonkbrokerV3Adapter",
              "expectedRuntimeBytecodeSha256": expected_runtime_sha,
              "productionAddress": adapter_addr,
              "addressValid": valid_addr(adapter_addr),
              "hasCode": adapter_has_code,
              "observedRuntimeBytecodeSha256": runtime_sha,
              "runtimeFingerprintMatches":
                  runtime_sha == expected_runtime_sha if runtime_sha else False,
          }

          blockers = []
          if not weth.get("present"):
              blockers.append("WETH/USD AggregatorV3 candidate not supplied")
          elif weth.get("status") != "CANDIDATE_INTERFACE_PASS":
              blockers.append("WETH/USD candidate failed AggregatorV3/positive-price probe")
          if not weth_prov:
              blockers.append("WETH/USD authoritative provenance URL not supplied")
          if not weth_hb:
              blockers.append("WETH/USD heartbeat/staleness threshold not finalized")

          if not stonk.get("present"):
              blockers.append("STONKBROKER/USD valuation oracle candidate not supplied")
          elif stonk.get("status") != "CANDIDATE_INTERFACE_PASS":
              blockers.append("STONKBROKER/USD candidate failed AggregatorV3/positive-price probe")
          if not stonk_prov:
              blockers.append("STONKBROKER/USD authoritative provenance URL not supplied")
          if not stonk_hb:
              blockers.append("STONKBROKER/USD heartbeat/staleness threshold not finalized")

          if not sequencer["compatibleWithCurrentRegistryProven"]:
              blockers.append(
                  "No independently proven AggregatorV3-compatible sequencer uptime "
                  "feed for the current Registry design"
              )

          if not adapter["runtimeFingerprintMatches"]:
              blockers.append(
                  "Production RusteeStonkbrokerV3Adapter deployment/fingerprint "
                  "not independently verified"
              )

          blockers.append("Independent security review still required before any mainnet write")

          report = {
              "project": "Rustee Broker Production Input Discovery v4.3",
              "network": "Robinhood Chain Mainnet",
              "chainId": 4663,
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "mode": "READ_ONLY_NO_MAINNET_WRITES",
              "binding": binding,
              "currentMainnetTradingPolicyRaw": os.getenv("POLICY") or None,
              "officialDiscovery": official["verifiedFacts"],
              "valuationFeeds": {
                  "wethUsd": {
                      **weth,
                      "provenanceUrl": weth_prov,
                      "heartbeatSeconds": weth_hb,
                  },
                  "stonkbrokerUsd": {
                      **stonk,
                      "provenanceUrl": stonk_prov,
                      "heartbeatSeconds": stonk_hb,
                  },
              },
              "sequencerCompatibility": sequencer,
              "candidateProductionAdapter": adapter,
              "readiness": {
                  "bindingVerified":
                      binding["ownerMatches"] and binding["registryMatches"],
                  "valuationFeedsReady": feed_ready,
                  "sequencerCompatibilityProven":
                      sequencer["compatibleWithCurrentRegistryProven"],
                  "productionAdapterFingerprintVerified":
                      adapter["runtimeFingerprintMatches"],
                  "productionRpcMigrationRequired": True,
                  "independentSecurityReviewComplete": False,
              },
              "remainingBlockers": blockers,
              "executionGate": {
                  "mainnetAdapterDeploymentAllowed": False,
                  "mainnetRegistryWritesAllowed": False,
                  "mainnetFundingAllowed": False,
                  "mainnetApprovalAllowed": False,
                  "mainnetTradeAllowed": False,
                  "mainnetUnpauseAllowed": False,
                  "mainnetBroadcastAllowed": False,
                  "verdict": (
                      "PRODUCTION INPUT DISCOVERY COMPLETE; VERIFIED INPUTS RECORDED; "
                      "UNRESOLVED INPUTS BLOCK CONFIGURATION; ZERO MAINNET WRITES"
                  ),
              },
          }

          Path("data/v4.3-production-input-discovery.json").write_text(
              json.dumps(report, indent=2)
          )

          assert report["binding"]["ownerMatches"]
          assert report["binding"]["registryMatches"]
          assert report["executionGate"]["mainnetBroadcastAllowed"] is False
          PY

      - name: Validate v4.3 no-write gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p=json.load(open("data/v4.3-production-input-discovery.json"))
          assert p["chainId"] == 4663
          assert p["mode"] == "READ_ONLY_NO_MAINNET_WRITES"
          assert p["binding"]["ownerMatches"] is True
          assert p["binding"]["registryMatches"] is True
          gate=p["executionGate"]
          assert gate["mainnetAdapterDeploymentAllowed"] is False
          assert gate["mainnetRegistryWritesAllowed"] is False
          assert gate["mainnetFundingAllowed"] is False
          assert gate["mainnetApprovalAllowed"] is False
          assert gate["mainnetTradeAllowed"] is False
          assert gate["mainnetUnpauseAllowed"] is False
          assert gate["mainnetBroadcastAllowed"] is False
          print("PASS: v4.3 read-only production-input gate")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
