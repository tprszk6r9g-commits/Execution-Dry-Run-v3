name: Refresh Robinhood prices + deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Robinhood stock-token snapshots
        run: python scripts/update_robinhood_snapshots.py

      # Self-contained on purpose: this repo may not yet contain
      # scripts/update_rustee_history.py.
      - name: Build Rustee history snapshot
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BLOCKSCOUT = "https://robinhoodchain.blockscout.com"
          OUT = Path("data/rustee-history.json")
          ADDRESSES = {
              "OWNER": "0x8fC320c8582f812695b6f62b2b5d13B14475B955",
              "VAULT": "0x8ad8bd35d33dd7b4d0de81f809f5b7f92623956d",
              "TRADING": "0x522f5637f2c556aad9b2245f3b8e6bf4dfd9a654",
              "REWARDS": "0xfd0d881d73ec1476f5da0ab78283149ea21c3b32",
              "IDENTITY": "0x496d7d47ae69d65d714413f0dc78c712ed92158d",
          }

          def now():
              return dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def get_json(url):
              last = None
              for attempt in range(3):
                  req = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json", "User-Agent": "Rustee-GitHub-Pages/2.8.9"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(0.75 * (2 ** attempt))
              raise RuntimeError(last)

          def fetch(address):
              base = f"{BLOCKSCOUT}/api/v2/addresses/{address}/token-transfers"
              params = {"type": "ERC-20"}
              rows = []
              seen = set()
              for _ in range(20):
                  url = base + "?" + urllib.parse.urlencode(params)
                  payload = get_json(url)
                  page = payload.get("items") or []
                  if isinstance(page, list):
                      rows.extend(page)
                  nxt = payload.get("next_page_params")
                  if not isinstance(nxt, dict) or not nxt:
                      break
                  cursor = json.dumps(nxt, sort_keys=True)
                  if cursor in seen:
                      break
                  seen.add(cursor)
                  params = {"type": "ERC-20", **{str(k): str(v) for k, v in nxt.items() if v is not None}}
              return rows

          OUT.parent.mkdir(parents=True, exist_ok=True)
          by_address = {}
          failures = {}

          for label, address in ADDRESSES.items():
              try:
                  rows = fetch(address)
                  by_address[address.lower()] = rows
                  print(f"[history] {label}: {len(rows)} transfers")
              except Exception as exc:
                  failures[label] = str(exc)
                  print(f"[history] WARNING {label}: {exc}")

          # Do not break the entire Pages deployment on a temporary indexer outage.
          # If every request failed, retain any previous byAddress snapshot if present.
          if not by_address and OUT.exists():
              try:
                  previous = json.loads(OUT.read_text(encoding="utf-8"))
                  old = previous.get("byAddress")
                  if isinstance(old, dict):
                      by_address = old
                      print(f"[history] retained prior snapshot: {len(by_address)} addresses")
              except Exception:
                  pass

          payload = {
              "generatedAt": now(),
              "chainId": 4663,
              "source": f"{BLOCKSCOUT}/api/v2/addresses/{{address}}/token-transfers?type=ERC-20",
              "byAddress": by_address,
              "failures": failures,
          }
          OUT.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"[history] wrote {OUT}; addresses={len(by_address)}")
          PY

      # Also self-contained so this workflow does not require
      # scripts/update_integrity.py to exist in the repository.
      - name: Regenerate frontend integrity manifest
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path

          targets = [
              Path("index.html"),
              Path("data/robinhood-assets.json"),
              Path("data/robinhood-prices.json"),
              Path("data/rustee-history.json"),
          ]
          missing = [str(p) for p in targets if not p.is_file()]
          if missing:
              raise SystemExit("Missing integrity target(s): " + ", ".join(missing))

          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in targets}
          payload = {
              "generatedAt": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "algorithm": "SHA-256",
              "sha256": hashes,
          }
          Path("data/integrity.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("[integrity] manifest regenerated")
          for path, digest in hashes.items():
              print(path, digest)
          PY

      - name: Verify snapshots
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assets = json.loads(Path("data/robinhood-assets.json").read_text())
          prices = json.loads(Path("data/robinhood-prices.json").read_text())
          history = json.loads(Path("data/rustee-history.json").read_text())
          integrity = json.loads(Path("data/integrity.json").read_text())

          assert assets.get("chainId") == 4663
          assert len(assets.get("assets", [])) > 0
          assert prices.get("chainId") == 4663
          assert len(prices.get("quotesBySymbol", {})) > 0
          assert history.get("chainId") == 4663
          assert history.get("generatedAt")
          assert isinstance(history.get("byAddress"), dict)
          assert integrity.get("generatedAt")
          assert set(integrity.get("sha256", {})) == {
              "index.html",
              "data/robinhood-assets.json",
              "data/robinhood-prices.json",
              "data/rustee-history.json",
          }

          print("Assets:", len(assets["assets"]))
          print("Quotes:", len(prices["quotesBySymbol"]))
          print("History addresses:", len(history["byAddress"]))
          print("Generated:", prices.get("generatedAt"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
