name: Deploy Rustee Policy + Fork Gate v3.5

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-v35-pages
  cancel-in-progress: true

jobs:
  simulate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build atomic NVDA snapshot + target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 <<'PY'
          import json, urllib.request, datetime, time, pathlib, os
          A="https://api.robinhood.com/rhj/assets"
          P="https://api.robinhood.com/rhj/prices/NVDA"
          def get(u):
              last=None
              for i in range(4):
                  try:
                      req=urllib.request.Request(u,headers={"Accept":"application/json","User-Agent":"Rustee-v3.5"})
                      with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read())
                  except Exception as e:
                      last=e
                      if i<3:time.sleep(2**i)
              raise RuntimeError(last)
          aj,pj=get(A),get(P)
          assets=aj.get("assets",[]); quotes=pj.get("quotes",[])
          asset=next(x for x in assets if x.get("tokenSymbol")=="NVDA")
          quote=next(x for x in quotes if x.get("tokenSymbol")=="NVDA")
          dep=next(d for d in asset["deployments"] if int(d["chainId"])==4663)
          assert dep["contractAddress"].lower()=="0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC".lower()
          assert asset["status"]=="ASSET_STATUS_ACTIVE"
          assert quote["isTradingHalt"] is False
          ask=float(quote["ask"])
          target=int((4.975/ask)*1e18)
          snap={"ok":True,"generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),"chainId":4663,"asset":asset,"quote":quote,"targetNvdaWei":str(target)}
          pathlib.Path("data/nvda-snapshot.json").write_text(json.dumps(snap,indent=2))
          pathlib.Path("data/target.env").write_text(f"TARGET_NVDA_WEI={target}\n")
          print("TARGET_NVDA_WEI",target)
          PY

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run forked funded route simulation
        shell: bash
        run: |
          set -euo pipefail
          source data/target.env
          export TARGET_NVDA_WEI
          forge test \
            --fork-url https://rpc.mainnet.chain.robinhood.com \
            --match-test testForkedFundedClassicRoute \
            -vv

      - name: Validate fork report
        shell: bash
        run: |
          set -euo pipefail
          test -s data/fork-simulation.json
          python3 <<'PY'
          import json
          p=json.load(open("data/fork-simulation.json"))
          assert p["ok"] is True
          assert p["chainId"]==4663
          assert p["routerExecutionSucceeded"] is True
          assert int(p["nvdaReceivedWei"]) > 0
          print("PASS: forked funded route simulation")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
