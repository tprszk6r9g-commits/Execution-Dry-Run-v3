name: Deploy Rustee Execution Dry-Run v3.1

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-execution-dryrun-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Robinhood NVDA read-only snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          echo "Fetching Robinhood stock-token asset metadata..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/json" \
            -H "User-Agent: Rustee-Broker-ReadOnly-Verifier/3.1" \
            "https://api.robinhood.com/rhj/assets" \
            -o data/robinhood-assets.json

          echo "Fetching NVDA market snapshot..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/json" \
            -H "User-Agent: Rustee-Broker-ReadOnly-Verifier/3.1" \
            "https://api.robinhood.com/rhj/prices/NVDA" \
            -o data/nvda-price.json

      - name: Validate snapshot
        shell: bash
        run: |
          python <<'PY'
          import json
          import datetime
          import pathlib

          data_dir = pathlib.Path("data")

          required = [
              "robinhood-assets.json",
              "nvda-price.json",
          ]

          for filename in required:
              path = data_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"Missing required snapshot: {filename}"
                  )

              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  raise SystemExit(
                      f"Invalid JSON in {filename}: {exc}"
                  )

              print(f"PASS: {filename}")

          metadata = {
              "generatedAt": (
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat()
              ),
              "network": "Robinhood Chain Mainnet",
              "chainId": 4663,
              "symbol": "NVDA",
              "readOnly": True,
              "source": "Robinhood RHJ API"
          }

          (
              data_dir / "snapshot-meta.json"
          ).write_text(
              json.dumps(metadata, indent=2)
          )

          print("PASS: snapshot-meta.json")
          print("Robinhood snapshot validation complete.")
          PY

      - name: Verify site files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f data/robinhood-assets.json
          test -f data/nvda-price.json
          test -f data/snapshot-meta.json

          echo "PASS: index.html"
          echo "PASS: Robinhood assets snapshot"
          echo "PASS: NVDA price snapshot"
          echo "PASS: snapshot metadata"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
